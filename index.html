    const change = () => surChange.forEach(f=>{ try { f(); } catch(e){} });
    async function recoit(txt){
      let u; try { u = await dechiffre(k, txt); } catch(e){ return; } // pas pour nous, ou abîmé
      if (u[0]===2){ // message coupé en morceaux : [2][id 8 o][rang][nombre][données]
        const id = "m"+hex(u.subarray(1,9)), i = u[9], n = u[10]; if (vus.has(id)) return;
        let p = morceaux.get(id); if (!p){ p = {n, m:[], t:Date.now()}; morceaux.set(id,p); }
        if (!p.m[i]) p.m[i] = u.slice(11);
        for (let j=0;j<p.n;j++) if (!p.m[j]) return;
        morceaux.delete(id); vus.set(id, Date.now()); u = cat(...p.m);
      }
      let m; try { m = JSON.parse(td.decode(u[0]===1 ? await gzip(u.subarray(1), false) : u.subarray(1))); } catch(e){ return; }
      if (!m || typeof m!=="object" || !m.id || vus.has(m.id)) return;
      vus.set(m.id, Date.now());
      if (Math.abs(Date.now()-(m.t||0)) > 15*60*1000) return; // vieux message rejoué
      ecoute.forEach(f=>{ try { f(m); } catch(e){ console.error(e); } });
    }
    const trs = listeRelais().map(s=>{
      if (s.startsWith("local:")) return transportLocal(k, recoit, change);
      if (s.startsWith("nostr:")) return window.NostrLite ? transportNostr(s.slice(6), k, recoit, change) : null;
      if (s.startsWith("mqtt:")) return transportMqtt(s.slice(5), k, recoit, change);
      return null;
    }).filter(Boolean);
    setInterval(()=>{ const lim = Date.now()-20*60*1000; vus.forEach((t,id)=>{ if (t<lim) vus.delete(id); }); morceaux.forEach((p,id)=>{ if (p.t<lim) morceaux.delete(id); }); }, 60000);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") trs.forEach(t=>t.reveille()); });
    addEventListener("online", ()=>trs.forEach(t=>t.reveille()));
    let file = Promise.resolve();
    function publie(m, cle){
      m.id = m.id || rid(9); m.t = Date.now(); vus.set(m.id, Date.now());
      const tache = file.then(async ()=>{
        const brut = te.encode(JSON.stringify(m)); let corps = brut, drapeau = 0;
        if (brut.length > 900 && window.CompressionStream){ try { corps = await gzip(brut, true); drapeau = 1; } catch(e){ corps = brut; drapeau = 0; } }
        const plein = cat(Uint8Array.of(drapeau), corps), MAX = 20000, trames = [];
        if (plein.length <= MAX) trames.push(plein);
        else { const id = crypto.getRandomValues(new Uint8Array(8)), n = Math.ceil(plein.length/MAX); if (n>250) throw new Error("trop gros");
          for (let i=0;i<n;i++) trames.push(cat(Uint8Array.of(2), id, Uint8Array.of(i,n), plein.subarray(i*MAX,(i+1)*MAX))); }
        const txts = []; for (const tr of trames) txts.push(await chiffre(k, tr));
        trs.forEach(t=>t.envoie(txts, cle));
      });
      file = tache.catch(()=>{});
      return tache;
    }
    return { publie, ecoute:f=>{ ecoute.add(f); return ()=>ecoute.delete(f); }, surChange:f=>{ surChange.add(f); return ()=>surChange.delete(f); },
      etat:()=>trs.map(t=>({nom:t.nom, ok:t.pret()})), connecte:()=>trs.some(t=>t.pret()) };
  }

  /* ---------- sauvegarde (même interface que la capacité db) ---------- */
  const DB = (() => {
    const cache = new Map(), ecoutes = new Map();
    const cle = p => "banc-db:"+p;
    async function lit(p){ if (cache.has(p)) return cache.get(p); let v = null; try { v = JSON.parse(await Stock.get(cle(p))||"null"); } catch(e){} cache.set(p, v); return v; }
    const snap = (p, v, distant) => ({ id:p.split("/").pop(), path:p, exists:!!(v && v.data!=null), distant:!!distant,
      data:()=> v && v.data!=null ? JSON.parse(JSON.stringify(v.data)) : undefined });
    function notifie(p, v, distant){ (ecoutes.get(p)||new Set()).forEach(f=>{ try { f(snap(p,v,distant)); } catch(e){ console.error(e); } }); }
    async function ecrit(p, data, distant){
      const v = {data, rev:Date.now()}; cache.set(p, v); await Stock.set(cle(p), JSON.stringify(v));
      if (!distant) Sync.change(p); notifie(p, v, distant); return v;
    }
    function doc(p){ return { id:p.split("/").pop(), path:p,
      async get(){ return snap(p, await lit(p)); },
      async set(data){ await ecrit(p, JSON.parse(JSON.stringify(data)), false); },
      async update(patch){ const v = await lit(p); await ecrit(p, Object.assign({}, v && v.data, JSON.parse(JSON.stringify(patch))), false); },
      async delete(){ cache.set(p, null); await Stock.del(cle(p)); notifie(p, null, false); },
      onSnapshot(f){ if (!ecoutes.has(p)) ecoutes.set(p, new Set()); ecoutes.get(p).add(f); lit(p).then(v=>f(snap(p,v,false))); return ()=>ecoutes.get(p).delete(f); } }; }
    return { doc, _lit:lit, _ecritDistant:(p,d)=>ecrit(p,d,true) };
  })();

  /* ---------- les deux appareils gardent chacun la classe et tous les résultats ----------
     banc/classe et banc/reglages : la version la plus récente gagne (champ maj) ;
     banc/resultats : les deux listes sont réunies (chaque essai a son identifiant ; un essai supprimé le reste partout). */
  const fusionResultats = (a, b) => {
    const m = new Map();
    for (const l of [a && a.liste, b && b.liste]) for (const r of (Array.isArray(l) ? l : [])){
      if (!r || typeof r.id!=="string") continue;
      const x = m.get(r.id);
      if (!x || (r.suppr && !x.suppr)) m.set(r.id, r);
    }
    return {liste:[...m.values()].sort((x,y)=>String(x.date||"").localeCompare(String(y.date||"")) || x.id.localeCompare(y.id))};
  };
  const sigResultats = d => (d && Array.isArray(d.liste) ? d.liste : []).map(r=>r.id+(r.suppr?"x":"")).sort().join(",");
  const plusRecent = (a, b) => !b ? a : (!a || (b.maj||0) > (a.maj||0)) ? b : a;
  const sigMaj = d => d ? String(d.maj||0)+":"+JSON.stringify(d).length : "";
  const Sync = (() => {
    const REGLES = {
      "banc/classe":   {fusion:plusRecent, sig:sigMaj, delai:500},
      "banc/reglages": {fusion:plusRecent, sig:sigMaj, delai:900},
      "banc/resultats":{fusion:fusionResultats, sig:sigResultats, delai:300}
    };
    const DOCS = Object.keys(REGLES);
    let room = null; const minuteurs = {};
    const pairsLa = () => room && room._pairs().length>0;
    async function envoieDoc(p){ const v = await DB._lit(p); if (!v || v.data==null || !room) return; room._publie({k:"db", path:p, data:v.data}, "db:"+p).catch(e=>console.warn("copie", e)); }
    function change(p, delai){
      if (!REGLES[p] || !pairsLa()) return;
      clearTimeout(minuteurs[p]); minuteurs[p] = setTimeout(()=>envoieDoc(p), delai!=null ? delai : REGLES[p].delai);
    }
    async function recoit(m){
      const R = m.k==="db" && REGLES[m.path];
      if (!R || !m.data || typeof m.data!=="object") return;
      const v = await DB._lit(m.path), ici = v && v.data, f = R.fusion(ici, m.data);
      if (R.sig(f)!==R.sig(ici)) await DB._ecritDistant(m.path, f); // ce qui manquait ici
      if (R.sig(f)!==R.sig(m.data)) change(m.path, 400);          // ce qui manquait là-bas
    }
    return { branche(r){ room = r; }, change, recoit, nouveauPair(){ DOCS.forEach((p,i)=>change(p, 300+i*250)); } };
  })();

  /* ---------- liaison (même interface que la capacité room) ---------- */
  function creeRoom(rel){
    const moi = {peer:rid(12), presence:{}};
    const pairs = new Map(), ecPairs = new Set(), ecSujets = new Map(), ecCo = new Set();
    const vue = p => ({peer:p.peer, isMe:p.peer===moi.peer, presence:JSON.parse(JSON.stringify(p.presence||{}))});
    const tous = () => [vue(moi)].concat([...pairs.values()].map(vue));
    const signale = (j,l) => { const ch = {peers:tous(), joined:j.map(vue), left:l.map(vue)}; ecPairs.forEach(f=>{ try { f(ch); } catch(e){ console.error(e); } }); };
    let rep = null;
    const coucou = () => rel.publie({k:"hb", f:moi.peer, p:moi.presence}, "hb").catch(()=>{});
    const ETATS = {ecran:1, defi:1}; // sujets qui décrivent un état complet : le dernier suffit
    rel.ecoute(m=>{
      if (m.f===moi.peer) return;
      if (m.k==="hb"){ const neuf = !pairs.has(m.f), p = pairs.get(m.f) || {peer:m.f}, avant = JSON.stringify(p.presence||null);
        p.presence = m.p && typeof m.p==="object" ? m.p : {}; p.vu = Date.now(); pairs.set(m.f, p);
        if (neuf){ signale([p],[]); clearTimeout(rep); rep = setTimeout(coucou, 150+Math.random()*350); Sync.nouveauPair(); }
        else if (avant!==JSON.stringify(p.presence)) signale([],[]);
        return; }
      if (m.k==="bye"){ const p = pairs.get(m.f); if (p){ pairs.delete(m.f); signale([],[p]); } return; }
      if (m.k==="ev" && typeof m.topic==="string"){ const s = ecSujets.get(m.topic); if (s){ const msg = {topic:m.topic, data:m.data, peer:m.f, isMe:false}; s.forEach(f=>{ try { f(msg); } catch(e){ console.error(e); } }); } return; }
      Sync.recoit(m);
    });
    setInterval(coucou, 8000);
    setInterval(()=>{ const lim = Date.now()-26000, partis = []; pairs.forEach((p,id)=>{ if (p.vu<lim){ pairs.delete(id); partis.push(p); } }); if (partis.length) signale([],partis); }, 2000);
    let co = false; rel.surChange(()=>{ const c = rel.connecte(); if (c && !co) coucou(); if (c!==co){ co = c; ecCo.forEach(f=>{ try { f(c); } catch(e){} }); } });
    addEventListener("pagehide", ()=>{ rel.publie({k:"bye", f:moi.peer}).catch(()=>{}); });
    coucou();
    const r = {
      presence(patch){ for (const k in patch||{}){ if (patch[k]===null) delete moi.presence[k]; else moi.presence[k] = patch[k]; } coucou(); return Promise.resolve(); },
      onPeers(f){ ecPairs.add(f); setTimeout(()=>{ if (ecPairs.has(f)){ const t = tous(); f({peers:t, joined:t, left:[]}); } }, 0); return ()=>ecPairs.delete(f); },
      emit(topic, data){ return rel.publie({k:"ev", f:moi.peer, topic, data}, ETATS[topic] ? "ev:"+topic : null).catch(()=>{}); },
      on(topic, f){ if (!ecSujets.has(topic)) ecSujets.set(topic, new Set()); ecSujets.get(topic).add(f); return ()=>ecSujets.get(topic).delete(f); },
      connected:()=>rel.connecte(),
      onConnection(f){ ecCo.add(f); return ()=>ecCo.delete(f); },
      leave(){ rel.publie({k:"bye", f:moi.peer}).catch(()=>{}); },
      _pairs:()=>[...pairs.values()].map(vue), _publie:(m,cle)=>rel.publie(Object.assign(m, {f:moi.peer}), cle), _etat:()=>rel.etat()
    };
    Sync.branche(r);
    return r;
  }

  /* ---------- code de liaison : l'écran de la classe le crée, le téléphone le reçoit (QR code ou code tapé) ---------- */
  const Liaison = (() => {
    let code = null, promesse = null, room = null;
    const CLE = P+"liaison";
    async function litCode(){
      const m = /[#&?]lien=([0-9A-Za-z-]+)/.exec(location.href);
      if (m){ const c = normalise(m[1]); if (c){ await Stock.set(CLE, c); return c; } }
      return normalise(await Stock.get(CLE));
    }
    function ouvre(){
      if (promesse) return promesse;
      promesse = (async()=>{
        code = await litCode();
        if (!code && role()==="ecran"){ code = nouveauCode(); await Stock.set(CLE, code); }
        if (!code) return null;
        room = creeRoom(creeRelais(await cles(code)));
        return room;
      })().catch(e=>{ console.error("liaison", e); return null; });
      return promesse;
    }
    /* adresse du site pour le téléphone : celle de la page, ou celle du site publié (page ouverte depuis un fichier, appli) */
    const WEB = () => (/^https?:$/.test(location.protocol) && !NATIF) ? location.href.replace(/[?#].*$/,"") : (window.BANC_WEB || "");
    return { ouvre, code:()=>code, normalise, WEB,
      lienTel:c=>WEB() ? WEB() + "#lien=" + (c||code) + "&tel" : "",
      async fixe(c){ c = normalise(c); if (!c) return false; await Stock.set(CLE, c); return true; },
      async oublie(){ await Stock.del(CLE); },
      async nouveau(){ const c = nouveauCode(); await Stock.set(CLE, c); return c; },
      etat:()=>room ? room._etat() : [], pairs:()=>room ? room._pairs() : [],
      qr(texte, taille){ if (!window.qrcode || !texte) return ""; const q = qrcode(0,"M"); q.addData(texte); q.make();
        return q.createSvgTag({cellSize:Math.max(2, Math.floor((taille||240)/(q.getModuleCount()+8))), margin:4, scalable:true}); } };
  })();

  /* ---------- téléchargements : fichier dans le navigateur, feuille de partage dans l'appli ---------- */
  const Telechargements = {
    async save({filename, data}){
      const nom = String(filename||"banc-des-maitres.json").replace(/[\\/:*?"<>|]/g,"-");
      if (NATIF){ const FS = plug("Filesystem"), Partage = plug("Share");
        if (FS && Partage){ const texte = typeof data==="string" ? data : JSON.stringify(data);
          const r = await FS.writeFile({path:nom, data:texte, directory:"CACHE", encoding:"utf8"});
          try { await Partage.share({title:nom, files:[r.uri]}); } catch(e){ throw {code:"cancelled", message:String(e && e.message || e)}; }
          return; } }
      const blob = data instanceof Blob ? data : new Blob([typeof data==="string" ? data : JSON.stringify(data)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    }
  };

  /* ---------- garder l'écran du téléphone allumé pendant le défi ---------- */
  let verrou = null;
  async function eveille(on){
    const KA = plug("KeepAwake");
    if (KA){ try { on ? await KA.keepAwake() : await KA.allowSleep(); } catch(e){} return; }
    try { if (on && navigator.wakeLock && !verrou) verrou = await navigator.wakeLock.request("screen"); else if (!on && verrou){ await verrou.release(); verrou = null; } } catch(e){}
  }

  window.claude = { use: async name => {
    if (name==="db") return DB;
    if (name==="room") return await Liaison.ouvre();
    if (name==="downloads") return Telechargements;
    return null;
  } };
  return { NATIF, Liaison, Stock, eveille, rid, normalise, role, changeRole, fusionResultats, lsG, lsS };
})();
window.Plateforme = Plateforme;

</script>
<script>
/* ---------- Le banc des maîtres : ce qui sert à l'écran de la classe comme au téléphone ---------- */
"use strict";
const Banc = (() => {
  const DATA = window.__BANC, EPS = DATA.episodes;
  const ROLE = Plateforme.role();
  document.documentElement.dataset.role = ROLE;
  const $ = s => document.querySelector(s);
  const el = (tag, attrs={}, html="") => { const e = document.createElement(tag); for (const k in attrs){ if (k==="class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html) e.innerHTML = html; return e; };
  const esc = s => String(s==null ? "" : s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const estMot = t => /[0-9A-Za-zÀ-ÖØ-öø-ÿœŒ]/.test(t);
  const nu = t => String(t).replace(/^[«“(\s ]+|[\s »”).,;:!?…]+$/g, ""); // le mot sans la ponctuation autour
  const ep = id => EPS.find(e=>e.id===id) || null;
  /* les mots du défi : toutes les pages du texte (sans le titre), dans l'ordre */
  function motsDefi(E){ const t = []; E.pages.slice(1).forEach((p,pi)=>p.toks.forEach((x,i)=>t.push({t:x[0], w:estMot(x[0]), pi, brk:i===0 && pi>0}))); return t; }
  const DUREE = () => /essai-rapide/.test(location.hash) ? 8 : 60;

  /* ---------- Données : la classe, les résultats, les réglages ----------
     Enregistrées sur l'appareil (et recopiées sur l'autre appareil à chaque liaison).
     banc/classe    : {eleves:[{id, nom, objectif}], maj}
     banc/resultats : {liste:[{id, eleve, ep, date, mclm, lus, erreurs, secondes, dernier, fautes:[n° des mots]} ou {id, suppr:true}]}
     banc/reglages  : {vitesse, maj} */
  const Donnees = (() => {
    let db = null, classe = null, resultats = {liste:[]}, reglages = {vitesse:0.8, maj:0};
    const ecoutes = new Set();
    const signale = quoi => ecoutes.forEach(f=>{ try { f(quoi); } catch(e){ console.error(e); } });
    const DEFAUT = () => ({eleves:[1,2,3,4].map(i=>({id:"e"+i, nom:"Élève "+i, objectif:""})), maj:0});
    const docs = {};
    /* sauvegarde de la première version (fichier « HORS LIGNE » de septembre, même navigateur) */
    function depuisV1(d){
      if (!d || !Array.isArray(d.students)) return null;
      const cl = {eleves:d.students.slice(0,12).map((s,i)=>({id:String(s.id||("e"+(i+1))), nom:String(s.name||("Élève "+(i+1))).slice(0,40), objectif:String(s.goal||"").replace(/[^0-9]/g,"")})), maj:Date.now()};
      const li = (Array.isArray(d.results) ? d.results : []).map(r=>({id:"v1-"+String(r.sid)+"-"+String(r.ep)+"-"+String(r.date), eleve:String(r.sid), ep:String(r.ep), date:String(r.date),
        mclm:+r.mclm||0, lus:+r.read||0, erreurs:+r.err||0, secondes:+r.secs||0}));
      return {classe:cl, resultats:{liste:li}, vitesse:+d.speed||0.8};
    }
    async function init(){
      db = await window.claude.use("db");
      docs.c = db.doc("banc/classe"); docs.r = db.doc("banc/resultats"); docs.g = db.doc("banc/reglages");
      let c = (await docs.c.get()).data(), r = (await docs.r.get()).data(), g = (await docs.g.get()).data();
      if (!c){ let v1 = null; try { v1 = depuisV1(JSON.parse(localStorage.getItem("banc-des-maitres:v1")||"null")); } catch(e){}
        if (v1 && v1.resultats.liste.length){ c = v1.classe; r = Plateforme.fusionResultats(r, v1.resultats); await docs.c.set(c); await docs.r.set(r); } }
      classe = c && Array.isArray(c.eleves) ? c : DEFAUT();
      resultats = r && Array.isArray(r.liste) ? r : {liste:[]};
      reglages = g && g.vitesse ? g : {vitesse:0.8, maj:0};
      docs.c.onSnapshot(s=>{ if (s.distant && s.exists){ classe = s.data(); signale("classe"); } });
      docs.r.onSnapshot(s=>{ if (s.distant && s.exists){ resultats = s.data(); signale("resultats"); } });
      docs.g.onSnapshot(s=>{ if (s.distant && s.exists){ reglages = s.data(); signale("reglages"); } });
    }
    const vivants = () => resultats.liste.filter(r=>!r.suppr && r.eleve && r.ep);
    /* les essais, avec leur numéro (par élève et par épisode, dans l'ordre des dates) */
    function essais(){
      const n = {};
      return vivants().slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(r=>{ const k = r.eleve+"|"+r.ep; n[k] = (n[k]||0)+1; return Object.assign({essai:n[k]}, r); });
    }
    async function ecritResultats(){ try { await docs.r.set(resultats); return true; } catch(e){ return false; } }
    return { init,
      eleves:()=>classe.eleves, eleve:id=>classe.eleves.find(e=>e.id===id)||null,
      nom:id=>{ const e = classe.eleves.find(x=>x.id===id); return e ? e.nom : "Élève"; },
      async enregistreEleves(liste){ classe = {eleves:liste, maj:Date.now()}; try { await docs.c.set(classe); signale("classe"); return true; } catch(e){ return false; } },
      essais, essaisDe:(eleve, epId)=>essais().filter(r=>r.eleve===eleve && (!epId || r.ep===epId)),
      record:(eleve, sauf)=>{ const l = vivants().filter(r=>r.eleve===eleve && r.id!==sauf); return l.length ? Math.max(...l.map(r=>r.mclm)) : null; },
      async ajoute(r){ if (resultats.liste.some(x=>x.id===r.id)) return true; resultats = {liste:resultats.liste.concat([r])}; const ok = await ecritResultats(); signale("resultats"); return ok; },
      async supprime(id){ resultats = {liste:resultats.liste.filter(x=>x.id!==id).concat([{id, suppr:true, date:new Date().toISOString()}])}; const ok = await ecritResultats(); signale("resultats"); return ok; },
      vitesse:()=>reglages.vitesse||0.8,
      async fixeVitesse(v){ reglages = {vitesse:v, maj:Date.now()}; try { await docs.g.set(reglages); } catch(e){} },
      surChange(f){ ecoutes.add(f); return ()=>ecoutes.delete(f); },
      sauvegarde:()=>({format:"banc-des-maitres/sauvegarde", version:2, date:new Date().toISOString(), classe, resultats, reglages}),
      /* importer une sauvegarde : la classe du fichier remplace celle-ci, les essais s'ajoutent à ceux qui sont déjà là */
      async importe(d){
        let cl = null, re = null, vi = null;
        if (d && d.format==="banc-des-maitres/sauvegarde"){ cl = d.classe; re = d.resultats; vi = d.reglages && d.reglages.vitesse; }
        else { const v1 = depuisV1(d); if (v1){ cl = v1.classe; re = v1.resultats; vi = v1.vitesse; } }
        if (!cl || !Array.isArray(cl.eleves) || !re || !Array.isArray(re.liste)) return false;
        classe = {eleves:cl.eleves, maj:Date.now()}; resultats = Plateforme.fusionResultats(resultats, re);
        await docs.c.set(classe); await ecritResultats(); if (vi) await this.fixeVitesse(vi);
        signale("classe"); signale("resultats"); return true;
      } };
  })();

  /* ---------- liaison avec l'autre appareil ---------- */
  const Lien = (() => {
    let room = null, autres = 0;
    const etats = new Set();
    const signale = () => etats.forEach(f=>{ try { f(autres>0); } catch(e){} });
    async function init(){
      room = await window.claude.use("room");
      if (!room) return null;
      room.presence({role:ROLE});
      room.onPeers(({peers})=>{ const n = peers.filter(p=>!p.isMe && p.presence && p.presence.role && p.presence.role!==ROLE).length; if (n!==autres){ autres = n; signale(); } });
      return room;
    }
    return { init, room:()=>room, relie:()=>autres>0,
      emit:(t,d)=>room ? room.emit(t,d) : Promise.resolve(), on:(t,f)=>room ? room.on(t,f) : ()=>{},
      surEtat(f){ etats.add(f); return ()=>etats.delete(f); } };
  })();

  /* ---------- résultat d'un défi ---------- */
  function calcule(E, eleve, elapsed, dernier, fautes){
    const toks = motsDefi(E);
    const lus = toks.slice(0, dernier+1).filter(x=>x.w).length;
    const err = [...fautes].filter(i=>i<=dernier && toks[i] && toks[i].w);
    const mclm = Math.round(Math.max(0, lus-err.length)*60/Math.max(elapsed,1));
    return {id:Plateforme.rid(8), eleve, ep:E.id, date:new Date().toISOString(), mclm, lus, erreurs:err.length, secondes:Math.round(elapsed), dernier, fautes:err.sort((a,b)=>a-b)};
  }
  /* ce qu'on affiche avec un résultat : record battu, essai précédent */
  function bilan(r){
    const avant = Donnees.essais().filter(x=>x.eleve===r.eleve && x.id!==r.id && x.date<=r.date);
    const record = avant.length ? Math.max(...avant.map(x=>x.mclm)) : null;
    const memes = avant.filter(x=>x.ep===r.ep);
    return {record, precedent:memes.length ? memes[memes.length-1].mclm : null, essai:memes.length+1, nouveau:record!==null && r.mclm>record, premier:record===null};
  }
  function motsDifficiles(r){
    const E = ep(r.ep); if (!E || !Array.isArray(r.fautes)) return [];
    const toks = motsDefi(E), vus = new Set(), res = [];
    r.fautes.forEach(i=>{ const m = toks[i] && nu(toks[i].t); if (m && !vus.has(m.toLowerCase())){ vus.add(m.toLowerCase()); res.push(m); } });
    return res;
  }
  function carteResultat(r, b, nomEleve, ok){
    const objectif = (Donnees.eleve(r.eleve)||{}).objectif;
    const durs = motsDifficiles(r);
    return `<div class="label">${esc(nomEleve)} · essai ${b.essai}</div><div class="big-num">${r.mclm}</div><div class="muted">mots lus correctement par minute</div>
      ${b.nouveau?`<div class="stamp">Nouveau record !</div>`:(b.premier?`<div class="stamp">Premier essai !</div>`:"")}
      <dl class="res"><dt>Mots lus</dt><dd>${r.lus}</dd><dt>Erreurs</dt><dd>${r.erreurs}</dd><dt>Temps</dt><dd>${r.secondes} s</dd>${b.precedent!==null?`<dt>Essai précédent</dt><dd>${b.precedent}</dd>`:""}${b.record!==null?`<dt>Record avant</dt><dd>${b.record}</dd>`:""}${objectif?`<dt>Objectif</dt><dd>${esc(objectif)}</dd>`:""}</dl>
      ${durs.length?`<div class="label" style="margin-top:10px">Mots à retravailler</div><div class="hard">${durs.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:""}
      ${ok===false?`<p class="muted" style="margin:10px 0 0">Impossible d'enregistrer sur cet appareil : note le résultat.</p>`:""}`;
  }

  /* ---------- courbe des progrès ---------- */
  function courbe(points, objectif, titre){
    const W=520,H=230,L=40,R=16,T=26,B=34;
    const maxV = Math.max(60, objectif||0, ...points.map(p=>p.v))*1.15;
    const x = i => points.length<2 ? L+(W-L-R)/2 : L+i*(W-L-R)/(points.length-1);
    const y = v => T+(H-T-B)*(1-v/maxV);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titre)}">`;
    [0, Math.round(maxV/2/10)*10, Math.round(maxV*0.9/10)*10].forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
    if (objectif) s += `<line x1="${L}" x2="${W-R}" y1="${y(objectif)}" y2="${y(objectif)}" stroke="var(--wood)" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-R}" y="${y(objectif)-6}" text-anchor="end" style="fill:var(--wood)">objectif ${objectif}</text>`;
    if (points.length){
      s += `<polyline fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round" points="${points.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
      const best = Math.max(...points.map(p=>p.v)), dense = points.length>9;
      points.forEach((p,i)=>{ s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.v===best?7:5}" fill="${p.v===best?"var(--green)":"var(--paper)"}" stroke="var(--green)" stroke-width="2.5"/>`+
        (!dense || p.v===best || i===points.length-1 ? `<text class="val" x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle">${p.v}</text>` : "")+
        (!dense || i%Math.ceil(points.length/8)===0 ? `<text x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(p.l)}</text>` : ""); });
    } else s += `<text x="${W/2}" y="${H/2}" text-anchor="middle">Pas encore de défi</text>`;
    return s+"</svg>";
  }

  /* ---------- vues partagées : progrès, élèves ---------- */
  function vueProgres(box, compacte){
    const es = Donnees.essais(), eleves = Donnees.eleves();
    box.innerHTML = `<h1 style="font-size:clamp(24px,3vw,40px)">Les progrès</h1><p class="lead">Le meilleur résultat de chaque élève au défi d'une minute, épisode par épisode (en mots lus correctement par minute).</p>
      <div class="tablewrap card" style="margin-top:16px"><table class="t" id="tab"></table></div><div class="grid2" id="charts"></div>
      <details class="all card" id="tous"><summary>Tous les essais (${es.length})</summary><div class="tablewrap"><table class="t" id="tab2"></table></div></details>
      <div class="row start" style="margin-top:18px"><button class="btn" id="exp">Exporter une sauvegarde</button><label class="btn" for="imp">Importer une sauvegarde</label><input type="file" id="imp" accept="application/json,.json" hidden><span class="muted" id="ioinfo"></span></div>
      <p class="muted" style="margin-top:10px">Les résultats sont enregistrés sur cet appareil${ROLE==="ecran"?" et recopiés dans le téléphone relié":" et recopiés sur l'écran de la classe relié"}. La sauvegarde est un fichier à garder en lieu sûr (clé USB, Drive).</p>`;
    const epsVus = EPS.filter(e=>!compacte || es.some(r=>r.ep===e.id));
    let h = `<thead><tr><th>Élève</th>${epsVus.map(e=>`<th class="n">É${e.num}</th>`).join("")}<th class="n">Objectif</th></tr></thead><tbody>`;
    eleves.forEach(st=>{ h += `<tr><td>${esc(st.nom)}</td>`+epsVus.map(e=>{ const rs = es.filter(r=>r.eleve===st.id && r.ep===e.id); return `<td class="n">${rs.length?Math.max(...rs.map(r=>r.mclm)):"—"}</td>`; }).join("")+`<td class="n">${st.objectif?esc(st.objectif):"—"}</td></tr>`; });
    box.querySelector("#tab").innerHTML = h+"</tbody>";
    eleves.forEach(st=>{
      const rs = es.filter(r=>r.eleve===st.id), c = el("div",{class:"card chart"});
      c.innerHTML = `<h3 style="font-size:20px">${esc(st.nom)}</h3><p class="muted" style="margin:2px 0 6px">Tous les défis, dans l'ordre</p>`+courbe(rs.map(r=>({v:r.mclm, l:"É"+r.ep.slice(1)+"·"+r.essai})), +st.objectif||0, `Progrès de ${st.nom}`);
      box.querySelector("#charts").appendChild(c);
    });
    let h2 = `<thead><tr><th>Date</th><th>Élève</th><th>Épisode</th><th class="n">Essai</th><th class="n">Mots/min</th><th class="n">Erreurs</th><th></th></tr></thead><tbody>`;
    es.slice().reverse().forEach(r=>{ const d = new Date(r.date);
      h2 += `<tr><td>${d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</td><td>${esc(Donnees.nom(r.eleve))}</td><td>É${esc(r.ep.slice(1))}</td><td class="n">${r.essai}</td><td class="n">${r.mclm}</td><td class="n">${r.erreurs}</td><td class="n"><button class="btn danger" data-suppr="${esc(r.id)}" style="min-height:40px">Supprimer</button></td></tr>`; });
    box.querySelector("#tab2").innerHTML = h2+"</tbody>";
    box.querySelector("#tab2").addEventListener("click", async e=>{ const b = e.target.closest("[data-suppr]"); if (!b) return;
      if (b.dataset.sur!=="1"){ b.dataset.sur = "1"; b.textContent = "Confirmer ?"; return; }
      await Donnees.supprime(b.dataset.suppr); vueProgres(box, compacte); box.querySelector("#tous").open = true; });
    box.querySelector("#exp").onclick = async ()=>{ const info = box.querySelector("#ioinfo");
      try { const dl = await window.claude.use("downloads"); const j = new Date().toISOString().slice(0,10);
        await dl.save({filename:`banc-des-maitres-sauvegarde-${j}.json`, data:JSON.stringify(Donnees.sauvegarde(), null, 1)}); info.textContent = "Sauvegarde enregistrée."; }
      catch(e){ info.textContent = e && e.code==="cancelled" ? "" : "La sauvegarde n'est pas possible ici."; } };
    box.querySelector("#imp").onchange = async e=>{ const f = e.target.files[0]; if (!f) return; const info = box.querySelector("#ioinfo");
      try { const ok = await Donnees.importe(JSON.parse(await f.text())); if (!ok) throw 0; vueProgres(box, compacte); box.querySelector("#ioinfo").textContent = "Sauvegarde importée."; }
      catch(err){ info.textContent = "Ce fichier n'est pas une sauvegarde du banc des maîtres."; } };
  }
  function vueEleves(box){
    const liste = Donnees.eleves().map(e=>Object.assign({}, e));
    box.innerHTML = `<h1 style="font-size:clamp(24px,3vw,40px)">Les élèves du groupe</h1><p class="lead">Tape le prénom de chaque élève et, si tu veux, son objectif en mots par minute. Les prénoms restent dans tes appareils (l'ordinateur de la classe et ton téléphone) : ils ne sont écrits nulle part dans l'appli ni sur internet.</p>
      <form class="form" id="f" autocomplete="off"></form><div class="row start" style="margin-top:16px"><button class="btn primary" id="sv" type="button">Enregistrer</button><button class="btn" id="add" type="button">Ajouter un élève</button><span class="saved" id="ok" role="status"></span></div>`;
    const f = box.querySelector("#f");
    const lit = () => liste.forEach((s,i)=>{ s.nom = (f.querySelector("#n"+i).value.trim().slice(0,40) || `Élève ${i+1}`); s.objectif = f.querySelector("#g"+i).value.replace(/[^0-9]/g,"").slice(0,3); });
    const dessine = () => { f.innerHTML = ""; liste.forEach((s,i)=>{ f.appendChild(el("label",{for:"n"+i, class:"label"}, `Élève ${i+1}`));
      const n = el("input",{id:"n"+i, "aria-label":`Prénom de l'élève ${i+1}`, autocapitalize:"words", spellcheck:"false"}); n.value = s.nom; f.appendChild(n);
      const g = el("input",{id:"g"+i, class:"goal", inputmode:"numeric", placeholder:"objectif (mots/min)", "aria-label":`Objectif de l'élève ${i+1}`}); g.value = s.objectif||""; f.appendChild(g); }); };
    dessine();
    box.querySelector("#sv").onclick = async ()=>{ lit(); box.querySelector("#ok").textContent = await Donnees.enregistreEleves(liste) ? "Enregistré." : "Impossible d'enregistrer sur cet appareil."; };
    box.querySelector("#add").onclick = ()=>{ lit(); if (liste.length>=12) return; liste.push({id:"e"+Plateforme.rid(4), nom:`Élève ${liste.length+1}`, objectif:""}); dessine(); f.querySelector("#n"+(liste.length-1)).select(); };
  }

  let actx = null;
  function bip(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.6); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.6); } catch(e){} }

  async function demarre(){
    await Donnees.init();
    if (ROLE==="tel"){ document.getElementById("app-tel").hidden = false; await Telephone.demarre(); }
    else { document.getElementById("app-ecran").hidden = false; await Ecran.demarre(); }
  }
  return { DATA, EPS, ROLE, $, el, esc, estMot, nu, ep, motsDefi, DUREE, Donnees, Lien, calcule, bilan, carteResultat, motsDifficiles, courbe, vueProgres, vueEleves, bip, demarre };
})();
window.Banc = Banc;

</script>
<script>
/* ---------- L'écran de la classe (TBI) ----------
   Un écran par moment de la séance : les mots, j'écoute, l'écho, le chœur, le défi, les progrès.
   Le téléphone relié sert de télécommande (il voit les boutons de l'écran et les touche à distance)
   et peut mener le défi : il compte les erreurs en silence, l'écran montre le chrono puis le résultat. */
"use strict";
const Ecran = (() => {
  const { EPS, $, el, esc, estMot, ep, motsDefi, DUREE, Donnees, Lien, calcule, bilan, carteResultat, courbe, vueProgres, vueEleves, bip } = Banc;
  const view = $("#view"), audio = $("#audio");
  let route = {name:"home"};
  let cleanup = ()=>{};

  function go(r){ stopAudio(); route = r; render(); $("#main").scrollTop = 0; }
  document.querySelectorAll("#app-ecran [data-go]").forEach(b=>b.addEventListener("click", ()=>go({name:b.dataset.go})));
  $("#home-link").addEventListener("click", ()=>go({name:"home"}));
  $("#home-link").addEventListener("keydown", e=>{ if (e.key==="Enter") go({name:"home"}); });
  $("#fs").addEventListener("click", async ()=>{ try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch(e){} });
  function render(){
    document.querySelectorAll("#app-ecran [data-go]").forEach(b=>b.setAttribute("aria-current", (b.dataset.go===route.name || (route.name==="episode" && b.dataset.go==="home")) ? "page" : "false"));
    if (route.name==="home") renderHome();
    else if (route.name==="episode") renderEpisode();
    else if (route.name==="students") vueEleves(view);
    else if (route.name==="progress") vueProgres(view);
    annonce();
  }

  /* ---------- Accueil ---------- */
  function renderHome(){
    view.innerHTML = `<h1 style="font-size:clamp(28px,3.4vw,46px)">Le feuilleton de la période 2</h1>
    <p class="lead">Sept enquêtes de Maya, Sami, Jules et Romy. Chaque semaine, un papier écrit à l'encre verte attend la bande sous le banc des maîtres.</p>
    <div class="eps" id="eps"></div>`;
    const g = $("#eps");
    EPS.forEach(E=>{
      const n = E.pages.length-1, imgs = E.pages.slice(1).filter(p=>p.img).length;
      const b = el("button",{class:"ep", type:"button"});
      b.innerHTML = (E.pages[1] && E.pages[1].img ? `<img class="vign" src="${esc(E.pages[1].img)}" alt="" loading="lazy">` : `<div class="vign"></div>`) +
        `<span class="num">Épisode ${E.num}</span><b>${esc(E.titre)}</b><span class="meta">${esc(E.semaine)} · ${esc(E.theme)}</span><span class="meta">${E.nbMots} mots</span>
        <span class="chips"><span class="chip ${E.audio?"ok":""}">${E.audio?"Voix enregistrée":"Voix à venir"}</span><span class="chip ${imgs===n?"ok":""}">${imgs===n?"Images prêtes":"Images "+imgs+"/"+n}</span></span>`;
      b.addEventListener("click", ()=>go({name:"episode", id:E.id, step:0}));
      g.appendChild(b);
    });
  }

  /* ---------- Séance ---------- */
  const STEPS = ["Les mots","J'écoute","L'écho","Le chœur","Le défi","Les progrès"];
  let EP = null, page = 1, wordSpans = [], sentSpans = [], cur = -1, raf = 0, playing = false, stopAt = null, onStop = ()=>{}, echoSent = null, waiting = false, mode = "listen";
  function renderEpisode(){
    EP = ep(route.id);
    const step = route.step||0;
    view.innerHTML = `<div class="ephead"><button class="btn" id="back" aria-label="Retour aux épisodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Épisode ${EP.num} — ${esc(EP.titre)}</h2><nav class="steps" id="steps" aria-label="Étapes de la séance"></nav></div><div class="panel" id="panel"></div>`;
    $("#back").onclick = ()=>go({name:"home"});
    STEPS.forEach((s,i)=>{ const b = el("button",{class:"step", type:"button"}, `<i>${i+1}</i>${s}`); if (i===step) b.setAttribute("aria-current","step"); b.onclick = ()=>go({name:"episode", id:EP.id, step:i}); $("#steps").appendChild(b); });
    const P = $("#panel");
    if (step===0) stepWords(P);
    else if (step>=1 && step<=3) stepReader(P, ["listen","echo","choir"][step-1]);
    else if (step===4) stepDefi(P);
    else stepProgress(P);
  }

  /* 1. Les mots à préparer */
  function stepWords(P){
    let i = 0, timer = null, delay = 2000;
    P.innerHTML = `<div class="flash"><div class="count" id="wc"></div><div class="word" id="wd"></div>
      <div class="row"><button class="btn big" id="wp" data-tele="◀ Mot précédent" aria-label="Mot précédent">◀</button><button class="btn big primary" id="wn" data-tele>Mot suivant</button><button class="btn big" id="wa" data-tele>Flash</button>
      <div class="seg" id="wdel" role="group" aria-label="Vitesse du flash"><button id="wd30" data-tele="Lent" data-tele-g="flash" data-v="3000" aria-pressed="false">Lent</button><button id="wd20" data-tele="Moyen" data-tele-g="flash" data-v="2000" aria-pressed="true">Moyen</button><button id="wd10" data-tele="Rapide" data-tele-g="flash" data-v="1000" aria-pressed="false">Rapide</button></div>
      <button class="btn big" id="wall" data-tele>Tous les mots</button></div></div>`;
    const show = ()=>{ $("#wd").textContent = EP.mots[i]; $("#wc").textContent = `${i+1} / ${EP.mots.length}`; annonce(); };
    const next = ()=>{ i = (i+1)%EP.mots.length; show(); };
    $("#wn").onclick = ()=>{ stopFlash(); next(); };
    $("#wp").onclick = ()=>{ stopFlash(); i = (i-1+EP.mots.length)%EP.mots.length; show(); };
    const stopFlash = ()=>{ if (timer){ clearInterval(timer); timer = null; $("#wa").textContent = "Flash"; annonce(); } };
    $("#wa").onclick = ()=>{ if (timer){ stopFlash(); return; } $("#wa").textContent = "Arrêter"; timer = setInterval(next, delay); annonce(); };
    $("#wdel").onclick = e=>{ const b = e.target.closest("button"); if (!b) return; delay = +b.dataset.v; $("#wdel").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); if (timer){ clearInterval(timer); timer = setInterval(next, delay); } annonce(); };
    $("#wall").onclick = ()=>{ stopFlash(); const f = P.querySelector(".flash"); const showing = f.dataset.all==="1"; f.dataset.all = showing ? "0" : "1";
      $("#wd").style.display = showing ? "" : "none"; $("#wc").style.display = showing ? "" : "none";
      let a = f.querySelector(".allwords"); if (!a){ a = el("div",{class:"allwords"}); EP.mots.forEach(w=>a.appendChild(el("span",{},esc(w)))); f.insertBefore(a, f.querySelector(".row")); }
      a.style.display = showing ? "none" : ""; $("#wall").textContent = showing ? "Tous les mots" : "Un par un"; annonce(); };
    show();
    cleanup = ()=>stopFlash();
  }

  /* 2-4. Le lecteur : écoute, écho, chœur */
  const LIB = {listen:"Écouter", echo:"Écouter la phrase", choir:"Lire avec la voix"};
  function stepReader(P, m){
    mode = m; page = 0;
    const hasAudio = !!EP.audio;
    P.innerHTML = `<div class="stage"><div class="pic" id="pic"></div><div class="textbox"><div class="text" id="txt" lang="fr"></div></div></div>
     <div class="controls">
       <div class="group"><button class="btn" id="prev" data-tele="◀ Page" aria-label="Page précédente">◀</button><span class="pageno" id="pno"></span><button class="btn" id="next" data-tele="Page ▶" aria-label="Page suivante">▶</button></div>
       <div class="group">${hasAudio?`<button class="btn big primary" id="play" data-tele>${LIB[m]}</button>`:`<span class="noaudio">Voix à venir : lis le texte toi-même pour l'instant.</span>`}</div>
       <div class="group">${hasAudio?`<span class="label">Vitesse</span><div class="seg" id="speed" role="group" aria-label="Vitesse de la voix"><button id="v06" data-tele="Lente" data-tele-g="vitesse" data-v="0.6">Lente</button><button id="v08" data-tele="Moyenne" data-tele-g="vitesse" data-v="0.8">Moyenne</button><button id="v10" data-tele="Normale" data-tele-g="vitesse" data-v="1">Normale</button></div>`:""}</div>
     </div>
     <div class="echobar" id="echobar" hidden><strong>À vous !</strong><button class="btn" id="again" data-tele>Réécouter</button><button class="btn primary" id="enext" data-tele>Phrase suivante</button></div>`;
    if (hasAudio){
      let sp = Donnees.vitesse(); if (m==="choir" && sp>0.8) sp = 0.8;
      setSpeed(sp);
      $("#speed").onclick = e=>{ const b = e.target.closest("button"); if (b){ setSpeed(+b.dataset.v); Donnees.fixeVitesse(+b.dataset.v); } };
      $("#play").onclick = togglePlay;
      $("#again").onclick = ()=>{ if (echoSent!==null) playSentence(echoSent); };
      $("#enext").onclick = echoNext;
      if (audio.dataset.ep!==EP.id){ audio.src = EP.audio; audio.dataset.ep = EP.id; }
    }
    const saute = d => { const w = playing && mode!=="echo"; stopAudio(); showPage(page+d); if (w && EP.pages[page].a!=null) playFrom(EP.pages[page].a, null); };
    $("#prev").onclick = ()=>saute(-1);
    $("#next").onclick = ()=>saute(1);
    showPage(0);
    cleanup = ()=>{};
  }
  function setSpeed(v){ audio.playbackRate = v; audio.preservesPitch = true; audio.webkitPreservesPitch = true; const s = $("#speed"); if (s) s.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.v===v))); }
  function showPage(p){
    page = Math.max(0, Math.min(p, EP.pages.length-1));
    const P = EP.pages[page];
    $("#pno").textContent = page===0 ? "Titre" : `Page ${page} / ${EP.pages.length-1}`;
    $("#prev").disabled = page===0; $("#next").disabled = page===EP.pages.length-1;
    const pic = $("#pic"); pic.innerHTML = "";
    const img = P.img || (page===0 && EP.pages[1] && EP.pages[1].img);
    if (img) pic.appendChild(el("img",{src:img, alt:page===0 ? `Épisode ${EP.num}` : `Illustration de la page ${page}`}));
    else pic.appendChild(el("div",{class:"ph"}, `<div><b>${EP.id}-${page===0?1:page}</b>Image à venir</div>`));
    const box = $("#txt"); box.className = "text"+(page===0 ? " title" : ""); box.innerHTML = "";
    if (page===0) box.appendChild(el("span",{class:"muted", style:"display:block;font-size:.42em;font-family:var(--font-read);font-weight:700"}, `Épisode ${EP.num}`));
    wordSpans = []; sentSpans = [];
    P.sents.forEach((s,si)=>{
      const ss = el("span",{class:"s"});
      for (let i=s[0]; i<=s[1]; i++){ const w = el("span",{class:"w"}); w.textContent = P.toks[i][0]; w.onclick = ()=>playWord(i); ss.appendChild(w); wordSpans[i] = w; if (i<s[1]) ss.appendChild(document.createTextNode(" ")); }
      box.appendChild(ss); sentSpans[si] = ss; if (si<P.sents.length-1) box.appendChild(document.createTextNode(" "));
    });
    cur = -1; if ($("#echobar")) $("#echobar").hidden = true; waiting = false; echoSent = null;
    fit(box, page===0 ? 0.09 : 0.058);
    annonce();
  }
  function fit(box, k){
    const holder = box.parentElement;
    const avail = holder.clientHeight-parseFloat(getComputedStyle(holder).paddingTop)*2;
    let fs = Math.max(18, Math.min(window.innerHeight*k, window.innerWidth*k*0.56));
    box.style.setProperty("--fs", fs+"px"); let g = 0;
    while (box.scrollHeight>avail && fs>15 && g++<60){ fs *= .95; box.style.setProperty("--fs", fs+"px"); }
  }
  window.addEventListener("resize", ()=>{ const b = $("#txt"); if (b && route.name==="episode") fit(b, route.step===4 ? 0.05 : (page===0 ? 0.09 : 0.058)); });
  function setPlayUI(on){ playing = on; const b = $("#play"); if (b) b.textContent = on ? "Pause" : LIB[mode]; annonce(); }
  /* premier toucher de l'écran : le navigateur autorise alors le son (commandes venues du téléphone) */
  let sonBloque = false;
  function bloque(on){ sonBloque = on; let b = $("#son-bloque"); if (on && !b){ b = el("div",{class:"banner", id:"son-bloque"}, "Touche une fois l'écran de la classe pour autoriser le son."); document.body.appendChild(b); } if (!on && b) b.remove(); annonce(); }
  document.addEventListener("pointerdown", ()=>{ if (sonBloque) bloque(false); }, true);
  async function playFrom(t, until){
    if (!EP.audio || t==null) return;
    stopAt = until ?? null;
    try { if (Math.abs(audio.currentTime-t)>0.04) audio.currentTime = t; await audio.play(); if (sonBloque) bloque(false); setPlayUI(true); loop(); }
    catch(e){ setPlayUI(false); if (e && e.name==="NotAllowedError") bloque(true); }
  }
  function stopAudio(){ try { audio.pause(); } catch(e){} setPlayUI(false); cancelAnimationFrame(raf); stopAt = null; waiting = false; echoSent = null; const eb = $("#echobar"); if (eb) eb.hidden = true; mark(-1); sentSpans.forEach(s=>s.classList.remove("echo")); cleanup(); cleanup = ()=>{}; }
  function mark(i){ if (i===cur) return; if (cur>=0 && wordSpans[cur]) wordSpans[cur].classList.remove("on"); cur = i; if (i>=0 && wordSpans[i]) wordSpans[i].classList.add("on"); }
  function loop(){
    cancelAnimationFrame(raf);
    const step = ()=>{
      if (audio.paused) return;
      const t = audio.currentTime, P = EP.pages[page];
      if (stopAt===null && P.b!=null && t>=P.b-0.02){ if (page<EP.pages.length-1) showPage(page+1); else { audio.pause(); setPlayUI(false); mark(-1); return; } }
      const Q = EP.pages[page]; let k = -1;
      for (let i=0; i<Q.toks.length; i++){ const x = Q.toks[i]; if (x[1]!=null && t>=x[1]-0.03 && t<x[2]+0.06){ k = i; break; } }
      mark(k);
      if (stopAt!==null && t>=stopAt){ audio.pause(); setPlayUI(false); mark(-1); const f = onStop; onStop = ()=>{}; f(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  audio.addEventListener("ended", ()=>{ setPlayUI(false); mark(-1); });
  function playWord(i){ const x = EP.pages[page].toks[i]; if (!EP.audio || x[1]==null) return; const was = echoSent; onStop = ()=>{ if (mode==="echo" && was!==null){ waiting = true; $("#echobar").hidden = false; annonce(); } }; playFrom(x[1]-0.02, x[2]+0.05); }
  function playSentence(si){ const s = EP.pages[page].sents[si]; if (!s || s[2]==null) return; echoSent = si; sentSpans.forEach((x,j)=>x.classList.toggle("echo", j===si)); $("#echobar").hidden = true; waiting = false;
    onStop = ()=>{ waiting = true; $("#echobar").hidden = false; $("#enext").focus({preventScroll:true}); annonce(); }; playFrom(s[2]-0.05, s[3]+0.08); }
  function echoNext(){
    const P = EP.pages[page];
    if (P.a==null){ if (page<EP.pages.length-1){ showPage(page+1); playSentence(0); } return; } // le titre n'est pas lu
    if (echoSent===null){ playSentence(0); return; }
    if (echoSent<P.sents.length-1){ playSentence(echoSent+1); return; }
    if (page<EP.pages.length-1){ showPage(page+1); playSentence(0); } else stopAudio();
  }
  function togglePlay(){
    if (playing){ audio.pause(); setPlayUI(false); return; }
    if (mode==="echo"){ if (waiting || echoSent===null) echoNext(); else playSentence(echoSent); return; }
    onStop = ()=>{};
    if (EP.pages[page].a==null && page<EP.pages.length-1) showPage(page+1); // le titre n'est pas lu : on commence à la page 1
    const P = EP.pages[page], t = audio.currentTime;
    playFrom(t>=P.a && t<P.b-0.1 ? t : P.a, null);
  }

  /* 5. Le défi d'une minute (mené ici, ou depuis le téléphone) */
  let Defi = null; // l'état du défi affiché, pour le téléphone et les messages reçus
  function stepDefi(P){
    const DUR = DUREE();
    let who = null, state = "idle", t0 = 0, tick = null, errs = new Set(), last = -1, elapsed = 0, distant = false;
    const toks = motsDefi(EP);
    P.innerHTML = `<div class="defi"><div class="textbox"><div class="text" id="txt" lang="fr"></div></div>
     <div class="side">
       <div class="card"><div class="label">Qui lit ?</div><div class="who" id="who" style="margin-top:8px"></div><div class="muted" id="essai" style="margin-top:8px"></div></div>
       <div class="card"><div class="timer"><i id="bar"></i></div><div class="row start" style="margin-top:10px"><button class="btn big primary" id="go" disabled>Départ</button><button class="btn" id="stop" hidden>Il a fini</button></div><p class="hint" id="hint" style="margin:10px 0 0"></p></div>
       <div class="card" id="res" hidden></div>
     </div></div>`;
    const box = $("#txt"), spans = [];
    toks.forEach((x,i)=>{ if (x.brk) box.appendChild(el("br")); const s = el("span",{class:"w"}); s.textContent = x.t; s.onclick = ()=>tapWord(i); box.appendChild(s); box.appendChild(document.createTextNode(" ")); spans[i] = s; });
    fit(box, 0.05);
    const conseil = () => Lien.relie() ? "Lance le défi depuis le téléphone, ou choisis l'élève ici." : "Choisis l'élève, puis appuie sur Départ.";
    $("#hint").textContent = conseil();
    const essaiNum = id => Donnees.essaisDe(id, EP.id).length;
    Donnees.eleves().forEach(s=>{ const b = el("button",{type:"button", "aria-pressed":"false", "data-eleve":s.id}); b.textContent = s.nom||"Élève";
      b.onclick = ()=>{ if (state==="run" || distant) return; choisit(s.id); reset(); }; $("#who").appendChild(b); });
    function choisit(id){ who = id; $("#who").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.eleve===id))); $("#go").disabled = false; $("#essai").textContent = `Essai n° ${essaiNum(id)+1} sur ce texte`; }
    function reset(){ state = "idle"; errs.clear(); last = -1; spans.forEach(s=>s.className = "w"); $("#bar").style.width = "0"; $("#res").hidden = true; $("#hint").textContent = who ? "Appuie sur Départ quand l'élève est prêt." : conseil(); $("#go").textContent = "Départ"; $("#go").disabled = !who; $("#stop").hidden = true; publie(); }
    function tapWord(i){
      if (distant) return;
      if (state==="run"){ if (!toks[i].w) return; errs.has(i) ? errs.delete(i) : errs.add(i); spans[i].classList.toggle("err"); }
      else if (state==="pick"){ last = i; montreFin(i, null); finish(); }
    }
    function montreFin(i, fautes){ spans.forEach((s,j)=>{ s.classList.toggle("after", j>i); s.classList.toggle("last", j===i); if (fautes) s.classList.toggle("err", fautes.includes(j)); }); }
    function lanceChrono(debut){ clearInterval(tick); t0 = debut; tick = setInterval(()=>{ const s = (performance.now()-t0)/1000; $("#bar").style.width = Math.min(100, s/DUR*100)+"%"; if (s>=DUR && !distant) endTime(DUR); }, 200); }
    $("#go").onclick = ()=>{
      if (state==="run" || distant) return;
      if (state==="done" || state==="pick"){ reset(); return; }
      state = "run"; lanceChrono(performance.now()); $("#go").textContent = "En cours…"; $("#stop").hidden = false;
      $("#hint").textContent = "Touche les mots mal lus (un deuxième toucher annule)."; publie();
    };
    $("#stop").onclick = ()=>{ if (state==="run") endTime((performance.now()-t0)/1000); };
    function endTime(s){ clearInterval(tick); elapsed = Math.min(DUR, s); state = "pick"; $("#stop").hidden = true; $("#go").textContent = "Recommencer"; $("#hint").textContent = "Temps écoulé ! Touche le dernier mot lu."; bip(); publie(); }
    async function finish(){
      state = "done";
      const r = calcule(EP, who, elapsed, last, errs);
      const b = bilan(r);
      const ok = await Donnees.ajoute(r);
      montreResultat(r, b, ok);
      $("#hint").textContent = "Choisis un autre élève, ou appuie sur Recommencer.";
      $("#essai").textContent = `Essai n° ${essaiNum(who)+1} sur ce texte`; publie();
    }
    function montreResultat(r, b, ok){ $("#res").hidden = false; $("#res").innerHTML = carteResultat(r, b, Donnees.nom(r.eleve), ok); P.querySelector(".side").scrollTop = 0; }
    /* le téléphone mène le défi : l'écran suit */
    function recoit(d){
      if (d.etat==="repos"){ distant = false; clearInterval(tick); reset(); return; }
      distant = d.etat!=="fini";
      if (d.eleve && d.eleve!==who) choisit(d.eleve);
      $("#go").disabled = true; $("#stop").hidden = true;
      if (d.etat==="pret"){ clearInterval(tick); state = "idle"; spans.forEach(s=>s.className = "w"); $("#bar").style.width = "0"; $("#res").hidden = true; $("#hint").textContent = `${Donnees.nom(d.eleve)} se prépare. Départ sur le téléphone.`; }
      else if (d.etat==="lecture"){ if (state!=="run"){ state = "run"; spans.forEach(s=>s.className = "w"); $("#res").hidden = true; lanceChrono(performance.now()-Math.max(0, Math.min(5000, d.depuis||0))); } $("#go").textContent = "En cours…"; $("#hint").textContent = `${Donnees.nom(d.eleve)} lit. La maîtresse note sur son téléphone.`; }
      else if (d.etat==="choix"){ if (state==="run"){ clearInterval(tick); bip(); } state = "pick"; $("#bar").style.width = "100%"; $("#hint").textContent = "Temps écoulé !"; }
      else if (d.etat==="fini" && d.resultat){ clearInterval(tick); state = "done"; $("#bar").style.width = Math.min(100, d.resultat.secondes/DUR*100)+"%"; montreFin(d.resultat.dernier, d.resultat.fautes||[]);
        montreResultat(d.resultat, bilan(d.resultat), true); $("#go").textContent = "Recommencer"; $("#go").disabled = false; $("#hint").textContent = "Résultat enregistré sur le téléphone et ici."; distant = false; }
    }
    function publie(){ Defi = {ep:EP.id, etat:state, eleve:who, local:!distant && (state==="run" || state==="pick"), recoit}; annonce(); }
    publie();
    cleanup = ()=>{ clearInterval(tick); Defi = null; };
  }

  /* 6. Les progrès sur cet épisode */
  function stepProgress(P){
    P.style.height = "auto";
    const box = el("div",{class:"grid2"});
    Donnees.eleves().forEach(st=>{
      const rs = Donnees.essaisDe(st.id, EP.id), c = el("div",{class:"card chart"});
      const durs = [...new Set(rs.flatMap(r=>Banc.motsDifficiles(r)))].slice(0,14);
      c.innerHTML = `<h3 style="font-size:20px">${esc(st.nom)}</h3><p class="muted" style="margin:2px 0 6px">${rs.length?`${rs.length} essai${rs.length>1?"s":""} sur cet épisode`:"Aucun essai sur cet épisode"}</p>`+
        courbe(rs.map(r=>({v:r.mclm, l:"essai "+r.essai})), +st.objectif||0, `Progrès de ${st.nom}`)+
        (durs.length?`<div class="label" style="margin-top:8px">Mots à retravailler</div><div class="hard">${durs.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:"");
      box.appendChild(c);
    });
    P.innerHTML = `<p class="lead">Les mots lus correctement par minute à chaque essai du défi, sur cet épisode. Le point plein est le meilleur essai.</p>`; P.appendChild(box);
  }

  /* ---------- Clavier ---------- */
  document.addEventListener("keydown", e=>{
    if (route.name!=="episode" || Banc.ROLE!=="ecran") return;
    if (e.target.closest && e.target.closest("input")) return;
    const st = route.step||0;
    if (st>=1 && st<=3){
      if ((e.key===" " || e.key==="Enter") && e.target.closest && e.target.closest("button")) return;
      if (e.key===" "){ e.preventDefault(); if (mode==="echo" && waiting) echoNext(); else if (EP.audio) togglePlay(); }
      else if (e.key==="ArrowRight") $("#next") && $("#next").click();
      else if (e.key==="ArrowLeft") $("#prev") && $("#prev").click();
      else if (e.key==="Enter" && mode==="echo"){ e.preventDefault(); echoNext(); }
    }
  });

  /* ---------- Télécommande : ce que montre l'écran, pour le téléphone ---------- */
  let dernierEtat = "", tAnnonce = null;
  function etat(){
    const boutons = [...document.querySelectorAll("#view [data-tele], #echobar [data-tele]")].filter(b=>b.offsetParent!==null || b.closest("#echobar:not([hidden])")).map(b=>{
      const t = b.dataset.tele || b.textContent.trim();
      return {id:b.id, t, p:b.classList.contains("primary") ? 1 : 0, d:b.disabled ? 1 : 0, a:b.getAttribute("aria-pressed")==="true" ? 1 : 0, g:b.dataset.teleG||""};
    });
    const e = {vue:route.name, ep:route.id||null, etape:route.step||0, boutons, son:sonBloque ? 0 : 1};
    if (route.name==="episode" && (route.step||0)>=1 && (route.step||0)<=3) Object.assign(e, {page, pages:EP.pages.length-1, lecture:playing ? 1 : 0, attente:waiting ? 1 : 0});
    if (route.name==="episode" && route.step===0) e.mot = ($("#wd") && $("#wd").textContent) || "";
    if (Defi) e.defi = {etat:Defi.etat, eleve:Defi.eleve, local:Defi.local ? 1 : 0};
    return e;
  }
  function annonce(){ clearTimeout(tAnnonce); tAnnonce = setTimeout(()=>{ const e = etat(), s = JSON.stringify(e); if (s===dernierEtat) return; dernierEtat = s; Lien.emit("ecran", e); }, 120); }
  const relance = () => { dernierEtat = ""; annonce(); };
  function commande(d){
    if (!d) return;
    if (d.nav){ const n = d.nav; if (n.vue==="episode" && ep(n.ep)) go({name:"episode", id:n.ep, step:Math.max(0, Math.min(5, n.etape|0))}); else if (["home","students","progress"].includes(n.vue)) go({name:n.vue}); return; }
    if (d.clic){ const b = document.getElementById(String(d.clic)); if (b && b.matches("[data-tele]") && !b.disabled) b.click(); return; }
    if (d.etat) relance();
  }
  function recoitDefi(d){
    if (!d || !ep(d.ep)) return;
    if (route.name!=="episode" || route.id!==d.ep || route.step!==4){ if (d.etat==="repos") return; go({name:"episode", id:d.ep, step:4}); }
    if (Defi && Defi.recoit) Defi.recoit(d);
  }

  /* ---------- Fenêtre « Relier le téléphone » ---------- */
  const L = Plateforme.Liaison;
  function majPastille(){ const on = Lien.relie(); $("#b-tel-dot").classList.toggle("on", on); $("#b-tel-txt").textContent = on ? "Téléphone relié" : "Relier le téléphone"; const f = $("#lier-etat"); if (f) f.innerHTML = on ? `<span class="dot on"></span>Téléphone relié !` : `<span class="dot"></span>En attente du téléphone…`; }
  function fenetre(){
    const code = L.code(); if (!code) return;
    const lien = L.lienTel(code);
    const v = el("div",{class:"voile", id:"lier"});
    v.innerHTML = `<div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="lier-t">
      ${lien?`<div class="qr" aria-label="QR code de liaison">${L.qr(lien, 320)}</div>`:""}
      <div><h2 id="lier-t" style="font-size:clamp(26px,3vw,38px)">Relier ton téléphone</h2>
        <ol>${lien?`<li>Vise ce QR code avec l'appareil photo du téléphone.</li><li>Touche le lien qui apparaît : la télécommande s'ouvre, déjà reliée.</li><li>Sans appareil photo : ouvre <b>${esc(lien.replace(/#.*$/,""))}</b> sur le téléphone et tape ce code :</li>`:`<li>Sur le téléphone, ouvre le site du banc des maîtres.</li><li>Tape ce code :</li>`}</ol>
        <div class="code" style="margin-top:8px">${esc(code)}</div>
        <div class="etat-lien" id="lier-etat" role="status"></div>
        <p class="muted" style="margin:14px 0 0">Les messages entre les deux appareils sont chiffrés avec ce code. Les prénoms et les résultats restent dans l'ordinateur et le téléphone.</p>
        <div class="row start" style="margin-top:16px"><button class="btn primary" id="lier-ok">Fermer</button><button class="btn" id="lier-neuf">Changer de code</button></div></div></div>`;
    document.body.appendChild(v); majPastille();
    const ferme = ()=>v.remove();
    v.addEventListener("click", e=>{ if (e.target===v) ferme(); });
    v.querySelector("#lier-ok").onclick = ferme;
    v.querySelector("#lier-neuf").onclick = async e=>{ const b = e.currentTarget; if (b.dataset.sur!=="1"){ b.dataset.sur = "1"; b.textContent = "Le téléphone devra se relier à nouveau : confirmer ?"; return; } await L.nouveau(); location.hash = ""; location.reload(); };
    v.querySelector("#lier-ok").focus();
  }
  $("#b-tel").addEventListener("click", fenetre);
  document.addEventListener("keydown", e=>{ if (e.key==="Escape" && $("#lier")) $("#lier").remove(); });

  async function demarre(){
    Donnees.surChange(q=>{ if (q==="classe" || q==="resultats"){ if (route.name==="students" && q==="classe" && !document.activeElement.closest("#f")) vueEleves(view); else if (route.name==="progress") vueProgres(view); else if (route.name==="episode" && route.step===5) renderEpisode(); else if (route.name==="episode" && route.step===4 && q==="classe" && !Defi?.etat?.match(/run|pick/)) renderEpisode(); } });
    render();
    const room = await Lien.init();
    if (room){
      Lien.on("cmd", m=>commande(m.data));
      Lien.on("defi", m=>recoitDefi(m.data));
      Lien.surEtat(on=>{ majPastille(); if (on) relance(); });
      majPastille();
    } else $("#b-tel").hidden = true;
  }
  return { demarre, go, etat, route:()=>route };
})();
window.Ecran = Ecran;

</script>
<script>
/* ---------- Le téléphone de la maîtresse ----------
   Écran : la télécommande (les boutons de l'écran de la classe, touchés à distance).
   Défi : le chrono et les erreurs notées en silence ; l'écran de la classe montre le chrono puis le résultat.
   Élèves et Progrès : les mêmes que sur l'écran, gardés aussi dans le téléphone. */
"use strict";
const Telephone = (() => {
  const { EPS, $, el, esc, ep, motsDefi, DUREE, Donnees, Lien, calcule, bilan, carteResultat, vueProgres, vueEleves, bip } = Banc;
  const L = Plateforme.Liaison, lsG = Plateforme.lsG, lsS = Plateforme.lsS;
  const main = $("#t-main");
  const ONGLETS = ["ecran","defi","eleves","progres"];
  let onglet = ONGLETS.includes(lsG("banc-des-maitres-onglet")) ? lsG("banc-des-maitres-onglet") : "ecran";
  let E = null; // ce que montre l'écran de la classe (dernier état reçu)
  const ETAPES = ["Les mots","J'écoute","L'écho","Le chœur","Le défi","Les progrès"];

  function majLien(){
    const on = Lien.relie();
    $("#t-dot").classList.toggle("on", on);
    $("#t-lien-txt").textContent = !L.code() ? "Pas relié" : on ? "Écran relié" : "Écran absent";
  }
  function va(o){ onglet = o; lsS("banc-des-maitres-onglet", o); rend(); main.scrollTop = 0; }
  $("#t-tabs").addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if (b) va(b.dataset.tab); });
  function rend(){
    document.querySelectorAll("#t-tabs [data-tab]").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===onglet ? "page" : "false"));
    if (onglet==="ecran") rendEcran();
    else if (onglet==="defi") rendDefi();
    else if (onglet==="eleves") vueEleves(main);
    else vueProgres(main, true);
  }
  const cmd = d => Lien.emit("cmd", d);

  /* ---------- Écran : relier, puis télécommande ---------- */
  function carteLier(titre){
    return `<div class="card"><h2>${titre}</h2>
      <ol style="margin:8px 0 0;padding-left:1.3em"><li>Sur l'ordinateur de la classe, ouvre le banc des maîtres et touche <b>Relier le téléphone</b>.</li><li>Vise le QR code avec l'appareil photo de ce téléphone, puis touche le lien.</li><li>Ou tape le code affiché sous le QR code :</li></ol>
      <form class="champ" id="t-code"><input id="t-code-in" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code de liaison"><button class="btn primary">Relier</button></form>
      <p class="muted" id="t-code-err" role="status" style="margin:8px 0 0"></p></div>`;
  }
  function brancheLier(){
    const f = $("#t-code"); if (!f) return;
    f.onsubmit = async e=>{ e.preventDefault(); const c = Plateforme.normalise($("#t-code-in").value);
      if (!c){ $("#t-code-err").textContent = "Le code a 10 lettres ou chiffres, par exemple 7KQ2M-X9D4A."; return; }
      await L.fixe(c); history.replaceState(null, "", location.pathname+location.search); location.reload(); };
  }
  function astuce(){
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if (Plateforme.NATIF || !ios || navigator.standalone || lsG("banc-des-maitres-astuce")) return "";
    return `<div class="card astuce" id="t-astuce"><b>Pour que le téléphone garde les résultats</b><p style="margin:6px 0 10px">Ajoute le banc des maîtres à l'écran d'accueil : bouton <b>Partager</b> de Safari, puis <b>Sur l'écran d'accueil</b>. Ouvre-le ensuite depuis son icône.</p><button class="btn" id="t-astuce-ok">Compris</button></div>`;
  }
  function rendEcran(){
    if (!L.code()){ main.innerHTML = carteLier("Relie ce téléphone à l'écran de la classe") + `<p class="muted" style="margin-top:14px">Sans écran relié, le défi, les élèves et les progrès marchent aussi sur le téléphone seul.</p><button class="btn" id="t-role" style="margin-top:6px">Lire le feuilleton sur ce téléphone</button>`; brancheLier(); $("#t-role").onclick = ()=>{ Plateforme.changeRole("ecran"); location.reload(); }; return; }
    let h = astuce();
    if (!Lien.relie() || !E){
      h += `<div class="card"><h2>L'écran de la classe n'est pas là</h2><p style="margin:6px 0 0">Ouvre le banc des maîtres sur l'ordinateur de la classe : il se relie tout seul à ce téléphone, avec internet.</p><p class="muted" style="margin:8px 0 0">Code de liaison : <b>${esc(L.code())}</b></p></div>
        <details class="card" style="margin-top:12px"><summary style="font-weight:700;min-height:44px;display:flex;align-items:center;cursor:pointer">Relier un autre écran</summary>${carteLier("Nouveau code")}</details>`;
      main.innerHTML = h; brancheLier(); brancheAstuce(); return;
    }
    if (E.son===0) h += `<div class="card astuce"><b>Le son est bloqué sur l'ordinateur.</b> Touche une fois l'écran de la classe, puis réessaie.</div>`;
    if (E.vue==="episode" && ep(E.ep)){
      const X = ep(E.ep);
      h += `<div class="card"><div class="label">Sur l'écran</div><h2>Épisode ${X.num} — ${esc(X.titre)}</h2>
        <div class="etapes">${ETAPES.map((s,i)=>`<button class="btn${i===E.etape?" primary":""}" data-nav="${i}">${i+1}. ${s}</button>`).join("")}</div></div>`;
      h += `<div class="card">`;
      if (E.etape===0) h += `<div class="label">Mot affiché</div><div style="font-size:30px;font-weight:700;margin:4px 0 2px">${esc(E.mot||"")}</div>`;
      if (E.etape>=1 && E.etape<=3) h += `<div class="label">${E.page ? `Page ${E.page} / ${E.pages}` : "Titre"}${E.lecture ? " · lecture en cours" : ""}${E.attente ? " · à vous !" : ""}</div>`;
      if (E.etape===4){ h += `<p style="margin:0">Le défi se mène dans l'onglet <b>Défi</b> : tu notes les erreurs, l'écran montre le chrono puis le résultat.</p><div class="tele"><button class="btn primary" id="t-vers-defi">Ouvrir le défi</button></div>`; }
      else if (E.etape===5) h += `<p style="margin:0">L'écran montre les progrès du groupe sur cet épisode.</p>`;
      h += boutons(E.boutons) + `</div>`;
    } else if (E.vue==="home"){
      h += `<div class="card"><div class="label">Sur l'écran : les épisodes</div><h2>Quel épisode ouvrir ?</h2><div class="liste">${EPS.map(X=>`<button class="btn" data-ep="${X.id}"><span><b>Épisode ${X.num} — ${esc(X.titre)}</b><small>${esc(X.semaine)}${X.audio?"":" · voix à venir"}</small></span></button>`).join("")}</div></div>`;
    } else {
      h += `<div class="card"><div class="label">Sur l'écran</div><h2>${E.vue==="students" ? "Les élèves" : "Les progrès"}</h2></div>`;
    }
    h += `<div class="row start" style="margin-top:14px"><button class="btn" data-vue="home">Épisodes</button><button class="btn" data-vue="students">Élèves</button><button class="btn" data-vue="progress">Progrès</button></div>
      <p class="muted" style="margin-top:14px">Code de liaison : ${esc(L.code())}</p>`;
    main.innerHTML = h; brancheAstuce();
    main.querySelectorAll("[data-nav]").forEach(b=>b.onclick = ()=>cmd({nav:{vue:"episode", ep:E.ep, etape:+b.dataset.nav}}));
    main.querySelectorAll("[data-ep]").forEach(b=>b.onclick = ()=>cmd({nav:{vue:"episode", ep:b.dataset.ep, etape:0}}));
    main.querySelectorAll("[data-vue]").forEach(b=>b.onclick = ()=>cmd({nav:{vue:b.dataset.vue}}));
    main.querySelectorAll("[data-clic]").forEach(b=>b.onclick = ()=>{ b.disabled = true; cmd({clic:b.dataset.clic}); setTimeout(()=>{ b.disabled = false; }, 1500); });
    const vd = $("#t-vers-defi"); if (vd) vd.onclick = ()=>{ D.ep = E.ep; va("defi"); };
  }
  function boutons(liste){
    if (!liste || !liste.length) return "";
    let h = `<div class="tele">`, g = null;
    liste.forEach(b=>{
      if (b.g!==g){ if (g) h += `</div>`; g = b.g; if (g) h += `<div class="seg" role="group" aria-label="${g==="vitesse"?"Vitesse de la voix":"Vitesse du flash"}">`; }
      h += g ? `<button data-clic="${esc(b.id)}" aria-pressed="${b.a?"true":"false"}"${b.d?" disabled":""}>${esc(b.t)}</button>`
             : `<button class="btn${b.p?" primary":""}" data-clic="${esc(b.id)}"${b.d?" disabled":""}>${esc(b.t)}</button>`;
    });
    if (g) h += `</div>`;
    return h + `</div>`;
  }
  function brancheAstuce(){ const b = $("#t-astuce-ok"); if (b) b.onclick = ()=>{ lsS("banc-des-maitres-astuce", "1"); $("#t-astuce").remove(); }; }

  /* ---------- Défi : mené depuis le téléphone ---------- */
  const D = {ep:lsG("banc-des-maitres-defi-ep") || null, eleve:null, etat:"choix", t0:0, tick:null, errs:new Set(), dernier:-1, ecoule:0, resultat:null, ok:true};
  const envoie = (etat, plus) => Lien.emit("defi", Object.assign({etat, ep:D.ep, eleve:D.eleve}, plus||{}));
  function epDefi(){ if (!ep(D.ep)) D.ep = (E && E.vue==="episode" && ep(E.ep) ? E.ep : (EPS.find(x=>x.audio)||EPS[0]).id); return ep(D.ep); }
  function rendDefi(){
    const X = epDefi(), DUR = DUREE(), toks = motsDefi(X);
    const ecranOccupe = E && E.defi && E.defi.local && Lien.relie();
    let h = "";
    if (D.etat==="choix"){
      h += `<div class="card"><label class="label" for="t-ep">Texte</label><select class="sel" id="t-ep" style="margin-top:6px">${EPS.map(x=>`<option value="${x.id}"${x.id===X.id?" selected":""}>Épisode ${x.num} — ${esc(x.titre)}</option>`).join("")}</select>
        <div class="label" style="margin-top:14px">Qui lit ?</div><div class="who" id="t-who" style="margin-top:8px">${Donnees.eleves().map(s=>`<button type="button" data-eleve="${esc(s.id)}" aria-pressed="${s.id===D.eleve?"true":"false"}">${esc(s.nom)}</button>`).join("")}</div>
        <p class="muted" id="t-essai" style="margin:8px 0 0">${D.eleve ? `Essai n° ${Donnees.essaisDe(D.eleve, X.id).length+1} sur ce texte` : ""}</p>
        ${ecranOccupe ? `<p class="hint">Un défi est en cours sur l'écran de la classe.</p>` : ""}
        <div class="tele"><button class="btn primary" id="t-go"${D.eleve && !ecranOccupe ? "" : " disabled"}>Départ</button></div>
        <p class="muted" style="margin:6px 0 0">${Lien.relie() ? "Le texte s'affiche sur l'écran de la classe ; touche ici les mots mal lus." : "Sans écran relié : l'élève lit sur le texte imprimé ou au tableau."} ${DUR} secondes.</p></div>`;
    } else if (D.etat!=="fini"){
      const reste = Math.max(0, Math.ceil(DUR-D.ecoule));
      h += `<div class="card"><div class="label">${esc(Donnees.nom(D.eleve))} · Épisode ${X.num}</div>
        <div class="chrono"><span class="big-num" id="t-reste">${D.etat==="lecture" ? reste : "0"}</span><span class="muted">secondes</span></div>
        <div class="timer"><i id="t-bar" style="width:${Math.min(100, D.ecoule/DUR*100)}%"></i></div>
        <p class="hint" id="t-hint" style="margin:10px 0 0">${D.etat==="lecture" ? "Touche les mots mal lus (un deuxième toucher annule)." : "Temps écoulé ! Touche le dernier mot lu."}</p></div>`;
    } else {
      h += `<div class="card" id="t-res">${carteResultat(D.resultat, bilan(D.resultat), Donnees.nom(D.eleve), D.ok)}
        <div class="tele"><button class="btn primary" id="t-encore">Nouvel essai</button><button class="btn" id="t-autre">Autre élève</button><button class="btn danger" id="t-suppr">Supprimer cet essai</button></div></div>`;
    }
    h += `<div class="card tdefi"><div class="label">${D.etat==="choix" ? "Le texte" : "Touche les mots"}</div><div class="text" id="t-txt" lang="fr"></div></div>`;
    if (D.etat==="lecture") h += `<div class="collant"><button class="btn big primary" id="t-stop">Il a fini</button></div>`;
    if (D.etat==="dernier") h += `<div class="collant"><span class="btn big" style="pointer-events:none;border-color:var(--green);color:var(--green)">Touche le dernier mot lu</span></div>`;
    main.innerHTML = h;
    const box = $("#t-txt"), spans = [];
    toks.forEach((x,i)=>{ if (x.brk) box.appendChild(el("br")); const s = el("span",{class:"w"}); s.textContent = x.t; spans[i] = s; box.appendChild(s); box.appendChild(document.createTextNode(" ")); });
    const marque = () => spans.forEach((s,i)=>{ s.classList.toggle("err", D.errs.has(i) && (D.etat!=="fini" || i<=D.dernier)); s.classList.toggle("after", D.etat==="fini" && i>D.dernier); s.classList.toggle("last", D.etat==="fini" && i===D.dernier); });
    marque();
    box.onclick = e=>{ const s = e.target.closest(".w"); if (!s) return; const i = spans.indexOf(s);
      if (D.etat==="lecture"){ if (!toks[i].w) return; D.errs.has(i) ? D.errs.delete(i) : D.errs.add(i); s.classList.toggle("err"); if (navigator.vibrate) navigator.vibrate(15); }
      else if (D.etat==="dernier"){ D.dernier = i; termine(); } };
    if (D.etat==="choix"){
      $("#t-ep").onchange = e=>{ D.ep = e.target.value; lsS("banc-des-maitres-defi-ep", D.ep); if (D.eleve) envoie("pret"); rendDefi(); };
      $("#t-who").onclick = e=>{ const b = e.target.closest("[data-eleve]"); if (!b) return; D.eleve = b.dataset.eleve; envoie("pret"); rendDefi(); };
      $("#t-go").onclick = depart;
    }
    if ($("#t-stop")) $("#t-stop").onclick = ()=>finTemps();
    if ($("#t-encore")) $("#t-encore").onclick = ()=>{ D.etat = "choix"; D.resultat = null; envoie("pret"); rendDefi(); };
    if ($("#t-autre")) $("#t-autre").onclick = ()=>{ D.etat = "choix"; D.resultat = null; D.eleve = null; envoie("repos"); rendDefi(); };
    if ($("#t-suppr")) $("#t-suppr").onclick = async e=>{ const b = e.currentTarget; if (b.dataset.sur!=="1"){ b.dataset.sur = "1"; b.textContent = "Confirmer la suppression ?"; return; }
      await Donnees.supprime(D.resultat.id); D.etat = "choix"; D.resultat = null; envoie("repos"); rendDefi(); };
  }
  function depart(){
    D.etat = "lecture"; D.errs = new Set(); D.dernier = -1; D.ecoule = 0; D.resultat = null; D.t0 = performance.now();
    lsS("banc-des-maitres-defi-ep", D.ep);
    Plateforme.eveille(true);
    envoie("lecture", {depuis:0});
    clearInterval(D.tick);
    D.tick = setInterval(()=>{ D.ecoule = (performance.now()-D.t0)/1000; const DUR = DUREE();
      if (onglet==="defi"){ const r = $("#t-reste"), b = $("#t-bar"); if (r) r.textContent = Math.max(0, Math.ceil(DUR-D.ecoule)); if (b) b.style.width = Math.min(100, D.ecoule/DUR*100)+"%"; }
      if (D.ecoule>=DUR) finTemps(DUR); }, 200);
    rendDefi();
  }
  function finTemps(s){
    if (D.etat!=="lecture") return;
    clearInterval(D.tick); D.ecoule = Math.min(DUREE(), s!=null ? s : (performance.now()-D.t0)/1000);
    D.etat = "dernier"; bip(); if (navigator.vibrate) navigator.vibrate([200,80,200]);
    envoie("choix"); if (onglet!=="defi") va("defi"); else rendDefi();
  }
  async function termine(){
    const X = epDefi();
    const r = calcule(X, D.eleve, D.ecoule, D.dernier, D.errs);
    D.ok = await Donnees.ajoute(r); D.resultat = r; D.etat = "fini";
    Plateforme.eveille(false);
    envoie("fini", {resultat:r});
    rendDefi(); main.scrollTop = 0;
  }

  async function demarre(){
    rend(); majLien();
    Donnees.surChange(q=>{ if (onglet==="progres" && q==="resultats") rend(); else if (onglet==="eleves" && q==="classe" && !(document.activeElement && document.activeElement.closest("#f"))) rend(); else if (onglet==="defi" && q==="classe" && D.etat==="choix") rend(); });
    const room = await Lien.init();
    /* l'adresse garde le lien : « Sur l'écran d'accueil » (iPhone) emporte ainsi la liaison dans l'icône */
    if (L.code() && !location.hash.includes("lien="+L.code())) history.replaceState(null, "", location.pathname+location.search+"#lien="+L.code()+"&tel");
    majLien();
    if (!room){ rend(); return; }
    Lien.on("ecran", m=>{ E = m.data; if (onglet==="ecran") rendEcran(); });
    Lien.surEtat(on=>{ majLien(); if (on) cmd({etat:1}); else E = null; if (onglet==="ecran") rendEcran(); });
    room.onConnection(()=>majLien());
    rend();
  }
  return { demarre, etat:()=>E, defi:()=>D };
})();
window.Telephone = Telephone;

</script>
<script>Banc.demarre();</script>

</body>
