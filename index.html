    const liste = Donnees.eleves().map(e=>Object.assign({}, e));
    const originaux = new Map(liste.map(e=>[e.id,{...e}]));
    box.innerHTML = `<h1 style="font-size:clamp(24px,3vw,40px)">Les élèves de la classe</h1><p class="lead">Tape le prénom de chaque élève. Laisse son objectif vide pour le calcul automatique, ou saisis une valeur manuelle. Les prénoms sont enregistrés dans tes appareils et échangés par une liaison chiffrée ; ils ne sont pas publiés.</p>
      <div class="row start" style="margin-top:16px"><button class="btn" id="import-classe-choisir" type="button">Importer une liste de classe</button><input type="file" id="import-classe-file" accept=".csv,.txt,.tsv,.json,text/csv,text/plain,application/json" hidden></div>
      <p class="muted" style="margin:8px 0 0">CSV, TXT ou JSON, jusqu'à 100 élèves et 1 Mo. Le fichier est lu sur cet appareil. Tu pourras vérifier la liste avant de l'enregistrer.</p>
      <p id="import-classe-info" role="status" style="margin:8px 0 0"></p>
      <form class="card" id="import-classe-apercu" hidden autocomplete="off" style="margin-top:16px"><h2 style="font-size:24px">Vérifier la liste à importer</h2><p id="import-classe-compte" class="muted"></p>
        <p class="muted">Corrige les noms si besoin ; efface un nom pour l'écarter. Les élèves déjà présents conservent leur identifiant, leur objectif et leurs résultats. Pour distinguer deux élèves de même prénom, ajoute leur nom.</p>
        <div class="form" id="import-classe-champs"></div><div class="row start" style="margin-top:16px"><button class="btn primary" id="import-classe-confirme" type="submit">Importer et enregistrer</button><button class="btn" id="import-classe-annule" type="button">Annuler</button></div></form>
      <p class="muted" style="margin-top:14px">Objectif automatique : meilleur score valide, en classe ou à la maison, + 10 %, avec au moins 5 MCLM de plus. Il augmente à chaque nouveau record et ne baisse pas après une lecture moins réussie. Tu peux saisir un objectif manuel à tout moment.</p><form class="form" id="f" autocomplete="off"></form><div class="row start" style="margin-top:16px"><button class="btn primary" id="sv" type="button">Enregistrer</button><button class="btn" id="add" type="button">Ajouter un élève</button><span class="saved" id="ok" role="status"></span></div>`;
    const f = box.querySelector("#f");
    box.querySelector("#import-classe-choisir").onclick=()=>box.querySelector("#import-classe-file").click();
    f.onsubmit = e=>e.preventDefault();
    const lit = () => { const suivants=liste.map((s,i)=>({nom:ImportClasse.valideNom(f.querySelector("#n"+i).value) || `Élève ${i+1}`,objectif:ImportClasse.valideObjectif(f.querySelector("#g"+i).value)})); suivants.forEach((s,i)=>Object.assign(liste[i],s)); };
    const dessine = () => { f.innerHTML = ""; liste.forEach((s,i)=>{ f.appendChild(el("label",{for:"n"+i, class:"label"}, `Élève ${i+1}`));
      const n = el("input",{id:"n"+i, "aria-label":`Prénom de l'élève ${i+1}`, maxlength:"80", autocapitalize:"words", spellcheck:"false"}); n.value = s.nom; f.appendChild(n);
      const zone=el("div",{class:"goal",style:"min-width:0"}), g = el("input",{id:"g"+i, inputmode:"numeric", maxlength:"3", placeholder:"Automatique", "aria-label":`Objectif de l'élève ${i+1}`, "aria-describedby":"objectif-info-"+i}); g.value = s.objectif ?? "";
      const info=el("small",{id:"objectif-info-"+i,class:"muted","data-objectif-info":s.id,"data-champ":"g"+i,style:"display:block;margin-top:4px;line-height:1.3"});
      zone.appendChild(g);zone.appendChild(info);f.appendChild(zone);g.oninput=()=>actualiseObjectifs(box); }); actualiseObjectifs(box); };
    dessine();
    box.querySelector("#sv").onclick = async ()=>{ try { box.querySelector("#ok").textContent = await Donnees.enregistreEleves(baseActuelle()) ? "Enregistré." : "Impossible d'enregistrer sur cet appareil."; } catch(e){ box.querySelector("#ok").textContent=e.message; } };
    box.querySelector("#add").onclick = ()=>{ try { lit(); if (liste.length>=ImportClasse.MAX_ELEVES){ box.querySelector("#ok").textContent="La classe contient déjà 100 élèves."; return; } liste.push({id:"e"+Plateforme.rid(4), nom:`Élève ${liste.length+1}`, objectif:""}); dessine(); f.querySelector("#n"+(liste.length-1)).select(); } catch(e){ box.querySelector("#ok").textContent=e.message; } };
    const apercu=box.querySelector("#import-classe-apercu"), info=box.querySelector("#import-classe-info"); let lecture=0;
    /* Reprend les nouvelles données reçues entre-temps, avec les modifications locales explicites. */
    const baseActuelle = () => {
      lit(); const locaux=new Map(liste.map(e=>[e.id,e]));
      const base=Donnees.eleves().map(e=>{ const avant=originaux.get(e.id), local=locaux.get(e.id); if(!avant || !local) return {...e}; return {...e, nom:local.nom!==avant.nom ? local.nom:e.nom, objectif:local.objectif!==avant.objectif ? local.objectif:e.objectif}; });
      const ids=new Set(base.map(e=>e.id)); liste.filter(e=>!originaux.has(e.id) && !ids.has(e.id)).forEach(e=>base.push({...e}));
      return base;
    };
    const prepare = eleves => ImportClasse.fusion(baseActuelle(),eleves,{remplaceDefaut:Donnees.sansEssais()});
    const affiche = resultat => {
      const plan=prepare(resultat.eleves), champs=box.querySelector("#import-classe-champs"); champs.innerHTML="";
      resultat.eleves.forEach((e,i)=>{
        const id="import-classe-nom-"+i; champs.appendChild(el("label",{for:id,class:"label"},String(i+1)));
        const n=el("input",{id,"data-import-nom":String(i),maxlength:"80","aria-label":`Nom importé ${i+1}`,autocapitalize:"words",spellcheck:"false"});n.value=e.nom;champs.appendChild(n);
        const g=el("input",{class:"goal","data-import-objectif":String(i),inputmode:"numeric",maxlength:"3",placeholder:"objectif (mots/min)","aria-label":`Objectif importé ${i+1}`});g.value=e.objectif;champs.appendChild(g);
      });
      box.querySelector("#import-classe-compte").textContent=`${resultat.eleves.length} élève(s) dans la liste : ${plan.ajoutes} à ajouter, ${plan.reconnus} déjà présent(s).`+(resultat.ignores?` ${resultat.ignores} ligne(s) vide(s) ou inactive(s) ignorée(s).`:"")+(resultat.doublons?` ${resultat.doublons} doublon(s) regroupé(s).`:"")+(plan.remplaceDefaut?" Les fiches « Élève n » de départ seront remplacées.":"");
      apercu.hidden=false; info.textContent="Liste prête à vérifier. Rien n'a encore été enregistré.";
    };
    box.querySelector("#import-classe-file").onchange=async e=>{
      const fichier=e.target.files[0], numero=++lecture; if(!fichier) return; apercu.hidden=true; info.textContent="Lecture du fichier…";
      try {
        if(fichier.size>ImportClasse.MAX_OCTETS) throw new Error("Le fichier doit faire au maximum 1 Mo.");
        const texte=await new Promise((resolve,reject)=>{ const lecteur=new FileReader();lecteur.onload=()=>resolve(lecteur.result);lecteur.onerror=()=>reject(new Error("Impossible de lire ce fichier. Réessaie avec une copie locale."));lecteur.readAsText(fichier,"UTF-8"); });
        if(numero!==lecture || !apercu.isConnected) return;
        affiche(ImportClasse.lit(texte,fichier.name));
      } catch(err){ if(numero===lecture && info.isConnected) info.textContent=err.message||"Ce fichier n'est pas une liste de classe valide."; }
      finally { e.target.value=""; }
    };
    box.querySelector("#import-classe-annule").onclick=()=>{
      try { const base=baseActuelle();liste.splice(0,liste.length,...base);originaux.clear();Donnees.eleves().forEach(e=>originaux.set(e.id,{...e}));dessine();info.textContent="Import annulé. Aucun changement enregistré."; }
      catch(err){ info.textContent="Import annulé. "+err.message; }
      apercu.hidden=true;
    };
    apercu.onsubmit=async e=>{
      e.preventDefault(); const bouton=box.querySelector("#import-classe-confirme"); if(bouton.disabled) return;
      try {
        const noms=[...apercu.querySelectorAll("[data-import-nom]")], objectifs=[...apercu.querySelectorAll("[data-import-objectif]")];
        const plan=prepare(noms.map((n,i)=>({nom:n.value,objectif:objectifs[i].value}))); bouton.disabled=true;
        if(!await Donnees.enregistreEleves(plan.eleves)) throw new Error("Impossible d'enregistrer sur cet appareil. La classe précédente est conservée.");
        apercu.hidden=true;vueEleves(box);box.querySelector("#ok").textContent=`Import enregistré : ${plan.ajoutes} élève(s) ajouté(s), ${plan.reconnus} déjà présent(s).`;
      } catch(err){ info.textContent=err.message||"Impossible d'importer cette liste.";bouton.disabled=false; }
    };
    EnvoiMaison.ajouteBouton(box);
  }

  function prepareImpression(E){
    if(!estDisponible(E)||(ROLE==="parents"&&!ouvertFamille(E)))return false;
    const feuille = $("#maison-impression");
    feuille.replaceChildren(); feuille.dataset.ep=E.id;
    feuille.classList.toggle("texte-long",E.nbMots>300);
    const titre=el("h1");titre.textContent=E.titre;feuille.appendChild(titre);
    feuille.classList.toggle("texte-vers",E.layout?.type==="vers");
    const corps=el("div",{class:"impression-corps"});feuille.appendChild(corps);
    let p=null;
    motsDefi(E).forEach((t,i)=>{
      if(!p || ["paragraph","stanza"].includes(t.rupture)){
        p=el("p",{"data-debut":String(i)});corps.appendChild(p);
      } else if(t.rupture) ajouteRupture(p,t);
      else p.appendChild(document.createTextNode(" "));
      const mot=el("span",{class:"impression-mot","data-index":String(i)});mot.textContent=t.t;p.appendChild(mot);
    });
    if(E.source){const source=el("footer");source.textContent=E.source;feuille.appendChild(source);}
    document.documentElement.dataset.impression="texte";
    return true;
  }
  function imprimeTexte(E){
    if(prepareImpression(E)) window.print();
  }

  let actx = null;
  function bip(duree=.6){
    let annule=false, joue=false, o=null, g=null;
    const nettoie=()=>{try{o?.disconnect();g?.disconnect();}catch(e){}o=null;g=null;};
    const arrete=()=>{annule=true;try{o?.stop();}catch(e){}nettoie();};
    try {
      // Safari/WKWebView utilisent sinon « ambient » : les voix restent audibles,
      // mais le commutateur silencieux coupe WebAudio (WebKit 237322, iOS 17+).
      try{const session=window.navigator?.audioSession;if(session&&session.type!=="playback")session.type="playback";}catch(e){}
      if(!actx || actx.state==="closed")actx=new (window.AudioContext||window.webkitAudioContext)();
      const contexte=actx;
      const emet=()=>{
        if(annule || joue || contexte!==actx || contexte.state!=="running" || document.hidden)return;
        joue=true;
        try{
          const t=contexte.currentTime;o=contexte.createOscillator();g=contexte.createGain();
          o.frequency.value=880;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+duree);
          o.connect(g);g.connect(contexte.destination);o.onended=nettoie;o.start();o.stop(t+duree);
        }catch(e){nettoie();}
      };
      // Le resume reste dans le geste du clic, y compris après interruption iOS.
      // Aucun son n'est mis en attente dans un contexte encore suspendu.
      if(contexte.state!=="running"){
        const reprise=contexte.resume();reprise?.then(emet).catch(()=>{});
      }
      emet();
    } catch(e){}
    return arrete;
  }
  function compteRebours({surNombre,termine}){
    let actif=true, nombre=3, timer=null, arreteBip=()=>{};
    const suivant=()=>{
      if(!actif) return;
      arreteBip();
      if(nombre===0){actif=false;termine();return;}
      arreteBip=bip(.18);surNombre(nombre--);
      if(actif) timer=setTimeout(suivant,1000);
    };
    suivant();
    return ()=>{actif=false;clearTimeout(timer);arreteBip();};
  }

  async function demarre(){
    window.addEventListener("afterprint",()=>{delete document.documentElement.dataset.impression;});
    if (ROLE==="parents"){ await MaisonCloud.init(); await Parents.demarre(); return; }
    await Donnees.init();
    if (ROLE==="tel"){ document.getElementById("app-tel").hidden = false; await Telephone.demarre(); }
    else { document.getElementById("app-ecran").hidden = false; await Ecran.demarre(); }
    await MaisonCloud.init(); EnvoiMaison.recoitLien();
  }
  return { DATA, EPS, ROLE, $, el, esc, estMot, nu, ep, estDisponible, textesDisponibles, textesFamille, ouvertFamille, dateFamille, estTamallette, libelleEpisode, etapesEpisode, motsDefi, ajouteRupture, DUREE, ImportClasse, Donnees, Lien, calcule, bilan, carteResultat, libelleLecture, motsDifficiles, courbe, vueProgres, vueEleves, actualiseObjectifs, prepareImpression, imprimeTexte, bip, compteRebours, demarre };
})();
window.Banc = Banc;

</script>
<script>
/* ---------- L'écran de la classe (TBI) ----------
   Un écran par moment de la séance : les mots, j'écoute, l'écho, le chœur, le défi, les progrès.
   Le téléphone relié sert de télécommande (il voit les boutons de l'écran et les touche à distance)
   et peut mener le défi : il compte les erreurs en silence, l'écran montre le chrono puis le résultat. */
"use strict";
const Ecran = (() => {
  const { EPS, $, el, esc, estMot, ep, estTamallette, libelleEpisode, etapesEpisode, motsDefi, DUREE, Donnees, Lien, calcule, bilan, carteResultat, courbe, vueProgres, vueEleves, bip } = Banc;
  const view = $("#view"), audio = $("#audio");
  const maison = Banc.ROLE === "parents";
  let optionsMaison = {}, reglagesLecteur = maison ? {vitesse:()=>0.8, fixeVitesse:()=>{}} : Donnees;
  let route = {name:"home"};
  let cleanup = ()=>{};

  function go(r){
    if(r?.name==="episode" && !Banc.estDisponible(ep(r.id))) r={name:"home"};
    if (maison){
      const E = r && r.name === "episode" && ep(r.id);
      r = Banc.ouvertFamille(E) ? {name:"episode",id:E.id,step:4} : {name:"home"};
    }
    stopAudio(); route = r; render(); $("#main").scrollTop = 0;
    if (maison) window.scrollTo(0,0);
  }
  document.querySelectorAll("#app-ecran [data-go]").forEach(b=>b.addEventListener("click", ()=>go({name:b.dataset.go})));
  $("#home-link").addEventListener("click", ()=>go({name:"home"}));
  $("#home-link").addEventListener("keydown", e=>{ if (e.key==="Enter") go({name:"home"}); });
  $("#fs").addEventListener("click", async ()=>{ try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch(e){} });
  function render(){
    document.querySelectorAll("#app-ecran [data-go]").forEach(b=>b.setAttribute("aria-current", (b.dataset.go===route.name || (route.name==="episode" && b.dataset.go==="home")) ? "page" : "false"));
    if (route.name==="home") renderHome();
    else if (route.name==="episode") renderEpisode();
    else if (route.name==="students") vueEleves(view);
    else if (route.name==="progress") vueProgres(view);
    annonce();
  }

  /* ---------- Accueil ---------- */
  function renderHome(){
    if(maison){ if(optionsMaison.accueil) cleanup=optionsMaison.accueil(view)||(()=>{}); return; }
    view.innerHTML = `<h1 style="font-size:clamp(28px,3.4vw,46px)">${maison ? "Un moment de lecture ensemble" : "Le feuilleton de la période 2"}</h1>
    <p class="lead">${maison ? "Choisissez un texte. Préparez les mots, écoutez la voix et entraînez-vous à lire. Un adulte peut ensuite accompagner le défi d’une minute." : "Sept enquêtes de Maya, Sami, Jules et Romy. Chaque semaine, un papier écrit à l'encre verte attend la bande sous le banc des maîtres."}</p>
    ${maison ? '<h2 class="collection">Le banc des maîtres</h2>' : ""}
    <div class="eps" id="eps"></div>
    ${Banc.textesDisponibles().some(estTamallette)?`<section class="collection"><h2>Tamallette · période 2</h2><p class="lead">Les textes prévus pour la période : les mots à préparer, la lecture et le défi d'une minute.</p><div class="eps" id="eps-tamallette"></div></section>`:""}`;
    Banc.textesDisponibles().forEach(E=>{
      const n = E.pages.length-1, imgs = E.pages.slice(1).filter(p=>p.img).length, tamallette = estTamallette(E);
      const b = el("button",{class:"ep"+(tamallette ? " ep-texte" : ""), type:"button", "data-ep":E.id});
      b.innerHTML = (E.pages[1] && E.pages[1].img ? `<img class="vign" src="${esc(E.pages[1].img)}" alt="" loading="lazy">` : (tamallette ? "" : `<div class="vign"></div>`)) +
        `<span class="num">${esc(libelleEpisode(E))}</span><b>${esc(E.titre)}</b><span class="meta">${esc(E.semaine)} · ${esc(E.theme)}</span><span class="meta">${E.nbMots} mots</span>
        <span class="chips"><span class="chip ${E.audio?"ok":""}">${E.audio?"Voix enregistrée":"Voix à venir"}</span>${tamallette?"":`<span class="chip ${imgs===n?"ok":""}">${imgs===n?"Images prêtes":"Images "+imgs+"/"+n}</span>`}</span>`;
      b.addEventListener("click", ()=>go({name:"episode", id:E.id, step:0}));
      $(tamallette ? "#eps-tamallette" : "#eps").appendChild(b);
    });
    if (maison && optionsMaison.accueil) optionsMaison.accueil(view);
  }

  /* ---------- Séance ---------- */
  let EP = null, page = 1, wordSpans = [], sentSpans = [], cur = -1, raf = 0, playing = false, stopAt = null, onStop = ()=>{}, echoSent = null, waiting = false, mode = "listen";
  function renderEpisode(){
    EP = ep(route.id);
    const step = route.step||0;
    if(maison){
      view.innerHTML=`<div class="ephead maison-entete"><button class="btn" id="back" type="button">Retour aux textes</button><h1>${esc(EP.titre)}</h1><button class="btn" id="maison-imprimer" type="button">Imprimer le texte</button></div><div class="panel" id="panel"></div>`;
      $("#back").onclick=()=>go({name:"home"});
      $("#maison-imprimer").onclick=()=>optionsMaison.imprime?.(EP);
      cleanup=optionsMaison.defi?.($("#panel"),EP) || (()=>{});
      return;
    }
    view.innerHTML = `<div class="ephead"><button class="btn" id="back" aria-label="Retour aux textes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>${esc(libelleEpisode(EP))} — ${esc(EP.titre)}</h2><nav class="steps" id="steps" aria-label="Étapes de la séance"></nav></div><div class="panel" id="panel"></div>`;
    $("#back").onclick = ()=>go({name:"home"});
    {
      const imprimer = el("button",{class:"btn",id:"maison-imprimer",type:"button"},"Imprimer le texte");
      imprimer.onclick = ()=>{ if(playing) togglePlay(); Banc.imprimeTexte(EP); };
      $("#steps").before(imprimer);
    }
    let numero = 0;
    etapesEpisode(EP).forEach((s,i)=>{
      if (maison && (i===5 || (!EP.audio && (i===2 || i===3)))) return;
      const b = el("button",{class:"step", type:"button", "data-step":String(i)}, `<i>${++numero}</i>${s}`); if (i===step) b.setAttribute("aria-current","step"); b.onclick = ()=>go({name:"episode", id:EP.id, step:i}); $("#steps").appendChild(b);
    });
    const P = $("#panel");
    if (step===0) stepWords(P);
    else if (step>=1 && step<=3) stepReader(P, ["listen","echo","choir"][step-1]);
    else if (step===4){
      if (maison){ if (optionsMaison.defi) cleanup = optionsMaison.defi(P,EP) || (()=>{}); }
      else stepDefi(P);
    }
    else stepProgress(P);
  }

  /* 1. Les mots à préparer */
  function stepWords(P){
    let i = 0, timer = null, delay = 2000;
    P.innerHTML = `<div class="flash"><div class="count" id="wc"></div><div class="word" id="wd"></div>
      <div class="row"><button class="btn big" id="wp" data-tele="◀ Mot précédent" aria-label="Mot précédent">◀</button><button class="btn big primary" id="wn" data-tele>Mot suivant</button><button class="btn big" id="wa" data-tele>Flash</button>
      <div class="seg" id="wdel" role="group" aria-label="Vitesse du flash"><button id="wd30" data-tele="Lent" data-tele-g="flash" data-v="3000" aria-pressed="false">Lent</button><button id="wd20" data-tele="Moyen" data-tele-g="flash" data-v="2000" aria-pressed="true">Moyen</button><button id="wd10" data-tele="Rapide" data-tele-g="flash" data-v="1000" aria-pressed="false">Rapide</button></div>
      <button class="btn big" id="wall" data-tele>Tous les mots</button></div></div>`;
    const show = ()=>{ $("#wd").textContent = EP.mots[i]; $("#wc").textContent = `${i+1} / ${EP.mots.length}`; annonce(); };
    const next = ()=>{ i = (i+1)%EP.mots.length; show(); };
    $("#wn").onclick = ()=>{ stopFlash(); next(); };
    $("#wp").onclick = ()=>{ stopFlash(); i = (i-1+EP.mots.length)%EP.mots.length; show(); };
    const stopFlash = ()=>{ if (timer){ clearInterval(timer); timer = null; $("#wa").textContent = "Flash"; annonce(); } };
    $("#wa").onclick = ()=>{ if (timer){ stopFlash(); return; } $("#wa").textContent = "Arrêter"; timer = setInterval(next, delay); annonce(); };
    $("#wdel").onclick = e=>{ const b = e.target.closest("button"); if (!b) return; delay = +b.dataset.v; $("#wdel").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); if (timer){ clearInterval(timer); timer = setInterval(next, delay); } annonce(); };
    $("#wall").onclick = ()=>{ stopFlash(); const f = P.querySelector(".flash"); const showing = f.dataset.all==="1"; f.dataset.all = showing ? "0" : "1";
      $("#wd").style.display = showing ? "" : "none"; $("#wc").style.display = showing ? "" : "none";
      let a = f.querySelector(".allwords"); if (!a){ a = el("div",{class:"allwords"}); EP.mots.forEach(w=>a.appendChild(el("span",{},esc(w)))); f.insertBefore(a, f.querySelector(".row")); }
      a.style.display = showing ? "none" : ""; $("#wall").textContent = showing ? "Tous les mots" : "Un par un"; annonce(); };
    show();
    cleanup = ()=>stopFlash();
  }

  /* 2-4. Le lecteur : écoute, écho, chœur */
  const LIB = {listen:"Écouter", echo:"Écouter la phrase", choir:"Lire avec la voix"};
  function stepReader(P, m){
    mode = m; page = 0; onStop = ()=>{};
    const hasAudio = !!EP.audio;
    P.innerHTML = `<div class="stage"><div class="pic" id="pic"></div><div class="textbox"><div class="text" id="txt" lang="fr"></div></div></div>

  let tourDefiDistant=null,sequenceDefiDistante=-1;const toursDefiPasses=new Set();
  function recoitDefi(d){
    if (!d || !Banc.estDisponible(ep(d.ep)) || !["repos","pret","decompte","lecture","choix","fini"].includes(d.etat)) return;
    if(typeof d.tour==="string"&&Number.isSafeInteger(d.sequence)){
      if(toursDefiPasses.has(d.tour))return;
      if(tourDefiDistant!==d.tour){if(tourDefiDistant)toursDefiPasses.add(tourDefiDistant);tourDefiDistant=d.tour;sequenceDefiDistante=-1;}
      if(d.sequence<=sequenceDefiDistante)return;sequenceDefiDistante=d.sequence;
    }
    if(Defi?.local&&["countdown","run","pick","saving"].includes(Defi.etat))return;
    if (route.name!=="episode" || route.id!==d.ep || route.step!==4){ if (d.etat==="repos") return; go({name:"episode", id:d.ep, step:4}); }
    if (Defi && Defi.recoit) Defi.recoit(d);
  }

  /* ---------- Fenêtre « Relier le téléphone » ---------- */
  const L = Plateforme.Liaison;
  function majPastille(){ const on = Lien.relie(); $("#b-tel-dot").classList.toggle("on", on); $("#b-tel-txt").textContent = on ? "Téléphone relié" : "Relier le téléphone"; const f = $("#lier-etat"); if (f) f.innerHTML = on ? `<span class="dot on"></span>Téléphone relié !` : `<span class="dot"></span>En attente du téléphone…`; }
  function fenetre(){
    if (maison) return;
    const code = L.code(); if (!code) return;
    const lien = L.lienTel(code);
    const v = el("div",{class:"voile", id:"lier"});
    v.innerHTML = `<div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="lier-t">
      ${lien?`<div class="qr" aria-label="QR code de liaison">${L.qr(lien, 320)}</div>`:""}
      <div><h2 id="lier-t" style="font-size:clamp(26px,3vw,38px)">Relier ton téléphone</h2>
        <ol>${lien?`<li>Vise ce QR code avec l'appareil photo du téléphone.</li><li>Touche le lien qui apparaît : la télécommande s'ouvre, déjà reliée.</li><li>Sans appareil photo : ouvre <b>${esc(lien.replace(/#.*$/,""))}</b> sur le téléphone et tape ce code :</li>`:`<li>Sur le téléphone, ouvre le site Fluence.</li><li>Tape ce code :</li>`}</ol>
        <div class="code" style="margin-top:8px">${esc(code)}</div>
        <div class="etat-lien" id="lier-etat" role="status"></div>
        <p class="muted" style="margin:14px 0 0">Les messages entre les deux appareils sont chiffrés avec ce code. Les prénoms et les résultats restent dans l'ordinateur et le téléphone.</p>
        <div class="row start" style="margin-top:16px"><button class="btn primary" id="lier-ok">Fermer</button><button class="btn" id="lier-neuf">Changer de code</button></div></div></div>`;
    document.body.appendChild(v); majPastille();
    const ferme = ()=>v.remove();
    v.addEventListener("click", e=>{ if (e.target===v) ferme(); });
    v.querySelector("#lier-ok").onclick = ferme;
    v.querySelector("#lier-neuf").onclick = async e=>{ const b = e.currentTarget; if (b.dataset.sur!=="1"){ b.dataset.sur = "1"; b.textContent = "Le téléphone devra se relier à nouveau : confirmer ?"; return; } await L.nouveau(); location.hash = ""; location.reload(); };
    v.querySelector("#lier-ok").focus();
  }
  if (!maison) $("#b-tel").addEventListener("click", fenetre);
  document.addEventListener("keydown", e=>{ if (e.key==="Escape" && $("#lier")) $("#lier").remove(); });

  async function demarre(){
    if (maison) return demarreMaison(optionsMaison);
    Donnees.surChange(q=>{ if (q==="classe" || q==="resultats"){ if (route.name==="students"){ if(q==="classe" && !document.activeElement?.closest("#f")) vueEleves(view); Banc.actualiseObjectifs(view); } else if (route.name==="progress") vueProgres(view); else if (route.name==="episode" && route.step===5) renderEpisode(); else if (route.name==="episode" && route.step===4){ if(q==="classe" && !Defi?.etat?.match(/countdown|run|pick|saving/)) renderEpisode(); else if(q==="resultats") Defi?.actualiseObjectif?.(); } } });
    render();
    const room = await Lien.init();
    if (room){
      Lien.on("cmd", m=>commande(m.data));
      Lien.on("defi", m=>recoitDefi(m.data));
      Lien.surEtat(on=>{ majPastille(); if (on) relance(); else Defi?.annuleDistant?.(); });
      majPastille();
    } else $("#b-tel").hidden = true;
  }
  function demarreMaison(options={}){
    if (!maison) return;
    optionsMaison = options;
    reglagesLecteur = {vitesse:options.vitesse || (()=>0.8), fixeVitesse:options.fixeVitesse || (()=>{})};
    $("#app-tel").hidden = true; $("#app-ecran").hidden = false;
    document.title = "Fluence à la maison";
    $("#home-link span").textContent = "Fluence à la maison";
    document.querySelectorAll("#app-ecran [data-enseignant]").forEach(b=>b.hidden=true);
    go({name:"home"});
  }
  return { demarre, demarreMaison, go, etat, route:()=>route };
})();
window.Ecran = Ecran;

</script>
<script>
/* ---------- Le téléphone de la maîtresse ----------
   Écran : la télécommande (les boutons de l'écran de la classe, touchés à distance).
   Défi : le chrono et les erreurs notées en silence ; l'écran de la classe montre le chrono puis le résultat.
   Élèves et Progrès : les mêmes que sur l'écran, gardés aussi dans le téléphone. */
"use strict";
const Telephone = (() => {
  const { EPS, $, el, esc, ep, estTamallette, libelleEpisode, etapesEpisode, motsDefi, DUREE, Donnees, Lien, calcule, bilan, carteResultat, vueProgres, vueEleves, bip } = Banc;
  const L = Plateforme.Liaison, lsG = Plateforme.lsG, lsS = Plateforme.lsS;
  const main = $("#t-main");
  const ONGLETS = ["ecran","defi","eleves","progres"];
  let onglet = ONGLETS.includes(lsG("banc-des-maitres-onglet")) ? lsG("banc-des-maitres-onglet") : "ecran";
  let E = null; // ce que montre l'écran de la classe (dernier état reçu)

  function majLien(){
    const on = Lien.relie();
    $("#t-dot").classList.toggle("on", on);
    $("#t-lien-txt").textContent = !L.code() ? "Pas relié" : on ? "Écran relié" : "Écran absent";
  }
  function va(o){ if(o!=="defi"&&D.etat==="decompte")annuleDepart(false); onglet = o; lsS("banc-des-maitres-onglet", o); rend(); main.scrollTop = 0; }
  $("#t-tabs").addEventListener("click", e=>{ const b = e.target.closest("[data-tab]"); if (b) va(b.dataset.tab); });
  function rend(){
    document.querySelectorAll("#t-tabs [data-tab]").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===onglet ? "page" : "false"));
    if (onglet==="ecran") rendEcran();
    else if (onglet==="defi") rendDefi();
    else if (onglet==="eleves") vueEleves(main);
    else vueProgres(main, true);
  }
  const cmd = d => Lien.emit("cmd", d);

  /* ---------- Écran : relier, puis télécommande ---------- */
  function carteLier(titre){
    return `<div class="card"><h2>${titre}</h2>
      <ol style="margin:8px 0 0;padding-left:1.3em"><li>Sur l'ordinateur de la classe, ouvre Fluence et touche <b>Relier le téléphone</b>.</li><li>Vise le QR code avec l'appareil photo de ce téléphone, puis touche le lien.</li><li>Ou tape le code affiché sous le QR code :</li></ol>
      <form class="champ" id="t-code"><input id="t-code-in" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code de liaison"><button class="btn primary">Relier</button></form>
      <p class="muted" id="t-code-err" role="status" style="margin:8px 0 0"></p></div>`;
  }
  function brancheLier(){
    const f = $("#t-code"); if (!f) return;
    f.onsubmit = async e=>{ e.preventDefault(); const c = Plateforme.normalise($("#t-code-in").value);
      if (!c){ $("#t-code-err").textContent = "Le code a 10 lettres ou chiffres, par exemple 7KQ2M-X9D4A."; return; }
      await L.fixe(c); history.replaceState(null, "", location.pathname+location.search); location.reload(); };
  }
  function carteEnvoi(){
    const url = L.code() ? L.lienEcran() : "";
    return `<div class="card" style="margin-top:12px"><button class="btn primary" id="t-envoi">Envoyer le lien à l’ordinateur</button>
      <p class="muted" style="margin:8px 0 0">Ouvre le lien sur l'ordinateur de la classe : il se reliera à ce téléphone.</p>
      <p id="t-envoi-info" role="status" style="margin:8px 0 0"></p>
      <p id="t-envoi-lien" style="margin:8px 0 0;overflow-wrap:anywhere"${url?"":" hidden"}>${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`:""}</p></div>`;
  }
  function brancheEnvoi(){ const b = $("#t-envoi"); if (b) b.onclick = envoieLien; }
  async function envoieLien(){
    const b = $("#t-envoi"), avant = L.code(); if (!b || b.disabled) return;
    b.disabled = true;
    let cree = false;
    try {
      const code = await L.assure(), url = L.lienEcran(code); cree = !avant;
      if (!url){ $("#t-envoi-info").textContent = "L'adresse du site n'est pas encore disponible."; return; }
      const lien = $("#t-envoi-lien"); lien.hidden = false; lien.innerHTML = `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`;
      const donnees = {title:"Fluence", text:"Ouvre ce lien sur l'ordinateur de la classe :", url};
      const annule = e => e && (e.name==="AbortError" || /cancel|annul|abort/i.test(String(e.code||"")+" "+String(e.message||"")));
      let partage = false;
      if (Plateforme.partage){
        try { await Plateforme.partage.share({...donnees, dialogTitle:"Envoyer le lien"}); partage = true; }
        catch(e){ if (annule(e)) return; }
      }
      if (!partage && navigator.share){
        try { await navigator.share(donnees); partage = true; }
        catch(e){ if (annule(e)) return; }
      }
      if (partage) $("#t-envoi-info").textContent = "Le lien est prêt. Ouvre-le sur l'ordinateur de la classe.";
      else {
        try { await navigator.clipboard.writeText(url); $("#t-envoi-info").textContent = "Lien copié. Colle-le dans un message ou dans le navigateur de l'ordinateur."; }
        catch(e){ $("#t-envoi-info").textContent = "Copie le lien ci-dessous pour l'ouvrir sur l'ordinateur de la classe."; }
      }
    } catch(e){ const info = $("#t-envoi-info"); if (info) info.textContent = "Le lien n'a pas pu être préparé. Réessaie."; }
    finally {
      if (cree){ history.replaceState(null, "", location.pathname+location.search+"#lien="+L.code()+"&tel"); location.reload(); }
      else if (b.isConnected) b.disabled = false;
    }
  }
  function astuce(){
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if (Plateforme.NATIF || !ios || navigator.standalone || lsG("banc-des-maitres-astuce")) return "";
    return `<div class="card astuce" id="t-astuce"><b>Pour que le téléphone garde les résultats</b><p style="margin:6px 0 10px">Ajoute Fluence à l'écran d'accueil : bouton <b>Partager</b> de Safari, puis <b>Sur l'écran d'accueil</b>. Ouvre-le ensuite depuis son icône.</p><button class="btn" id="t-astuce-ok">Compris</button></div>`;
  }
  function rendEcran(){
    if (!L.code()){ main.innerHTML = carteLier("Relie ce téléphone à l'écran de la classe") + carteEnvoi() + `<p class="muted" style="margin-top:14px">Sans écran relié, le défi, les élèves et les progrès marchent aussi sur le téléphone seul.</p><button class="btn" id="t-role" style="margin-top:6px">Lire les textes sur ce téléphone</button>`; brancheLier(); brancheEnvoi(); $("#t-role").onclick = ()=>{ Plateforme.changeRole("ecran"); location.reload(); }; return; }
    let h = astuce();
    if (!Lien.relie() || !E){
      h += `<div class="card"><h2>L'écran de la classe n'est pas là</h2><p style="margin:6px 0 0">Ouvre Fluence sur l'ordinateur de la classe : il se relie tout seul à ce téléphone, avec internet.</p><p class="muted" style="margin:8px 0 0">Code de liaison : <b>${esc(L.code())}</b></p></div>
        <details class="card" style="margin-top:12px"><summary style="font-weight:700;min-height:44px;display:flex;align-items:center;cursor:pointer">Relier un autre écran</summary>${carteLier("Nouveau code")}</details>` + carteEnvoi();
      main.innerHTML = h; brancheLier(); brancheAstuce(); brancheEnvoi(); return;
    }
    if (E.son===0) h += `<div class="card astuce"><b>Le son est bloqué sur l'ordinateur.</b> Touche une fois l'écran de la classe, puis réessaie.</div>`;
    if (E.vue==="episode" && Banc.estDisponible(ep(E.ep))){
      const X = ep(E.ep);
      h += `<div class="card"><div class="label">Sur l'écran</div><h2>${esc(libelleEpisode(X))} — ${esc(X.titre)}</h2>
        <div class="etapes">${etapesEpisode(X).map((s,i)=>`<button class="btn${i===E.etape?" primary":""}" data-nav="${i}">${i+1}. ${s}</button>`).join("")}</div></div>`;
      h += `<div class="card">`;
      if (E.etape===0) h += `<div class="label">Mot affiché</div><div style="font-size:30px;font-weight:700;margin:4px 0 2px">${esc(E.mot||"")}</div>`;
      if (E.etape>=1 && E.etape<=3) h += `<div class="label">${E.page ? `Page ${E.page} / ${E.pages}` : "Titre"}${E.lecture ? " · lecture en cours" : ""}${E.attente ? " · à vous !" : ""}</div>${X.audio?"":`<p class="noaudio">Voix à venir : lecture libre.</p>`}`;
      if (E.etape===4){ h += `<p style="margin:0">Le défi se mène dans l'onglet <b>Défi</b> : tu notes les erreurs, l'écran montre le chrono puis le résultat.</p><div class="tele"><button class="btn primary" id="t-vers-defi">Ouvrir le défi</button></div>`; }
      else if (E.etape===5) h += `<p style="margin:0">L'écran montre les progrès du groupe sur ce texte.</p>`;
      h += boutons(E.boutons) + `</div>`;
    } else if (E.vue==="home"){
      h += `<div class="card"><div class="label">Sur l'écran : les textes</div><h2>Quel texte ouvrir ?</h2>${[false,true].map(t=>{ const textes = Banc.textesDisponibles().filter(X=>!!estTamallette(X)===t); return textes.length ? `<h3 style="margin-top:16px">${t?"Tamallette · période 2":"Le feuilleton"}</h3><div class="liste">${textes.map(X=>`<button class="btn" data-ep="${X.id}"><span><b>${esc(libelleEpisode(X))} — ${esc(X.titre)}</b><small>${esc(X.semaine)}${X.audio?"":" · voix à venir"}</small></span></button>`).join("")}</div>` : ""; }).join("")}</div>`;
    } else {
      h += `<div class="card"><div class="label">Sur l'écran</div><h2>${E.vue==="students" ? "Les élèves" : "Les progrès"}</h2></div>`;
    }
    h += `<div class="row start" style="margin-top:14px"><button class="btn" data-vue="home">Textes</button><button class="btn" data-vue="students">Élèves</button><button class="btn" data-vue="progress">Progrès</button></div>
      <p class="muted" style="margin-top:14px">Code de liaison : ${esc(L.code())}</p>` + carteEnvoi();
    main.innerHTML = h; brancheAstuce(); brancheEnvoi();
    main.querySelectorAll("[data-nav]").forEach(b=>b.onclick = ()=>cmd({nav:{vue:"episode", ep:E.ep, etape:+b.dataset.nav}}));
    main.querySelectorAll("[data-ep]").forEach(b=>b.onclick = ()=>cmd({nav:{vue:"episode", ep:b.dataset.ep, etape:0}}));
    main.querySelectorAll("[data-vue]").forEach(b=>b.onclick = ()=>cmd({nav:{vue:b.dataset.vue}}));
    main.querySelectorAll("[data-clic]").forEach(b=>b.onclick = ()=>{ b.disabled = true; cmd({clic:b.dataset.clic}); setTimeout(()=>{ b.disabled = false; }, 1500); });
    const vd = $("#t-vers-defi"); if (vd) vd.onclick = ()=>{ D.ep = E.ep; va("defi"); };
  }
  function boutons(liste){
    if (!liste || !liste.length) return "";
    let h = `<div class="tele">`, g = null;
    liste.forEach(b=>{
      if (b.g!==g){ if (g) h += `</div>`; g = b.g; if (g) h += `<div class="seg" role="group" aria-label="${g==="vitesse"?"Vitesse de la voix":"Vitesse du flash"}">`; }
      h += g ? `<button data-clic="${esc(b.id)}" aria-pressed="${b.a?"true":"false"}"${b.d?" disabled":""}>${esc(b.t)}</button>`
             : `<button class="btn${b.p?" primary":""}" data-clic="${esc(b.id)}"${b.d?" disabled":""}>${esc(b.t)}</button>`;
    });
    if (g) h += `</div>`;
    return h + `</div>`;
  }
  function brancheAstuce(){ const b = $("#t-astuce-ok"); if (b) b.onclick = ()=>{ lsS("banc-des-maitres-astuce", "1"); $("#t-astuce").remove(); }; }

  /* ---------- Défi : mené depuis le téléphone ---------- */
  const D = {ep:lsG("banc-des-maitres-defi-ep") || null, eleve:null, etat:"choix", t0:0, tick:null, errs:new Set(), dernier:-1, ecoule:0, resultat:null, ok:true, nombre:3, annuleCompte:null, tour:Plateforme.rid(8), sequence:0};
  const envoie = (etat, plus) => Lien.emit("defi", Object.assign({etat, ep:D.ep, eleve:D.eleve, tour:D.tour, sequence:++D.sequence}, plus||{}));
  function epDefi(){ if (!Banc.estDisponible(ep(D.ep))) D.ep = (E && E.vue==="episode" && Banc.estDisponible(ep(E.ep)) ? E.ep : (Banc.textesDisponibles().find(x=>x.audio)||Banc.textesDisponibles()[0]).id); return ep(D.ep); }
  function rendDefi(){
    const X = epDefi(), DUR = DUREE(), toks = motsDefi(X);
    const ecranOccupe = E && E.defi && E.defi.local && Lien.relie();
    let h = "";
    if (D.etat==="choix"){
      h += `<div class="card"><label class="label" for="t-ep">Texte</label><select class="sel" id="t-ep" style="margin-top:6px">${[false,true].map(t=>{ const textes = Banc.textesDisponibles().filter(x=>!!estTamallette(x)===t); return textes.length ? `<optgroup label="${t?"Tamallette · période 2":"Le feuilleton"}">${textes.map(x=>`<option value="${x.id}"${x.id===X.id?" selected":""}>${esc(libelleEpisode(x))} — ${esc(x.titre)}</option>`).join("")}</optgroup>` : ""; }).join("")}</select>
        <div class="label" style="margin-top:14px">Qui lit ?</div><div class="who" id="t-who" style="margin-top:8px">${Donnees.eleves().map(s=>`<button type="button" data-eleve="${esc(s.id)}" aria-pressed="${s.id===D.eleve?"true":"false"}">${esc(s.nom)}</button>`).join("")}</div>
        <p class="muted" id="t-essai" style="margin:8px 0 0">${D.eleve ? `Essai n° ${Donnees.essaisDe(D.eleve, X.id).length+1} sur ce texte`+(Donnees.objectif(D.eleve)===null ? "" : ` · Objectif : ${Donnees.objectif(D.eleve)} MCLM`) : ""}</p>
        ${ecranOccupe ? `<p class="hint">Un défi est en cours sur l'écran de la classe.</p>` : ""}
        <div class="tele"><button class="btn primary" id="t-go"${D.eleve && !ecranOccupe ? "" : " disabled"}>Départ</button></div>
        <p class="muted" style="margin:6px 0 0">${Lien.relie() ? "Le texte s'affiche sur l'écran de la classe ; touche ici les mots mal lus." : "Sans écran relié : l'élève lit sur le texte imprimé ou au tableau."} ${DUR} secondes de lecture, après un décompte de 3 secondes avec un bip : 3, 2, 1.</p></div>`;
    } else if(D.etat==="decompte"){
      h+=`<div class="card"><div class="label">${esc(Donnees.nom(D.eleve))} · ${esc(libelleEpisode(X))}</div><div class="defi-compte-rebours" id="t-decompte" role="status" aria-live="polite"><span>Prêt ? La lecture commence dans</span><strong class="defi-compte-nombre" id="t-decompte-nombre">${D.nombre}</strong><span>secondes</span></div><p class="defi-consigne">La lecture commencera après 3 secondes.</p><button class="btn" id="t-annule-depart">Annuler le départ</button></div>`;
    } else if (D.etat!=="fini"){
      const reste = Math.max(0, Math.ceil(DUR-D.ecoule));
      h += `<div class="card"><div class="label">${esc(Donnees.nom(D.eleve))} · ${esc(libelleEpisode(X))}</div>
        <div class="chrono"><span class="big-num" id="t-reste">${D.etat==="lecture" ? reste : "0"}</span><span class="muted">secondes</span></div>
        <div class="timer"><i id="t-bar" style="width:${Math.min(100, D.ecoule/DUR*100)}%"></i></div>
        <p class="hint defi-consigne${D.etat==="dernier"?" etat-dernier":""}" id="t-hint" tabindex="-1" role="${D.etat==="dernier"?"alert":"status"}" style="margin:10px 0 0">${D.etat==="lecture" ? "Touche les mots mal lus (un deuxième toucher annule)." : "Temps écoulé ! Touche le dernier mot lu."}</p></div>`;
    } else {
      h += `<div class="card" id="t-res">${carteResultat(D.resultat, bilan(D.resultat), Donnees.nom(D.eleve), D.ok)}
        <div class="tele"><button class="btn primary" id="t-encore">Nouvel essai</button><button class="btn" id="t-autre">Autre élève</button><button class="btn danger" id="t-suppr">Supprimer cet essai</button></div></div>`;
    }
    h += `<div class="card tdefi"><div class="label">${D.etat==="choix" ? "Le texte" : "Touche les mots"}</div><div class="text" id="t-txt" lang="fr"></div></div>`;
    if (D.etat==="lecture") h += `<div class="collant"><button class="btn big primary" id="t-stop">Il a fini</button></div>`;
    if (D.etat==="dernier") h += `<div class="collant"><div class="defi-consigne etat-dernier" aria-hidden="true">Touche le dernier mot lu</div></div>`;
    main.innerHTML = h;
    const box = $("#t-txt"), spans = [];
    toks.forEach((x,i)=>{ Banc.ajouteRupture(box,x); const s = el("span",{class:"w"}); s.textContent = x.t; spans[i] = s; box.appendChild(s); box.appendChild(document.createTextNode(" ")); });
    const marque = () => spans.forEach((s,i)=>{ s.classList.toggle("err", D.errs.has(i) && (D.etat!=="fini" || i<=D.dernier)); s.classList.toggle("after", D.etat==="fini" && i>D.dernier); s.classList.toggle("last", D.etat==="fini" && i===D.dernier); });
    marque();box.classList.toggle("defi-attente-dernier",D.etat==="dernier");
    box.onclick = e=>{ const s = e.target.closest(".w"); if (!s) return; const i = spans.indexOf(s);
      if (D.etat==="lecture"){ if (!toks[i].w) return; D.errs.has(i) ? D.errs.delete(i) : D.errs.add(i); s.classList.toggle("err"); if (navigator.vibrate) navigator.vibrate(15); }
      else if (D.etat==="dernier"&&toks[i]?.w){ D.dernier = i; termine(); } };
    if (D.etat==="choix"){
      $("#t-ep").onchange = e=>{ D.ep = e.target.value; lsS("banc-des-maitres-defi-ep", D.ep); if (D.eleve) envoie("pret"); rendDefi(); };

    if ($("#t-autre")) $("#t-autre").onclick = ()=>{ D.etat = "choix"; D.resultat = null; D.eleve = null; envoie("repos"); rendDefi(); };
    if ($("#t-suppr")) $("#t-suppr").onclick = async e=>{ const b = e.currentTarget; if (b.dataset.sur!=="1"){ b.dataset.sur = "1"; b.textContent = "Confirmer la suppression ?"; return; }
      await Donnees.supprime(D.resultat.id); D.etat = "choix"; D.resultat = null; envoie("repos"); rendDefi(); };
  }
  function annuleDepart(redessine=true){
    if(D.etat!=="decompte")return;
    D.annuleCompte?.();D.annuleCompte=null;clearInterval(D.tick);D.tick=null;D.etat="choix";D.ecoule=0;D.t0=0;

  function depart(){
    if(D.etat!=="choix"||!D.eleve||(E?.defi?.local&&Lien.relie()))return;
    D.etat="decompte";D.nombre=3;D.errs=new Set();D.dernier=-1;D.ecoule=0;D.resultat=null;D.t0=0;
    clearInterval(D.tick);D.tick=null;lsS("banc-des-maitres-defi-ep",D.ep);Plateforme.eveille(true);
    D.annuleCompte=Banc.compteRebours({surNombre:n=>{if(D.etat!=="decompte")return;D.nombre=n;envoie("decompte",{nombre:n});if(onglet==="defi"){rendDefi();main.scrollTop=0;}},termine:()=>{

    }});
  }

  function finTemps(s){

  document.addEventListener("visibilitychange",()=>{if(document.hidden)annuleDepart();});
  window.addEventListener("pagehide",()=>annuleDepart(false));

  async function demarre(){

    Donnees.surChange(q=>{ if (onglet==="progres" && (q==="resultats" || q==="classe")) rend(); else if (onglet==="eleves"){ if(q==="classe" && !document.activeElement?.closest("#f")) rend(); Banc.actualiseObjectifs(main); } else if (onglet==="defi" && (q==="classe" || q==="resultats") && (D.etat==="choix" || D.etat==="fini")) rend(); });
    const room = await Lien.init();
    /* l'adresse garde le lien : « Sur l'écran d'accueil » (iPhone) emporte ainsi la liaison dans l'icône */
    if (L.code() && !location.hash.includes("lien="+L.code())) history.replaceState(null, "", location.pathname+location.search+"#lien="+L.code()+"&tel");
    majLien();
    if (!room){ rend(); return; }
    Lien.on("ecran", m=>{ E = m.data; if(D.etat==="decompte"&&E?.defi?.local&&Lien.relie())annuleDepart(); if (onglet==="ecran") rendEcran(); });
    Lien.surEtat(on=>{ majLien(); if (on){cmd({etat:1});if(D.etat==="decompte")envoie("decompte",{nombre:D.nombre});else if(D.etat==="lecture")envoie("lecture",{depuis:Math.max(0,performance.now()-D.t0)});else if(D.etat==="dernier")envoie("choix");} else E = null; if (onglet==="ecran") rendEcran(); });
    room.onConnection(()=>majLien());
    rend();
  }
  return { demarre, etat:()=>E, defi:()=>D };
})();

<script>
/* Progrès d'un seul enfant : réponse privée en mémoire, sans données de classe locales. */
"use strict";

      // Le service valide le contenu ; la vue ne conserve que les champs qu'elle affiche.
      const lectures=retour.lectures.map(r=>({id:r.id,ep:r.ep,date:r.date,origine:r.origine,mclm:r.mclm,lus:r.lus,erreurs:r.erreurs,secondes:r.secondes,fautes:Array.isArray(r.fautes)?r.fautes.slice():[],...(["entrainement","defi"].includes(r.typeLecture)?{typeLecture:r.typeLecture}:{})}));
      donnees={objectif:{valeur:retour.objectif.valeur,mode:retour.objectif.mode},lectures};rend();

  }
  function graphique(rs,objectif){
    const petit=innerWidth<680,W=petit?360:760,H=petit?250:285,L=42,R=24,T=24,B=42;
    const plafond=Math.max(20,Number.isFinite(objectif)?objectif:0,...rs.map(r=>r.mclm)),pas=Math.max(5,Math.ceil(plafond/4/5)*5),max=pas*4;
    const x=i=>rs.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(rs.length-1),y=v=>H-B-(H-B-T)*v/max;
    let h=`<svg id="parents-progres-graphe" class="maison-progres-graphe" viewBox="0 0 ${W} ${H}" role="group" aria-label="Mots lus correctement par minute, dans l’ordre des lectures"><defs><linearGradient id="parents-progres-degrade" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--green)" stop-opacity=".015"/></linearGradient></defs>`;
    for(let i=0;i<=4;i++){const v=i*pas;h+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="progression-grille"/><text x="${L-10}" y="${y(v)+5}" text-anchor="end">${v}</text>`;}
    if(Number.isFinite(objectif))h+=`<line x1="${L}" x2="${W-R}" y1="${y(objectif)}" y2="${y(objectif)}" class="progression-ligne-objectif"/>`;

    if(rs.length>1)h+=`<polygon points="${x(0)},${H-B} ${points} ${x(rs.length-1)},${H-B}" fill="url(#parents-progres-degrade)"/><polyline points="${points}" class="progression-trace"/>`;
    const nombreLabels=Math.min(rs.length,petit?4:6),labels=new Set(Array.from({length:nombreLabels},(_,i)=>Math.round(i*(rs.length-1)/(nombreLabels-1||1))));
    rs.forEach((r,i)=>{h+=`<g class="progression-point" role="button" tabindex="0" data-parent-point="${esc(r.id)}" data-type-lecture="${r.typeLecture||"lecture"}" aria-label="${esc(`${libelleLecture(r)} · ${date(r.date)} · ${titre(r)} · ${r.mclm} mots corrects par minute. Consulter cette lecture.`)}"><circle cx="${x(i)}" cy="${y(r.mclm)}" r="20" fill="transparent"/>${r.typeLecture==="defi"?`<path class="maison-lecture-point-defi" d="M ${x(i)} ${y(r.mclm)-8} l 8 8 -8 8 -8 -8 Z"/>`:`<circle class="progression-point-visible" cx="${x(i)}" cy="${y(r.mclm)}" r="${i===rs.length-1?6:4.5}"/>`}</g>`;if(labels.has(i))h+=`<text x="${x(i)}" y="${H-14}" text-anchor="${i===0&&rs.length>1?"start":i===rs.length-1&&rs.length>1?"end":"middle"}">${esc(date(r.date,true))}</text>`;});
    return h+"</svg>";
  }
  function rend(){
    if(!actif||!vue||!donnees)return;
    cadre();const cible=vue.querySelector("#parents-progres-contenu"),lieu=origine==="maison"?"À la maison":"En classe";
    const rs=donnees.lectures.filter(r=>r.origine===origine&&(!texte||r.ep===texte)).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date)||String(a.id).localeCompare(String(b.id)));

      <div class="progression-stats"><div><span>Dernière lecture</span><strong data-parent-stat="dernier">${score(dernier)}</strong><small>mots/min</small></div><div><span>Meilleur résultat</span><strong data-parent-stat="meilleur">${score(meilleur)}</strong><small>mots/min</small></div><div><span>Depuis la première</span><strong data-parent-stat="evolution" class="${evolution>0?"progression-hausse":""}">${evolution===null?"—":(evolution>0?"+":"")+evolution}</strong><small>mots/min</small></div><div><span>Lectures</span><strong data-parent-stat="lectures">${rs.length}</strong><small>${lieu.toLocaleLowerCase("fr")}</small></div></div>

    cible.querySelectorAll("[data-parent-point]").forEach(p=>{p.onclick=()=>ouvre(p.dataset.parentPoint);p.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();ouvre(p.dataset.parentPoint);}};});
  }

    ferme();if(Banc.ROLE!=="parents")return;
    vue=view;actif=true;tokenVue=token();origine="maison";texte="";prenom=String(options.prenom||"");charge();
  }
  window.addEventListener("hashchange",()=>{if(actif&&tokenVue!==token())ferme();});
  return {ouvre,ferme};
})();

      try{
        if(retour.erreur)throw new Error(retour.erreur);
        const user=await requete("/auth/v1/user",{},retour.access_token);
        await autoriseSession({...retour,user},version);
      }catch(e){if(version===generation){infos.message=e.message||"La connexion n'a pas abouti. Demande un nouveau lien par e-mail.";signale();}}
    }else{
      const version=generation;
      try{const d=JSON.parse(await Plateforme.Stock.get(AUTH)||"null");if(version===generation&&d?.access_token&&d?.refresh_token&&d?.user?.id)session=d;}catch(e){}
    }
    Banc.Donnees.surChange(quoi=>{if(quoi==="classe"||quoi==="resultats")programmePublication();});
    if(session)recoit();window.addEventListener("online",()=>recoit());document.addEventListener("visibilitychange",()=>{if(!document.hidden)recoit();});setInterval(()=>{if(!document.hidden)recoit();},30000);
    if(retour)window.EnvoiMaison?.ouvre?.();
  }
  function vue(box){
    if(Banc.ROLE==="parents")return ()=>{};
    const {esc,Donnees}=Banc;let vivant=true,afficheFormulaire=null;
    const besoinConnexion=()=>!connectee()||infos.reconnexionNecessaire;
    async function rend(){if(!vivant)return;
      afficheFormulaire=besoinConnexion();
      if(!configure()){box.innerHTML="<h2>Réception automatique privée</h2><p>La connexion au service privé est en préparation. Les liens personnels seront disponibles ici après son activation.</p>";return;}
      if(afficheFormulaire){
        box.innerHTML=`<h2>Connecter l'espace de l'enseignante</h2><p>Une seule connexion pour recevoir les résultats de tous tes élèves. Les bilans sont privés : seul ton compte autorisé peut les recevoir.</p><label class="label" for="cloud-email">Adresse e-mail</label><input id="cloud-email" type="email" autocomplete="email" style="width:100%"><div class="row start" style="margin-top:12px"><button class="btn primary" id="cloud-code">Recevoir un lien de connexion</button></div><p>Dans le navigateur, ouvre le lien du mail. Dans l’application iPhone : dans le mail reçu, fais un appui long sur le lien de connexion, choisis « Copier le lien », puis colle-le ici. Ne l’ouvre pas avant de le coller : il ne sert qu’une fois.</p><div id="cloud-verification"><label class="label" for="cloud-otp">Lien de connexion reçu par e-mail (ou code)</label><input id="cloud-otp" type="text" autocapitalize="off" spellcheck="false" autocomplete="off" aria-describedby="cloud-aide-lien" style="width:100%"><p class="muted" id="cloud-aide-lien">Les liens et QR codes des cartes sont réservés aux familles.</p><button class="btn primary" id="cloud-connexion" style="margin-top:10px">Se connecter</button></div><p id="cloud-info" role="status">${esc(infos.message)}</p>`;
        const info=box.querySelector("#cloud-info"),email=box.querySelector("#cloud-email"),code=box.querySelector("#cloud-code");
        email.value=session?.user.email||"";
        code.onclick=async()=>{code.disabled=true;try{await demandeCode(email.value.trim());info.textContent="Le lien de connexion a été demandé. Consulte ta messagerie, puis ouvre le lien ou copie-le dans le champ ci-dessus.";}catch(e){info.textContent=e.message;}finally{code.disabled=false;}};
        box.querySelector("#cloud-connexion").onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await connecteCode(email.value.trim(),box.querySelector("#cloud-otp").value.trim());await rend();}catch(e){info.textContent=e.message;b.disabled=false;}};return;
      }
      box.innerHTML=`<h2>Réception automatique privée</h2><p>Connectée : ${esc(session.user.email)}. Chaque lien autorise une famille à envoyer des bilans pour un seul enfant.</p><div class="row start"><button class="btn" id="cloud-actualise">Actualiser les bilans</button><button class="btn" id="cloud-deconnexion">Déconnecter ce compte</button></div><p id="cloud-reception" role="status">${esc([infos.message,messageProgres].filter(Boolean).join(" "))}</p><label class="label" for="cloud-eleve">Créer un lien personnel</label><select class="sel" id="cloud-eleve"><option value="">Choisir l'élève…</option>${Donnees.eleves().map(e=>`<option value="${esc(e.id)}">${esc(e.nom)}</option>`).join("")}</select><button class="btn primary" id="cloud-cree">Créer le lien parents</button><p id="cloud-info" role="status"></p><div id="cloud-lien" hidden><input id="cloud-url" readonly aria-label="Lien privé de la famille" style="width:100%"><div class="row start"><button class="btn primary" id="cloud-partage">Partager à cette famille</button><button class="btn" id="cloud-copie">Copier le lien privé</button></div><p class="muted">Transmets ce lien uniquement à la famille concernée. Garde-en une copie dans ton message : le service ne conserve pas le secret du lien.</p></div><h3>Liens créés</h3><div id="cloud-acces"></div>`;
      box.querySelector("#cloud-actualise").onclick=()=>recoit();box.querySelector("#cloud-deconnexion").onclick=async()=>{try{await deconnecte();}catch(e){const p=box.querySelector("#cloud-info");if(p&&!connectee())p.textContent=e.message;}};
      const info=box.querySelector("#cloud-info"),champ=box.querySelector("#cloud-url"),cible=box.querySelector("#cloud-acces");
      async function liste(){try{const rows=await invitations();if(!cible.isConnected)return;cible.innerHTML=rows.length?rows.map(a=>`<div class="row" style="margin-top:8px"><span>${esc(Donnees.nom(a.child_ref))} · ${esc(new Date(a.created_at).toLocaleDateString("fr-FR"))} · ${a.revoked?"désactivé":"actif"}</span>${a.revoked?"":`<button class="btn danger" data-revoque="${esc(a.id)}">Désactiver ce lien</button>`}</div>`).join(""):"<p>Aucun lien personnel créé.</p>";cible.querySelectorAll("[data-revoque]").forEach(b=>b.onclick=async()=>{if(!b.dataset.confirme){b.dataset.confirme="1";b.textContent="Confirmer ?";return;}b.disabled=true;try{await revoque(b.dataset.revoque);await liste();}catch(e){info.textContent=e.message;b.disabled=false;}});}catch(e){info.textContent=e.message;}}
      box.querySelector("#cloud-cree").onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{const d=await creeLien(box.querySelector("#cloud-eleve").value);champ.value=d.url;box.querySelector("#cloud-lien").hidden=false;info.textContent="Lien privé créé pour cet élève. Les parents peuvent imprimer le texte et envoyer leurs bilans directement dans Fluence.";await liste();}catch(e){info.textContent=e.message;}finally{b.disabled=false;}};
      box.querySelector("#cloud-copie").onclick=async()=>{try{await navigator.clipboard.writeText(champ.value);info.textContent="Lien privé copié.";}catch(e){champ.focus();champ.select();info.textContent="Copie le lien sélectionné.";}};
      box.querySelector("#cloud-partage").onclick=async()=>{try{const d={title:"Fluence à la maison",text:"Voici votre lien personnel pour imprimer les textes et transmettre les bilans de lecture à l'enseignante.",url:champ.value};if(Plateforme.partage)await Plateforme.partage.share(d);else if(navigator.share)await navigator.share(d);else box.querySelector("#cloud-copie").click();}catch(e){info.textContent=e?.name==="AbortError"?"Partage annulé.":"Le partage n'a pas abouti. Tu peux copier le lien.";}};
      liste();
    }
    const retire=surChange(()=>{if(besoinConnexion()!==afficheFormulaire){rend();return;}const p=box.querySelector(afficheFormulaire?"#cloud-info":"#cloud-reception");if(p)p.textContent=[infos.message,messageProgres].filter(Boolean).join(" ");});rend();return ()=>{vivant=false;retire();};
  }
  function surChange(f){ecoutes.add(f);return ()=>ecoutes.delete(f);}
  return {init,configure,parentActif,progressionParents,synchronise,etat,envoie,surChange,demandeCode,connecteCode,deconnecte,connectee,statutReception,creeLien,invitations,revoque,recoit,vue};
})();
window.MaisonCloud=MaisonCloud;

</script>
<script>Banc.demarre();</script>

</body>
