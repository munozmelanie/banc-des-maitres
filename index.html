/* Mise en page : un écran par moment de la séance, piloté au TBI. Le vert est celui de l'encre des mots cachés sous le banc. */
:root{
  --bg:#F2F4EF;         /* cour d'école */
  --paper:#FFFFFF;
  --ink:#1D2530;
  --ink-soft:#5C6672;
  --line:#DCE2D8;
  --wood:#9C6B3C;       /* le banc */
  --wood-soft:#F3E8DC;
  --green:#1D7F48;      /* l'encre verte */
  --green-ink:#FFFFFF;
  --green-soft:#E2F1E7;
  --marker:#FFE14D;     /* surligneur */
  --marker-ink:#1D2530;
  --err:#C93C3C;
  --err-soft:#FBE3E3;
  --echo:#E6EFF9;
  --shadow:0 10px 30px rgb(0 0 0 / .18);
  --font-display:"Grandstander","Comic Neue","Trebuchet MS",system-ui,sans-serif;
  --font-read:"Andika","Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A17; --paper:#1C2420; --ink:#ECF1EC; --ink-soft:#A6B2AA; --line:#2E3A33;
  --wood:#D19A64; --wood-soft:#2C241C; --green:#4CC17E; --green-ink:#0E1712; --green-soft:#1E3327;
  --marker:#FFD93B; --marker-ink:#141A17; --err:#F07272; --err-soft:#3A2224; --echo:#22313F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --paper:#1C2420; --ink:#ECF1EC; --ink-soft:#A6B2AA; --line:#2E3A33;
  --wood:#D19A64; --wood-soft:#2C241C; --green:#4CC17E; --green-ink:#0E1712; --green-soft:#1E3327;
  --marker:#FFD93B; --marker-ink:#141A17; --err:#F07272; --err-soft:#3A2224; --echo:#22313F; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-read);font-size:17px;line-height:1.45;overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.wrap{width:100%;max-width:1720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:800;font-size:clamp(20px,2.2vw,30px);margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.brand img{width:44px;height:44px;flex:none;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;min-width:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.big{min-height:60px;font-size:20px;padding:0 26px}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn[disabled]{opacity:.35;cursor:default}
.btn svg{width:22px;height:22px;flex:none}
.btn[aria-current="page"]{border-color:var(--green);background:var(--green-soft)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
main{flex:1;min-height:0;overflow:auto}
.view{padding-block:8px 24px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
.lead{color:var(--ink-soft);max-width:70ch;margin:6px 0 0}
.muted{color:var(--ink-soft)}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.row.start{justify-content:flex-start}
.banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:var(--paper);border:2px solid var(--wood);color:var(--ink);border-radius:14px;padding:10px 16px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* Accueil */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:20px}
.ep{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:0 0 16px;cursor:pointer;min-width:0;overflow:hidden;color:var(--ink)}
.ep:hover{border-color:var(--green)}
.ep.ep-texte{padding-top:18px}
.collection{margin-top:36px}
.ep>*:not(.vign){margin-inline:18px}
.ep .vign{aspect-ratio:16/9;width:100%;object-fit:cover;background:repeating-linear-gradient(135deg,var(--wood-soft) 0 14px,var(--paper) 14px 28px);margin-bottom:6px}
.ep .num{font-family:var(--font-display);font-weight:800;color:var(--green);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.ep b{font-family:var(--font-display);font-size:22px;line-height:1.15}
.ep .meta{font-size:14px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--wood-soft);color:var(--wood)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.note{display:inline-block;margin-top:18px;background:var(--paper);border:1.5px dashed var(--green);color:var(--green);border-radius:6px;padding:10px 14px;transform:rotate(-1deg);font-weight:700}

/* Séance */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft)}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--bg);font-size:13px;color:var(--ink)}
.step[aria-current="step"]{border-color:var(--green);color:var(--ink);background:var(--green-soft)}
.step[aria-current="step"] i{background:var(--green);color:var(--green-ink)}
.ephead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:4px 10px}
.ephead h2{font-size:clamp(20px,2vw,28px);margin-right:auto}
.panel{height:calc(100vh - 210px);height:calc(100dvh - 210px);min-height:420px;display:flex;flex-direction:column}

/* Mots flash */
.flash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--paper);border-radius:22px;border:1.5px solid var(--line);padding:20px}
.flash .word{font-family:var(--font-read);font-weight:700;font-size:clamp(48px,9vw,150px);line-height:1.3;padding-bottom:.15em;text-align:center;overflow-wrap:anywhere}
.flash .count{color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
.allwords{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1300px}
.allwords span{font-size:clamp(20px,2vw,32px);padding:6px 14px;background:var(--wood-soft);border-radius:10px}

/* Lecteur */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:minmax(0,1fr);gap:clamp(14px,2vw,32px);align-items:center}
.stage.texte-seul{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.stage.texte-seul .text{max-width:65ch;margin-inline:auto}
.pic{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.pic img,.ph{max-height:100%;max-width:100%;aspect-ratio:1;object-fit:contain;border-radius:18px;background:var(--paper);box-shadow:0 0 0 1.5px var(--line)}
.ph{width:100%;display:grid;place-items:center;text-align:center;padding:24px;background:repeating-linear-gradient(135deg,var(--wood-soft) 0 18px,var(--paper) 18px 36px);color:var(--wood);font-weight:700}
.ph b{display:block;font-family:var(--font-display);font-size:38px}
.textbox{height:100%;min-height:0;display:flex;align-items:center;background:var(--paper);border-radius:22px;box-shadow:0 0 0 1.5px var(--line);padding:clamp(16px,2.6vw,44px)}
.text{width:100%;max-height:100%;font-size:var(--fs,40px);line-height:1.55;overflow-wrap:break-word}
.text.title{font-family:var(--font-display);font-weight:800;text-align:center;line-height:1.2}
.w{border-radius:.18em;padding:0 .06em;margin:0 -.06em;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.on{background:var(--marker);color:var(--marker-ink)}
.s.echo{background:var(--echo);box-shadow:0 .08em 0 0 var(--green);border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-top:10px}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.seg button{min-height:48px;padding:0 14px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--ink-soft)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.pageno{font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.noaudio{background:var(--wood-soft);color:var(--wood);border-radius:12px;padding:8px 14px;font-weight:700}
.echobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--paper);border:2px solid var(--green);border-radius:16px;padding:10px 12px 10px 18px;box-shadow:var(--shadow);z-index:5;max-width:calc(100% - 32px)}
.echobar strong{font-family:var(--font-display);font-size:24px;color:var(--green)}

/* Défi */
.defi{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
.defi .textbox{align-items:flex-start}
.defi .text{font-size:var(--fs,34px);line-height:1.6}
.w.err{background:var(--err-soft);color:var(--err);text-decoration:line-through;text-decoration-thickness:2px}
.w.after{opacity:.28}
.w.last{box-shadow:0 0 0 3px var(--green);border-radius:.2em}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;overflow:auto}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.timer{height:16px;border-radius:999px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.timer i{display:block;height:100%;width:0;background:var(--green);transition:width .25s linear}
.big-num{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-family:var(--font-display);font-weight:800;font-size:22px;padding:6px 12px;border-radius:8px;transform:rotate(-4deg);margin-top:8px}
.hint{font-weight:700;color:var(--green)}
.side #res{order:-1}
dl.res{display:grid;grid-template-columns:auto auto;gap:4px 12px;margin:10px 0 0;font-variant-numeric:tabular-nums}
dl.res dt{color:var(--ink-soft)}
dl.res dd{margin:0;font-weight:700;text-align:right}
.hard{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hard span{background:var(--err-soft);color:var(--err);border-radius:8px;padding:2px 8px;font-weight:700}

/* Progrès et élèves */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-top:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-soft);font-size:15px;font-family:var(--font-read)}
.chart .val{fill:var(--ink);font-weight:700}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right}
.tablewrap{overflow-x:auto}
.form{display:grid;grid-template-columns:auto minmax(0,1fr) 170px;gap:10px 14px;align-items:center;max-width:720px;margin-top:16px}
.form input{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:0 12px;width:100%}
.saved{color:var(--green);font-weight:700}
details.all{margin-top:18px}
details.all summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}

/* Fenêtre « Relier le téléphone » */
.voile{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;z-index:30;padding:16px}
.fenetre{background:var(--paper);border-radius:24px;padding:clamp(18px,3vw,36px);max-width:min(980px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:center}
.fenetre .qr{width:clamp(220px,26vw,340px);aspect-ratio:1;background:#fff;border-radius:16px;padding:8px;display:grid;place-items:center}
.fenetre .qr svg{width:100%;height:100%}
.fenetre .qr svg rect[fill="#ffffff"],.fenetre .qr svg path{shape-rendering:crispEdges}
.code{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,4vw,54px);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--green)}
.fenetre ol{margin:10px 0 0;padding-left:1.3em;font-size:19px}
.fenetre li+li{margin-top:6px}
.etat-lien{display:flex;align-items:center;gap:10px;font-weight:700;margin-top:14px}
/* Le clavier iPhone réduit la zone visible sans toujours réduire la page. */
.voile.maison-voile{inset:auto;top:var(--maison-vtop,0px);left:var(--maison-vleft,0px);width:var(--maison-vwidth,100%);height:var(--maison-vheight,100%);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#maison-dialogue{display:block;width:min(960px,100%);max-width:100%;max-height:100%;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;text-align:left;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
#maison-dialogue .card,#maison-dialogue .row{min-width:0;max-width:100%}
#maison-dialogue input,#maison-dialogue select,#maison-dialogue textarea{font-family:inherit;font-size:max(16px,1em);color:inherit;min-width:0;max-width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px}
#maison-dialogue textarea{resize:vertical;overflow-wrap:anywhere;line-height:1.45}
#maison-dialogue .btn{max-width:100%;white-space:normal;line-height:1.3;padding-block:10px}
#maison-dialogue .maison-dialogue-entete{padding-bottom:8px}

/* ---------- Téléphone : la télécommande de la maîtresse ---------- */
.tel{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.tel header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tel header .brand{font-size:20px}
.tel header .brand img{width:36px;height:36px;border-radius:8px}
.pastille{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-soft);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.tel main{padding:4px 16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tel h2{font-size:24px;margin:6px 0 4px}
.tel h3{font-size:19px}
.tel .card+.card{margin-top:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--green)}
.liste{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.liste .btn{justify-content:flex-start;text-align:left;min-height:56px;width:100%}
.liste .btn small{display:block;font-weight:400;color:var(--ink-soft);font-size:13px}
.etapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.etapes .btn{min-height:52px;font-size:15px;padding:0 8px}
.tele{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tele .btn{flex:1 1 auto;min-height:56px}
.tele .btn.primary{flex-basis:100%;min-height:68px;font-size:20px}
.tele .seg{flex-basis:100%;display:flex}
.tele .seg button{flex:1;min-height:52px}
.champ{display:flex;gap:10px;margin-top:10px}
.champ input{flex:1;min-width:0;min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:0 14px;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
select.sel{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:0 12px;font-weight:700}
.tdefi .text{font-size:21px;line-height:1.75;margin-top:6px}
.tdefi .w{padding:.05em .1em;margin:0}
.chrono{display:flex;align-items:baseline;gap:12px}
.chrono .big-num{font-size:52px}
.collant{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 30%);padding:18px 0 4px;margin-top:8px;display:flex;gap:10px}
.collant .btn{flex:1}
.astuce{border-color:var(--wood);background:var(--wood-soft)}
.tel .form{grid-template-columns:auto minmax(0,1fr);margin-top:10px}
.tel .form .goal{grid-column:2}
.tel .grid2{grid-template-columns:minmax(0,1fr)}
.tel .chart svg{max-width:520px}

@media (max-width:900px), (orientation:portrait){
  body{overflow:auto}
  .panel{height:auto;min-height:0}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .pic img,.ph{max-height:46vh}
  .defi{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:auto minmax(0,1fr)}
  .form .goal{grid-column:2}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fenetre{grid-template-columns:minmax(0,1fr);justify-items:center}
}
html[data-role="tel"] body{overflow:hidden}
/* Le lecteur familial garde une taille de texte confortable et défile naturellement. */
html[data-role="parents"] body{overflow:auto}
html[data-role="parents"] .app{height:auto;min-height:100%;max-width:1100px;margin:auto}
html[data-role="parents"] main{overflow:visible}
html[data-role="parents"] [data-enseignant]{display:none!important}
html[data-role="parents"] .bar .brand{flex-basis:100%;font-size:24px}
html[data-role="parents"] .panel{height:auto;min-height:0;gap:12px}
html[data-role="parents"] .stage{display:flex;flex-direction:column;gap:16px}
html[data-role="parents"] .pic img{max-height:32vh}
html[data-role="parents"] .textbox{height:auto;padding:20px}
html[data-role="parents"] .text{font-size:clamp(21px,3vw,26px);line-height:1.7;max-height:none}
html[data-role="parents"] .text.title{font-size:32px;line-height:1.3}
html[data-role="parents"] .controls{background:var(--bg);padding-block:12px;justify-content:center}
html[data-role="parents"] .echobar{position:sticky;left:auto;transform:none;bottom:12px;max-width:100%;margin:0 auto}
html[data-role="parents"] .flash{min-height:260px}
html[data-role="parents"] .flash .word{font-size:clamp(36px,8vw,76px)}
html[data-role="parents"] .eps{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
html[data-role="parents"] .step{padding:0 10px}
.maison-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
.maison-choix-categorie{min-height:64px;padding:12px;font-size:clamp(16px,2vw,21px);line-height:1.3}
.maison-choix-categorie[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.maison-attente{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.maison-liste-textes{display:grid;gap:10px}
.maison-choix-texte{width:100%;min-height:60px;justify-content:flex-start;text-align:left;padding:14px 18px;font-size:18px;line-height:1.35}
.maison-serie{color:var(--ink-soft);margin:4px 0 20px}
.maison-choix-texte strong,.maison-choix-texte small{display:block}
.maison-choix-texte small{font-size:14px;font-weight:400;margin-block:3px;color:var(--ink-soft)}
.maison-choix-texte.maison-verrouille{opacity:1;background:#f4f4f0;border-style:dashed;color:#586254;cursor:default}
.maison-verrouille svg{width:28px;height:28px;flex:none;margin-right:12px}
.maison-ecoute{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.maison-entete h1{font-size:clamp(24px,3vw,36px);line-height:1.2;flex:1 1 360px;margin:0}
.maison-bilan-precedent{margin:0 0 16px}
.maison-bilan-precedent summary{cursor:pointer;padding:12px 0;font-weight:700}
.maison-stockage{margin:0 16px 12px;padding:10px 14px;border-radius:12px;background:var(--err-soft);color:var(--err)}
.maison-identite{display:grid;gap:8px;max-width:520px}
.maison-identite input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.maison-pilotage{position:sticky;top:0;z-index:4;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-block:12px}
.maison-pilotage .chrono{justify-content:space-between;flex-wrap:wrap}
.maison-pilotage p{margin:8px 0}
.maison-pilotage.termine{position:static}
.maison-texte{padding:18px;background:var(--paper);border-radius:18px;border:1.5px solid var(--line)}
.maison-texte .w{touch-action:manipulation}
.maison-historique{margin-top:28px;scroll-margin-top:16px}
.maison-historique .card{margin-top:12px}
.maison-bilan h3{font-size:22px;margin-block:6px}
.maison-bilan .row{margin-top:14px}
.maison-bilan [data-envoi-info]{margin-bottom:0;overflow-wrap:anywhere}
.maison-erreur{color:var(--err);font-weight:700}
/* Les ruptures viennent du document d'origine, indépendamment des pages du lecteur. */
.texte-espace{display:block;height:.55em}
.textbox.lecture-structuree{align-items:flex-start;overflow:auto}
.textbox.lecture-structuree .text{max-height:none}
.defi-compte-rebours{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:18px 12px;border-radius:16px;background:var(--green-soft);border:2px solid var(--green);color:var(--ink);text-align:center;font-weight:700}
.defi-compte-rebours[hidden]{display:none}
.defi-compte-nombre{display:block;font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:clamp(76px,16vw,116px);line-height:1.05;color:var(--green)}
.defi-consigne.etat-dernier{display:block;border:3px solid #ac7200;border-radius:14px;background:#fff0ad;color:#362800;padding:16px;font-size:clamp(22px,4vw,28px);line-height:1.3;font-weight:800;text-align:center;box-shadow:0 4px 16px #3628001a}
.defi-consigne.etat-dernier::before{content:"☝";display:block;font-size:30px;line-height:1.1;margin-bottom:6px}
.maison-pilotage.etat-dernier{border-color:#ac7200;background:#fff9e2}
.maison-pilotage.etat-dernier .chrono{display:none}
.maison-pilotage.etat-compte-rebours .chrono{display:none}
.maison-pilotage.etat-dernier .defi-consigne{margin:0}
#maison-impression{display:none}
@media print{
  @page{size:A4;margin:18mm}
  html[data-impression="texte"],html[data-impression="texte"] body{height:auto!important;margin:0!important;padding:0!important;overflow:visible!important;background:#fff!important;color:#111!important}
  html[data-impression="texte"] body > :not(#maison-impression){display:none!important}
  html[data-impression="texte"] #maison-impression{display:block!important;font-family:var(--font-read);font-size:13.5pt;line-height:1.65;color:#111;background:#fff}
  #maison-impression h1{font-family:var(--font-read);font-size:21pt;line-height:1.3;margin:0 0 9mm;break-after:avoid;text-align:center}
  #maison-impression p{margin:0 0 4mm;orphans:3;widows:3}
  #maison-impression .impression-mot{padding:0;margin:0;color:inherit;background:none}
  #maison-impression footer{font-size:8.5pt;line-height:1.4;margin-top:8mm;break-inside:avoid;color:#444}
  html[data-impression="texte"] #maison-impression.texte-long{font-size:12.5pt;line-height:1.55}
  #maison-impression.texte-long h1{margin-bottom:7mm}
  #maison-impression.texte-long p{margin-bottom:3mm}
  html[data-impression="texte"] #maison-impression{line-height:1.45}
  html[data-impression="texte"] #maison-impression.texte-vers{font-size:11.5pt;line-height:1.4}
  #maison-impression.texte-vers .impression-corps{columns:2;column-gap:9mm}
  #maison-impression.texte-vers p{margin-bottom:4mm;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- Progrès : choix du lieu, de l'élève et du texte ---------- */
.progression{max-width:1320px;margin:10px auto 28px;min-width:0}
.progression .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.progression-entete{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}
.progression-entete h1{font-size:clamp(30px,3vw,44px);line-height:1.12}
.progression-entete p{margin:6px 0 0}
.progression-surtitre{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--green);margin:0 0 7px!important;text-transform:uppercase}
.progression #acces-parents{font-size:14px;max-width:100%;white-space:normal;line-height:1.3;text-align:center;padding-block:10px}
#progression-acces{max-width:480px;min-width:0}
.progression-reception-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.progression #progression-actualiser{font-size:14px;min-height:44px}
.progression #progression-actualiser[aria-disabled=true]{opacity:.65;cursor:wait}
.progression #progression-reception{font-size:12px;line-height:1.5;color:var(--ink-soft);margin-top:8px;overflow-wrap:anywhere}
.progression #progression-reception.progression-reception-erreur{color:#8d3b15}
.progression-origines{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:var(--line);border-radius:17px;max-width:450px;margin:0 0 24px}
.progression-origines button{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--ink-soft);font-size:17px;font-weight:700;cursor:pointer}
.progression-origines button[aria-pressed=true]{color:var(--green-ink);background:var(--green);box-shadow:0 3px 9px rgb(0 0 0 / .08)}
.progression-origines svg{display:block;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.progression-contenu{display:grid;grid-template-columns:minmax(240px,290px) minmax(0,1fr);gap:24px;align-items:start}
.progression-liste,.progression-carte{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 3px 14px rgb(0 0 0 / .025)}
.progression-liste{padding:18px 10px 10px}
.progression-liste-titre{display:flex;align-items:center;justify-content:space-between;padding:0 10px 14px}
.progression-liste-titre h2{font-size:21px!important;margin:0!important}
.progression-liste-titre>span{display:grid;place-items:center;min-width:30px;height:27px;border-radius:9px;background:var(--green-soft);color:var(--green);font-size:13px;font-weight:700}

      clearTimeout(minuteur); minuteur=null;
      try { ws = new WebSocket(url); } catch(e){ return plusTard(); }
      const moi = ws;
      /* certains relais gardent les événements « éphémères » et les renvoient à l'abonnement :
         tout ce qui arrive avant la fin des événements stockés (EOSE) est ignoré */
      ws.onopen = ()=>{ if (moi!==ws) return; pret=true; attente=1500; direct=false; clearTimeout(tDirect); tDirect = setTimeout(()=>{ direct=true; }, 3000);
        ws.send(JSON.stringify(["REQ", sub, {kinds:[KIND], "#t":[k.tag]}])); change(); pompeFile(); };
      ws.onmessage = e=>{ let m; try { m = JSON.parse(e.data); } catch(x){ return; }
        if (m[0]==="EOSE" && m[1]===sub){ direct = true; clearTimeout(tDirect); return; }
        if (m[0]==="EVENT" && m[1]===sub && m[2] && typeof m[2].content==="string"){
          if (!direct || (m[2].created_at||0) < Date.now()/1000-900) return;
          recoit(m[2].content); }
        else if (m[0]==="OK" && m[2]===false) console.warn("relais", url, m[3]); };
      ws.onclose = ()=>{ if (moi!==ws) return; pret=false; change(); if (!fini) plusTard(); };
      ws.onerror = ()=>{ try { moi.close(); } catch(e){} };
    }
    function plusTard(){ if (minuteur||fini) return; minuteur = setTimeout(()=>{ minuteur=null; if (!fini) ouvre(); }, attente); attente = Math.min(30000, attente*2); }
    ouvre();
    return { nom:url.replace(/^wss:\/\//,""), pret:()=>pret,
      envoie(txts, cle){ if (cle){ const i = file.findIndex(x=>x.cle===cle); if (i>=0) file.splice(i,1); } file.push({cle, txts:txts.slice(), t:Date.now()}); if (file.length>60) file.shift(); pompeFile(); },
      reveille(){ if (!pret && !fini){ attente=1500; if (ws){ try { ws.onclose=null; ws.close(); } catch(e){} } ws=null; ouvre(); } },
      ferme(){ fini=true; clearTimeout(minuteur); try { ws && ws.close(); } catch(e){} } };
  }
  function transportMqtt(url, k, recoit, change){
    if (!window.mqtt) return null;
    const sujet = "banc-des-maitres/"+k.tag;
    let c = null;
    try { c = mqtt.connect(url, {clientId:"bm_"+rid(8), clean:true, keepalive:30, reconnectPeriod:6000, connectTimeout:10000, protocolVersion:4}); } catch(e){ return null; }
    c.on("connect", ()=>{ c.subscribe(sujet, {qos:0}); change(); });
    c.on("close", change); c.on("offline", change); c.on("error", ()=>{});
    c.on("message", (t,p)=>{ if (t===sujet) recoit(td.decode(p)); });
    return { nom:url.replace(/^wss:\/\//,"").replace(/\/mqtt$/,""), pret:()=>c.connected,
      envoie(txts){ if (c.connected) txts.forEach(txt=>c.publish(sujet, txt, {qos:0})); },
      reveille(){ if (!c.connected){ try { c.reconnect(); } catch(e){} } },
      ferme(){ try { c.end(true); } catch(e){} } };
  }
  function transportLocal(k, recoit, change){ // même navigateur (tests, deux onglets)
    const bc = new BroadcastChannel("banc-des-maitres-"+k.tag); bc.onmessage = e=>recoit(e.data); setTimeout(change,0);
    return { nom:"local", pret:()=>true, envoie(txts){ txts.forEach(txt=>bc.postMessage(txt)); }, reveille(){}, ferme(){ bc.close(); } };
  }
  function creeRelais(k){
    const vus = new Map(), morceaux = new Map(), ecoute = new Set(), surChange = new Set();
    const change = () => surChange.forEach(f=>{ try { f(); } catch(e){} });
    async function recoit(txt){
      let u; try { u = await dechiffre(k, txt); } catch(e){ return; } // pas pour nous, ou abîmé
      if (u[0]===2){ // message coupé en morceaux : [2][id 8 o][rang][nombre][données]
        const id = "m"+hex(u.subarray(1,9)), i = u[9], n = u[10]; if (vus.has(id)) return;
        let p = morceaux.get(id); if (!p){ p = {n, m:[], t:Date.now()}; morceaux.set(id,p); }
        if (!p.m[i]) p.m[i] = u.slice(11);
        for (let j=0;j<p.n;j++) if (!p.m[j]) return;
        morceaux.delete(id); vus.set(id, Date.now()); u = cat(...p.m);
      }
      let m; try { m = JSON.parse(td.decode(u[0]===1 ? await gzip(u.subarray(1), false) : u.subarray(1))); } catch(e){ return; }
      if (!m || typeof m!=="object" || !m.id || vus.has(m.id)) return;
      vus.set(m.id, Date.now());
      if (Math.abs(Date.now()-(m.t||0)) > 15*60*1000) return; // vieux message rejoué
      ecoute.forEach(f=>{ try { f(m); } catch(e){ console.error(e); } });
    }
    const trs = listeRelais().map(s=>{
      if (s.startsWith("local:")) return transportLocal(k, recoit, change);
      if (s.startsWith("nostr:")) return window.NostrLite ? transportNostr(s.slice(6), k, recoit, change) : null;
      if (s.startsWith("mqtt:")) return transportMqtt(s.slice(5), k, recoit, change);
      return null;
    }).filter(Boolean);
    setInterval(()=>{ const lim = Date.now()-20*60*1000; vus.forEach((t,id)=>{ if (t<lim) vus.delete(id); }); morceaux.forEach((p,id)=>{ if (p.t<lim) morceaux.delete(id); }); }, 60000);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") trs.forEach(t=>t.reveille()); });
    addEventListener("online", ()=>trs.forEach(t=>t.reveille()));
    let file = Promise.resolve();
    function publie(m, cle){
      m.id = m.id || rid(9); m.t = Date.now(); vus.set(m.id, Date.now());
      const tache = file.then(async ()=>{
        const brut = te.encode(JSON.stringify(m)); let corps = brut, drapeau = 0;
        if (brut.length > 900 && window.CompressionStream){ try { corps = await gzip(brut, true); drapeau = 1; } catch(e){ corps = brut; drapeau = 0; } }
        const plein = cat(Uint8Array.of(drapeau), corps), MAX = 20000, trames = [];
        if (plein.length <= MAX) trames.push(plein);
        else { const id = crypto.getRandomValues(new Uint8Array(8)), n = Math.ceil(plein.length/MAX); if (n>250) throw new Error("trop gros");
          for (let i=0;i<n;i++) trames.push(cat(Uint8Array.of(2), id, Uint8Array.of(i,n), plein.subarray(i*MAX,(i+1)*MAX))); }
        const txts = []; for (const tr of trames) txts.push(await chiffre(k, tr));
        trs.forEach(t=>t.envoie(txts, cle));
      });
      file = tache.catch(()=>{});
      return tache;
    }
    return { publie, ecoute:f=>{ ecoute.add(f); return ()=>ecoute.delete(f); }, surChange:f=>{ surChange.add(f); return ()=>surChange.delete(f); },
      etat:()=>trs.map(t=>({nom:t.nom, ok:t.pret()})), connecte:()=>trs.some(t=>t.pret()) };
  }

  /* ---------- sauvegarde (même interface que la capacité db) ---------- */
  const DB = (() => {
    const cache = new Map(), ecoutes = new Map();
    let ecrituresResultats = Promise.resolve();
    const cle = p => "banc-db:"+p;
    async function lit(p){ if (cache.has(p)) return cache.get(p); let v = null; try { v = JSON.parse(await Stock.get(cle(p))||"null"); } catch(e){} cache.set(p, v); return v; }
    const snap = (p, v, distant) => ({ id:p.split("/").pop(), path:p, exists:!!(v && v.data!=null), distant:!!distant,
      data:()=> v && v.data!=null ? JSON.parse(JSON.stringify(v.data)) : undefined });
    function notifie(p, v, distant){ (ecoutes.get(p)||new Set()).forEach(f=>{ try { f(snap(p,v,distant)); } catch(e){ console.error(e); } }); }
    function ecrit(p, data, distant){
      const estResultats = p==="banc/resultats";
      if(estResultats) data=JSON.parse(JSON.stringify(data));
      const execute = async()=>{
        // Preferences est asynchrone : fusionner seulement au moment d'écrire,
        // après toute écriture locale ou distante déjà engagée.
        const contenu = estResultats ? fusionResultats((await lit(p))?.data, data) : data;
        const v = {data:contenu, rev:Date.now()}; await Stock.set(cle(p), JSON.stringify(v)); cache.set(p, v);
        if (!distant) Sync.change(p); notifie(p, v, distant); return v;
      };
      if(!estResultats)return execute();
      const tache=ecrituresResultats.then(execute);
      ecrituresResultats=tache.catch(()=>{}); // Un échec n'empêche pas la sauvegarde suivante.
      return tache;
    }
    function doc(p){ return { id:p.split("/").pop(), path:p,
      async get(){ return snap(p, await lit(p)); },
      async set(data){ await ecrit(p, JSON.parse(JSON.stringify(data)), false); },
      async update(patch){ const v = await lit(p); await ecrit(p, Object.assign({}, v && v.data, JSON.parse(JSON.stringify(patch))), false); },
      async delete(){ cache.set(p, null); await Stock.del(cle(p)); notifie(p, null, false); },
      onSnapshot(f){ if (!ecoutes.has(p)) ecoutes.set(p, new Set()); ecoutes.get(p).add(f); lit(p).then(v=>f(snap(p,v,false))); return ()=>ecoutes.get(p).delete(f); } }; }
    return { doc, _lit:lit, _ecritDistant:(p,d)=>ecrit(p,d,true) };
  })();

  /* ---------- les deux appareils gardent chacun la classe et tous les résultats ----------
     banc/classe et banc/reglages : la version la plus récente gagne (champ maj) ;
     banc/resultats : les deux listes sont réunies (chaque essai a son identifiant ; un essai supprimé le reste partout). */
  // Égalité pédagogique stricte : les informations de transport restent locales.
  const memeBilanMaison = (a,b) => {
    if(!a||!b||a.suppr||b.suppr||a.origine!=="maison"||b.origine!=="maison"||typeof a.sourceId!=="string"||!a.sourceId||a.sourceId!==b.sourceId||typeof a.eleve!=="string"||!a.eleve||a.eleve!==b.eleve||a.ep!==b.ep||!Number.isFinite(Date.parse(a.date))||Date.parse(a.date)!==Date.parse(b.date))return false;
    if(!["mclm","lus","erreurs","secondes","dernier"].every(k=>typeof a[k]==="number"&&Number.isFinite(a[k])&&a[k]===b[k]))return false;
    return Array.isArray(a.fautes)&&Array.isArray(b.fautes)&&a.fautes.length===a.erreurs&&b.fautes.length===b.erreurs&&[a.fautes,b.fautes].every(f=>new Set(f).size===f.length&&f.every(i=>Number.isSafeInteger(i)&&i>=0&&i<=a.dernier))&&JSON.stringify(a.fautes.slice().sort((x,y)=>x-y))===JSON.stringify(b.fautes.slice().sort((x,y)=>x-y));
  };
  const fusionResultats = (a, b) => {
    const m = new Map();
    for (const l of [a && a.liste, b && b.liste]) for (const r of (Array.isArray(l) ? l : [])){
      if (!r || typeof r.id!=="string") continue;
      const x = m.get(r.id);
      if (!x || (r.suppr && !x.suppr)) m.set(r.id, r);
      else if(!Object.hasOwn(x,"typeLecture")&&["entrainement","defi"].includes(r.typeLecture)&&memeBilanMaison(x,r))m.set(r.id,{...x,typeLecture:r.typeLecture});
    }
    return {liste:[...m.values()].sort((x,y)=>String(x.date||"").localeCompare(String(y.date||"")) || x.id.localeCompare(y.id))};
  };
  const sigResultats = d => JSON.stringify((d && Array.isArray(d.liste) ? d.liste : []).map(r=>[r.id,!!r.suppr,r.suppr?null:["entrainement","defi"].includes(r.typeLecture)?r.typeLecture:null]).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))));
  const plusRecent = (a, b) => !b ? a : (!a || (b.maj||0) > (a.maj||0)) ? b : a;
  const sigMaj = d => d ? String(d.maj||0)+":"+JSON.stringify(d).length : "";
  const Sync = (() => {
    const REGLES = {
      "banc/classe":   {fusion:plusRecent, sig:sigMaj, delai:500},
      "banc/reglages": {fusion:plusRecent, sig:sigMaj, delai:900},
      "banc/resultats":{fusion:fusionResultats, sig:sigResultats, delai:300}
    };
    const DOCS = Object.keys(REGLES);
    let room = null; const minuteurs = {};
    const pairsLa = () => room && room._pairs().length>0;
    async function envoieDoc(p){ const v = await DB._lit(p); if (!v || v.data==null || !room) return; room._publie({k:"db", path:p, data:v.data}, "db:"+p).catch(e=>console.warn("copie", e)); }
    function change(p, delai){
      if (!REGLES[p] || !pairsLa()) return;
      clearTimeout(minuteurs[p]); minuteurs[p] = setTimeout(()=>envoieDoc(p), delai!=null ? delai : REGLES[p].delai);
    }
    async function recoit(m){
      const R = m.k==="db" && REGLES[m.path];
      if (!R || !m.data || typeof m.data!=="object") return;
      const v = await DB._lit(m.path), ici = v && v.data, f = R.fusion(ici, m.data);
      if (R.sig(f)!==R.sig(ici)) await DB._ecritDistant(m.path, f); // ce qui manquait ici
      if (R.sig(f)!==R.sig(m.data)) change(m.path, 400);          // ce qui manquait là-bas
    }
    return { branche(r){ room = r; }, change, recoit, nouveauPair(){ DOCS.forEach((p,i)=>change(p, 300+i*250)); } };
  })();

  /* ---------- liaison (même interface que la capacité room) ---------- */
  function creeRoom(rel){
    const moi = {peer:rid(12), presence:{}};
    const pairs = new Map(), ecPairs = new Set(), ecSujets = new Map(), ecCo = new Set();
    const vue = p => ({peer:p.peer, isMe:p.peer===moi.peer, presence:JSON.parse(JSON.stringify(p.presence||{}))});
    const tous = () => [vue(moi)].concat([...pairs.values()].map(vue));
    const signale = (j,l) => { const ch = {peers:tous(), joined:j.map(vue), left:l.map(vue)}; ecPairs.forEach(f=>{ try { f(ch); } catch(e){ console.error(e); } }); };
    let rep = null;
    const coucou = () => rel.publie({k:"hb", f:moi.peer, p:moi.presence}, "hb").catch(()=>{});
    const ETATS = {ecran:1, defi:1}; // sujets qui décrivent un état complet : le dernier suffit
    rel.ecoute(m=>{
      if (m.f===moi.peer) return;
      if (m.k==="hb"){ const neuf = !pairs.has(m.f), p = pairs.get(m.f) || {peer:m.f}, avant = JSON.stringify(p.presence||null);
        p.presence = m.p && typeof m.p==="object" ? m.p : {}; p.vu = Date.now(); pairs.set(m.f, p);
        if (neuf){ signale([p],[]); clearTimeout(rep); rep = setTimeout(coucou, 150+Math.random()*350); Sync.nouveauPair(); }
        else if (avant!==JSON.stringify(p.presence)) signale([],[]);
        return; }
      if (m.k==="bye"){ const p = pairs.get(m.f); if (p){ pairs.delete(m.f); signale([],[p]); } return; }
      if (m.k==="ev" && typeof m.topic==="string"){ const s = ecSujets.get(m.topic); if (s){ const msg = {topic:m.topic, data:m.data, peer:m.f, isMe:false}; s.forEach(f=>{ try { f(msg); } catch(e){ console.error(e); } }); } return; }
      Sync.recoit(m);
    });
    setInterval(coucou, 8000);
    setInterval(()=>{ const lim = Date.now()-26000, partis = []; pairs.forEach((p,id)=>{ if (p.vu<lim){ pairs.delete(id); partis.push(p); } }); if (partis.length) signale([],partis); }, 2000);
    let co = false; rel.surChange(()=>{ const c = rel.connecte(); if (c && !co) coucou(); if (c!==co){ co = c; ecCo.forEach(f=>{ try { f(c); } catch(e){} }); } });
    addEventListener("pagehide", ()=>{ rel.publie({k:"bye", f:moi.peer}).catch(()=>{}); });
    coucou();
    const r = {
      presence(patch){ for (const k in patch||{}){ if (patch[k]===null) delete moi.presence[k]; else moi.presence[k] = patch[k]; } coucou(); return Promise.resolve(); },
      onPeers(f){ ecPairs.add(f); setTimeout(()=>{ if (ecPairs.has(f)){ const t = tous(); f({peers:t, joined:t, left:[]}); } }, 0); return ()=>ecPairs.delete(f); },
      emit(topic, data){ return rel.publie({k:"ev", f:moi.peer, topic, data}, ETATS[topic] ? "ev:"+topic : null).catch(()=>{}); },
      on(topic, f){ if (!ecSujets.has(topic)) ecSujets.set(topic, new Set()); ecSujets.get(topic).add(f); return ()=>ecSujets.get(topic).delete(f); },
      connected:()=>rel.connecte(),
      onConnection(f){ ecCo.add(f); return ()=>ecCo.delete(f); },
      leave(){ rel.publie({k:"bye", f:moi.peer}).catch(()=>{}); },
      _pairs:()=>[...pairs.values()].map(vue), _publie:(m,cle)=>rel.publie(Object.assign(m, {f:moi.peer}), cle), _etat:()=>rel.etat()
    };
    Sync.branche(r);
    return r;
  }

  /* ---------- code de liaison : créé par l'écran ou le téléphone, partagé par QR code, lien ou saisie ---------- */
  const Liaison = (() => {
    let code = null, promesse = null, assurance = null, room = null;
    const CLE = P+"liaison";
    async function litCode(){
      const m = /[#&?]lien=([0-9A-Za-z-]+)/.exec(location.href);
      if (m){ const c = normalise(m[1]); if (c){ await Stock.set(CLE, c); return c; } }
      return normalise(await Stock.get(CLE));
    }
    function assure(){
      if (role()==="parents") return Promise.resolve(null);
      if (assurance) return assurance;
      assurance = (async()=>{
        await ouvre();
        if (!code){ code = nouveauCode(); await Stock.set(CLE, code); }
        return code;
      })().finally(()=>{ assurance = null; });
      return assurance;
    }
    function ouvre(){
      if (role()==="parents") return Promise.resolve(null);
      if (promesse) return promesse;
      promesse = (async()=>{
        code = await litCode();
        if (!code && role()==="ecran"){ code = nouveauCode(); await Stock.set(CLE, code); }
        if (!code) return null;
        room = creeRoom(creeRelais(await cles(code)));
        return room;
      })().catch(e=>{ console.error("liaison", e); return null; });
      return promesse;
    }
    /* adresse du site pour le téléphone : celle de la page, ou celle du site publié (page ouverte depuis un fichier, appli) */
    const WEB = () => (/^https?:$/.test(location.protocol) && !NATIF) ? location.href.replace(/[?#].*$/,"") : (window.BANC_WEB || "");
    return { ouvre, assure, code:()=>code, normalise, WEB,
      lienTel:c=>WEB() ? WEB() + "#lien=" + (c||code) + "&tel" : "",
      lienEcran:c=>WEB() && (c||code) ? WEB() + "#lien=" + (c||code) + "&ecran" : "",
      async fixe(c){ if (role()==="parents") return false; c = normalise(c); if (!c) return false; await Stock.set(CLE, c); return true; },
      async oublie(){ if (role()==="parents") return; await Stock.del(CLE); },
      async nouveau(){ if (role()==="parents") return null; const c = nouveauCode(); await Stock.set(CLE, c); return c; },
      etat:()=>room ? room._etat() : [], pairs:()=>room ? room._pairs() : [],
      qr(texte, taille){ if (!window.qrcode || !texte) return ""; const q = qrcode(0,"M"); q.addData(texte); q.make();
        return q.createSvgTag({cellSize:Math.max(2, Math.floor((taille||240)/(q.getModuleCount()+8))), margin:4, scalable:true}); } };
  })();

  /* ---------- téléchargements : fichier dans le navigateur, feuille de partage dans l'appli ---------- */
  const Telechargements = {
    async save({filename, data}){
      const nom = String(filename||"banc-des-maitres.json").replace(/[\\/:*?"<>|]/g,"-");
      if (NATIF){ const FS = plug("Filesystem"), Partage = plug("Share");
        if (FS && Partage){ const texte = typeof data==="string" ? data : JSON.stringify(data);
          const r = await FS.writeFile({path:nom, data:texte, directory:"CACHE", encoding:"utf8"});
          try { await Partage.share({title:nom, files:[r.uri]}); } catch(e){ throw {code:"cancelled", message:String(e && e.message || e)}; }
          return; } }
      const blob = data instanceof Blob ? data : new Blob([typeof data==="string" ? data : JSON.stringify(data)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
    }
  };

  /* ---------- garder l'écran du téléphone allumé pendant le défi ---------- */
  let verrou = null;
  async function eveille(on){
    const KA = plug("KeepAwake");
    if (KA){ try { on ? await KA.keepAwake() : await KA.allowSleep(); } catch(e){} return; }
    try { if (on && navigator.wakeLock && !verrou) verrou = await navigator.wakeLock.request("screen"); else if (!on && verrou){ await verrou.release(); verrou = null; } } catch(e){}
  }

  window.claude = { use: async name => {
    if (role()==="parents" && (name==="db" || name==="room")) return null;
    if (name==="db") return DB;
    if (name==="room") return await Liaison.ouvre();
    if (name==="downloads") return Telechargements;
    return null;
  } };
  return { NATIF, Liaison, Stock, partage:plug("Share"), eveille, rid, normalise, role, changeRole, fusionResultats, memeBilanMaison, lsG, lsS };
})();
window.Plateforme = Plateforme;

</script>
<script>
/* ---------- Le banc des maîtres : ce qui sert à l'écran de la classe comme au téléphone ---------- */
"use strict";
const Banc = (() => {
  const DATA = window.__BANC, EPS = DATA.episodes;
  const ROLE = Plateforme.role();
  document.documentElement.dataset.role = ROLE;
  const $ = s => document.querySelector(s);
  const el = (tag, attrs={}, html="") => { const e = document.createElement(tag); for (const k in attrs){ if (k==="class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html) e.innerHTML = html; return e; };
  const esc = s => String(s==null ? "" : s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const estMot = t => /[0-9A-Za-zÀ-ÖØ-öø-ÿœŒ]/.test(t);
  const nu = t => String(t).replace(/^[«“(\s ]+|[\s »”).,;:!?…]+$/g, ""); // le mot sans la ponctuation autour
  const ep = id => EPS.find(e=>e.id===id) || null;
  const estDisponible = E => !!E && E.fluence!==false;
  const textesDisponibles = () => EPS.filter(estDisponible);
  const textesFamille = () => textesDisponibles().filter(E=>E.collection==="tamallette-p2" || (E.collection==="feuilleton" && Number.isFinite(Date.parse(E.ouvertureFamille))));
  const ouvertFamille = (E,maintenant=Date.now()) => estDisponible(E) && (E.collection==="tamallette-p2" || (E.collection==="feuilleton" && Number.isFinite(Date.parse(E.ouvertureFamille)) && (window.Parents?.apercuEpisodes?.()===true || maintenant>=Date.parse(E.ouvertureFamille))));
  const dateFamille = E => new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",weekday:"long",day:"numeric",month:"long"}).format(new Date(E.ouvertureFamille))+" · 16 h 30";
  const estTamallette = E => E && E.collection==="tamallette-p2";
  const libelleEpisode = E => `${estTamallette(E) ? "Tamallette · texte" : "Épisode"} ${E.num}`;
  const codeEpisode = id => String(id).replace(/^E/, "É");
  const etapesEpisode = E => ["Les mots", E.audio ? "J'écoute" : "Je lis", "L'écho", "Le chœur", "Le défi", "Les progrès"];
  /* les mots du défi : toutes les pages du texte (sans le titre), dans l'ordre */
  function motsDefi(E){
    const t = [], ruptures = new Map((E.layout?.breaks||[]).map(b=>[b.at,b.kind]));
    E.pages.slice(1).forEach((p,pi)=>p.toks.forEach((x,i)=>{
      const rupture = E.layout ? (t.length ? ruptures.get(t.length)||null : null) : (i===0 && pi>0 ? "paragraph" : null);
      t.push({t:x[0], w:estMot(x[0]), pi, brk:!!rupture, rupture});
    }));
    return t;
  }
  function ajouteRupture(box, mot){
    const genre = mot.rupture || (mot.brk ? "paragraph" : null);
    if (!genre) return;
    box.appendChild(el("br",{class:"texte-retour", "data-rupture":genre}));
    if (genre==="paragraph" || genre==="stanza") box.appendChild(el("span",{class:"texte-espace", "aria-hidden":"true"}));
  }
  const DUREE = () => /essai-rapide/.test(location.hash) ? 8 : 60;

  /* Import de classe : lecture locale uniquement ; aucun identifiant du fichier n'est repris. */
  const ImportClasse = (() => {
    const MAX_OCTETS = 1024 * 1024, MAX_ELEVES = 100;
    const cleNom = s => String(s).normalize("NFC").trim().replace(/\s+/g," ").toLocaleLowerCase("fr");
    const cleColonne = s => cleNom(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[ _-]/g,"");
    const inactif = v => v === false || v === 0 || /^(false|non|no|0|inactif)$/i.test(String(v).trim());
    function nomValide(v){
      if (typeof v !== "string") throw new Error("Chaque élève doit avoir un prénom ou un nom sous forme de texte.");
      const s = v.normalize("NFC").trim().replace(/\s+/g," ");
      if (s.length > 80) throw new Error("Un nom dépasse 80 caractères. Raccourcis-le avant d'importer.");
      if (s && (!/\p{L}/u.test(s) || /[<>\uFFFD\x00-\x1f\x7f]/.test(s))) throw new Error("Un nom contient des caractères non valides. Vérifie le fichier.");
      return s;
    }
    function objectifValide(v){
      if (v == null || String(v).trim() === "") return "";
      const s = String(v).trim();
      if (!/^\d{1,3}$/.test(s)) throw new Error("L'objectif doit être un nombre entier entre 0 et 999, ou rester vide.");
      return String(+s);
    }
    function objet(x){
      if (typeof x === "string") return {nom:nomValide(x), objectif:""};
      if (!x || typeof x !== "object" || Array.isArray(x)) throw new Error("Le fichier doit contenir une liste de noms ou d'élèves.");
      const d = {}; Object.keys(x).forEach(k => { d[cleColonne(k)] = x[k]; });
      if (inactif(d.actif) || inactif(d.active)) return null;
      if (!["prenom","nom","name"].some(k => Object.prototype.hasOwnProperty.call(d,k))) throw new Error("Une ligne n'a pas de colonne Prénom ou Nom.");
      const prenom = d.prenom == null ? "" : nomValide(d.prenom);
      const nom = d.nom == null ? "" : nomValide(d.nom);
      const complet = prenom ? nomValide(prenom + (nom ? " " + nom : "")) : (nom || (d.name == null ? "" : nomValide(d.name)));
      return {nom:complet, objectif:complet ? objectifValide(d.objectif ?? d.goal) : ""};
    }
    function nettoie(lignes){
      const eleves = [], vus = new Set(); let ignores = 0, doublons = 0;
      for (const ligne of lignes){
        const e = objet(ligne);
        if (!e || !e.nom){ ignores++; continue; }
        const cle = cleNom(e.nom); if (vus.has(cle)){ doublons++; continue; }
        vus.add(cle); eleves.push(e);
        if (eleves.length > MAX_ELEVES) throw new Error("La liste dépasse 100 élèves. Réduis-la avant d'importer.");
      }
      if (!eleves.length) throw new Error("Aucun élève actif avec un nom n'a été trouvé dans ce fichier.");
      return {eleves, ignores, doublons};
    }
    function csv(texte, sep){
      const lignes = []; let ligne = [], champ = "", cite = false, ferme = false;
      const ajoute = () => { ligne.push(champ); champ = ""; ferme = false; };
      for (let i=0; i<texte.length; i++){
        const c = texte[i];
        if (cite){ if (c==='"'){ if (texte[i+1]==='"'){ champ+='"'; i++; } else { cite=false; ferme=true; } } else champ+=c; continue; }
        if (c===sep){ ajoute(); continue; }
        if (c==='\r' || c==='\n'){ if (c==='\r' && texte[i+1]==='\n') i++; ajoute(); lignes.push(ligne); ligne=[]; continue; }
        if (ferme){ if (/\s/.test(c)) continue; throw new Error("CSV non valide : un caractère suit un guillemet fermé."); }
        if (c==='"'){ if (champ.trim()) throw new Error("CSV non valide : vérifie les guillemets."); champ=""; cite=true; }
        else champ+=c;
      }
      if (cite) throw new Error("CSV non valide : un guillemet n'est pas fermé.");
      ajoute(); lignes.push(ligne);
      return lignes.filter(l=>l.some(c=>c.trim()));
    }
    function lit(texte, fichier=""){
      if (typeof texte !== "string" || new TextEncoder().encode(texte).length > MAX_OCTETS) throw new Error("Le fichier doit faire au maximum 1 Mo.");
      const ext = fichier.split(".").pop().toLowerCase();
      if (fichier && !["csv","tsv","txt","json"].includes(ext)) throw new Error("Choisis un fichier CSV, TXT, TSV ou JSON. Exporte d'abord les fichiers Excel ou PDF dans l'un de ces formats.");
      const t = texte.replace(/^\uFEFF/,"").replace(/^(?:[ \t]*(?:\r\n|\n|\r))+/g,""), contenu = t.trim();
      if (!contenu) throw new Error("Le fichier est vide.");
      if (ext === "json" || /^[\[{]/.test(contenu)){
        let d; try { d=JSON.parse(contenu); } catch(e){ throw new Error("JSON non valide : vérifie le fichier ou refais son export."); }
        const lignes = Array.isArray(d) ? d : (d && d.classe && d.classe.eleves) || (d && d.eleves);
        if (!Array.isArray(lignes)) throw new Error("Ce JSON ne contient pas de liste d'élèves (tableau de noms ou classe.eleves).");
        return nettoie(lignes);
      }
      if (/^</.test(contenu) || /\uFFFD/.test(t)) throw new Error("Ce fichier n'est pas une liste de classe lisible. Exporte-le en texte UTF-8.");
      let cite = false; const counts = {";":0, ",":0, "\t":0};
      for (let i=0;i<t.length;i++){ const c=t[i]; if(c==='"'){ if(cite && t[i+1]==='"') i++; else cite=!cite; } else if(!cite){ if(c==='\r'||c==='\n') break; if(c in counts) counts[c]++; } }
      const sep = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
      const lignes = csv(t, counts[sep] ? sep : "\u0000");
      const entetes = lignes[0].map(cleColonne), connus = ["prenom","nom","name"];
      const aEntete = entetes.some(c=>connus.includes(c));
      if (!aEntete){
        if (lignes.some(l=>l.length!==1)) throw new Error("Pour plusieurs colonnes, ajoute une première ligne Prénom, Nom et éventuellement Objectif.");
        return nettoie(lignes.map(l=>l[0]));
      }
      if (new Set(entetes).size!==entetes.length) throw new Error("Deux colonnes ont le même titre. Vérifie la première ligne.");
      return nettoie(lignes.slice(1).map(l=>{
        if(l.length!==entetes.length) throw new Error("Une ligne n'a pas le même nombre de colonnes que l'en-tête.");
        const d={};entetes.forEach((k,i)=>{d[k]=l[i];});return d;
      }));
    }
    function estDefaut(liste){ return liste.length>0 && liste.every((e,i)=>e.id==="e"+(i+1) && e.nom==="Élève "+(i+1) && String(e.objectif ?? "").trim()===""); }
    function fusion(existants, importes, options={}){
      const candidats = nettoie(importes).eleves, remplaceDefaut = !!options.remplaceDefaut && estDefaut(existants);
      const eleves = (remplaceDefaut ? [] : existants).map(e=>({...e}));
      const noms = new Set(eleves.map(e=>cleNom(e.nom))), ids = new Set(eleves.map(e=>e.id)); let ajoutes=0, reconnus=0;
      candidats.forEach(e=>{
        if(noms.has(cleNom(e.nom))){ reconnus++; return; }
        let id; do { id="e"+Plateforme.rid(8); } while(ids.has(id));
        eleves.push({id,nom:e.nom,objectif:e.objectif}); ids.add(id); noms.add(cleNom(e.nom)); ajoutes++;
      });
      if(eleves.length>MAX_ELEVES) throw new Error("L'import porterait la classe à plus de 100 élèves. Aucun changement n'a été enregistré.");
      return {eleves,ajoutes,reconnus,remplaceDefaut};
    }
    return {lit, fusion, nettoie, estDefaut, valideNom:nomValide, valideObjectif:objectifValide, MAX_OCTETS, MAX_ELEVES};
  })();

  /* ---------- Données : la classe, les résultats, les réglages ----------
     Enregistrées sur l'appareil (et recopiées sur l'autre appareil à chaque liaison).
     banc/classe    : {eleves:[{id, nom, objectif}], maj}
     banc/resultats : {liste:[{id, eleve, ep, date, mclm, lus, erreurs, secondes, dernier, fautes:[n° des mots]} ou {id, suppr:true}]}
     banc/reglages  : {vitesse, maj} */
  const Donnees = (() => {
    let db = null, classe = null, resultats = {liste:[]}, reglages = {vitesse:0.8, maj:0};
    const ecoutes = new Set();
    const signale = quoi => ecoutes.forEach(f=>{ try { f(quoi); } catch(e){ console.error(e); } });
    const DEFAUT = () => ({eleves:[1,2,3,4].map(i=>({id:"e"+i, nom:"Élève "+i, objectif:""})), maj:0});
    const docs = {};
    /* sauvegarde de la première version (fichier « HORS LIGNE » de septembre, même navigateur) */
    function depuisV1(d){
      if (!d || !Array.isArray(d.students)) return null;
      const cl = {eleves:d.students.map((s,i)=>({id:String(s.id||("e"+(i+1))), nom:String(s.name||("Élève "+(i+1))), objectif:String(s.goal??"").replace(/[^0-9]/g,"")})), maj:Date.now()};
      const li = (Array.isArray(d.results) ? d.results : []).map(r=>({id:"v1-"+String(r.sid)+"-"+String(r.ep)+"-"+String(r.date), eleve:String(r.sid), ep:String(r.ep), date:String(r.date),
        mclm:+r.mclm||0, lus:+r.read||0, erreurs:+r.err||0, secondes:+r.secs||0}));
      return {classe:cl, resultats:{liste:li}, vitesse:+d.speed||0.8};
    }
    async function init(){
      if (ROLE==="parents") throw new Error("Les données de classe ne sont pas accessibles dans l'espace parents.");
      db = await window.claude.use("db");
      docs.c = db.doc("banc/classe"); docs.r = db.doc("banc/resultats"); docs.g = db.doc("banc/reglages");
      let c = (await docs.c.get()).data(), r = (await docs.r.get()).data(), g = (await docs.g.get()).data();
      if (!c){ let v1 = null; try { v1 = depuisV1(JSON.parse(localStorage.getItem("banc-des-maitres:v1")||"null")); } catch(e){}
        if (v1 && v1.resultats.liste.length){ c = v1.classe; r = Plateforme.fusionResultats(r, v1.resultats); await docs.c.set(c); await docs.r.set(r); } }
      classe = c && Array.isArray(c.eleves) ? c : DEFAUT();
      resultats = r && Array.isArray(r.liste) ? r : {liste:[]};
      reglages = g && g.vitesse ? g : {vitesse:0.8, maj:0};
      docs.c.onSnapshot(s=>{ if (s.distant && s.exists){ classe = s.data(); signale("classe"); } });
      docs.r.onSnapshot(s=>{ if (s.distant && s.exists){ resultats = s.data(); signale("resultats"); } });
      docs.g.onSnapshot(s=>{ if (s.distant && s.exists){ reglages = s.data(); signale("reglages"); } });
    }
    const valides = () => resultats.liste.filter(r=>!r.suppr && r.eleve && r.ep);
    const vivants = () => valides().filter(r=>r.origine!=="maison");
    /* Un champ vide signifie automatique. Calcul pur : aucune écriture de classe,
       aucun effet sur les essais ; les mêmes résultats donnent le même objectif. */
    function objectifInfo(id, manuel){
      const eleve = classe?.eleves.find(e=>e.id===id);
      if (!eleve) return {valeur:null, mode:"attente", reference:null};
      const saisie = String(manuel===undefined ? (eleve.objectif ?? "") : manuel).trim();
      if (saisie!=="" && /^\d+$/.test(saisie) && Number.isSafeInteger(+saisie)) return {valeur:+saisie, mode:"manuel", reference:null};
      const meilleur = valides().filter(r=>r.eleve===id && typeof r.id==="string" && ep(r.ep) && (r.origine==null || r.origine==="classe" || r.origine==="maison") && Number.isSafeInteger(r.mclm) && r.mclm>=0 && r.mclm<=60000 && typeof r.date==="string" && Number.isFinite(Date.parse(r.date)))
        .sort((a,b)=>b.mclm-a.mclm || Date.parse(a.date)-Date.parse(b.date) || (a.id<b.id ? -1 : a.id>b.id ? 1 : 0))[0];
      if (!meilleur) return {valeur:null, mode:"attente", reference:null};
      return {valeur:meilleur.mclm+Math.max(5,Math.ceil(meilleur.mclm/10)), mode:"automatique", reference:{id:meilleur.id,date:meilleur.date,mclm:meilleur.mclm}};
    }
    /* les essais, avec leur numéro (par élève et par épisode, dans l'ordre des dates) */
    function essais(){
      const n = {};
      return vivants().slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(r=>{ const k = r.eleve+"|"+r.ep; n[k] = (n[k]||0)+1; return Object.assign({essai:n[k]}, r); });
    }
    /* La vue Progrès ne mélange jamais les lectures de classe et de maison.
       L'objectif, lui, reste celui de l'élève, toutes origines confondues. */
    function progres(eleve, origine="classe", texte=""){
      const temps = r => Number.isFinite(Date.parse(r.date)) ? Date.parse(r.date) : Number.MAX_SAFE_INTEGER;
      const n = Object.create(null);
      const lectures = valides().filter(r=>r.eleve===eleve && (origine==="maison" ? r.origine==="maison" : r.origine==null || r.origine==="classe"))
        .sort((a,b)=>temps(a)-temps(b) || (String(a.id)<String(b.id)?-1:String(a.id)>String(b.id)?1:0))
        .map(r=>({...r,essai:n[r.ep]=(n[r.ep]||0)+1})).filter(r=>!texte || r.ep===texte);
      const mesures = lectures.filter(r=>Number.isSafeInteger(r.mclm) && r.mclm>=0 && Number.isFinite(Date.parse(r.date)));
      return {lectures,mesures,nombre:lectures.length,dernier:mesures.length?mesures[mesures.length-1].mclm:null,
        meilleur:mesures.length?Math.max(...mesures.map(r=>r.mclm)):null,
        evolution:mesures.length>1?mesures[mesures.length-1].mclm-mesures[0].mclm:null,objectif:objectifInfo(eleve)};
    }
    async function ecritResultats(suivants=resultats){
      try {
        await docs.r.set(suivants);
        const confirmes=(await docs.r.get()).data();
        resultats=Plateforme.fusionResultats(resultats,confirmes);
        return true;
      } catch(e){ return false; }
    }
    return { init, progres, objectifInfo, objectif:id=>objectifInfo(id).valeur,
      eleves:()=>classe.eleves, eleve:id=>classe.eleves.find(e=>e.id===id)||null,
      nom:id=>{ const e = classe.eleves.find(x=>x.id===id); return e ? e.nom : "Élève"; },
      async enregistreEleves(liste){ const nouvelle = {eleves:liste, maj:Date.now()}; try { await docs.c.set(nouvelle); classe = nouvelle; signale("classe"); return true; } catch(e){ return false; } },
      sansEssais:()=>resultats.liste.length===0,
      essais, essaisDe:(eleve, epId)=>essais().filter(r=>r.eleve===eleve && (!epId || r.ep===epId)),
      essaisMaison:()=>valides().filter(r=>r.origine==="maison").sort((a,b)=>String(a.date).localeCompare(String(b.date))),
      contientResultat:id=>resultats.liste.some(r=>r.id===id),
      contientBilan:(sourceId,eleve)=>resultats.liste.some(r=>r.origine==="maison"&&r.sourceId===sourceId&&(eleve===undefined||r.eleve===eleve)),
      record:(eleve, sauf)=>{ const l = vivants().filter(r=>r.eleve===eleve && r.id!==sauf); return l.length ? Math.max(...l.map(r=>r.mclm)) : null; },
      async ajoute(r){ if (resultats.liste.some(x=>x.id===r.id)) return true; const ok = await ecritResultats({liste:resultats.liste.concat([r])}); if(ok) signale("resultats"); return ok; },
      async completeTypeLecture(r){
        if(!["entrainement","defi"].includes(r?.typeLecture))return false;
        const ancien=resultats.liste.find(x=>x.id===r.id||x.origine==="maison"&&x.sourceId===r.sourceId&&x.eleve===r.eleve);
        if(!ancien||Object.hasOwn(ancien,"typeLecture")||!Plateforme.memeBilanMaison(ancien,r))return false;
        const ok=await ecritResultats({liste:resultats.liste.map(x=>x===ancien?{...x,typeLecture:r.typeLecture}:x)});
        if(!ok)throw new Error("Le type d’un bilan reçu ne peut pas encore être enregistré sur cet appareil. Réessaie la réception.");
        signale("resultats");return true;
      },
      async supprime(id){ const avant=resultats.liste.find(x=>x.id===id), marque={id,suppr:true,date:new Date().toISOString()}; if(avant?.origine==="maison")Object.assign(marque,{origine:"maison",sourceId:avant.sourceId,eleve:avant.eleve}); const ok = await ecritResultats({liste:resultats.liste.filter(x=>x.id!==id).concat([marque])}); if(ok) signale("resultats"); return ok; },
      vitesse:()=>reglages.vitesse||0.8,
      async fixeVitesse(v){ reglages = {vitesse:v, maj:Date.now()}; try { await docs.g.set(reglages); } catch(e){} },
      surChange(f){ ecoutes.add(f); return ()=>ecoutes.delete(f); },
      sauvegarde:()=>({format:"banc-des-maitres/sauvegarde", version:2, date:new Date().toISOString(), classe, resultats, reglages}),
      /* importer une sauvegarde : la classe du fichier remplace celle-ci, les essais s'ajoutent à ceux qui sont déjà là */
      async importe(d){
        let cl = null, re = null, vi = null;
        if (d && d.format==="banc-des-maitres/sauvegarde"){ cl = d.classe; re = d.resultats; vi = d.reglages && d.reglages.vitesse; }
        else { const v1 = depuisV1(d); if (v1){ cl = v1.classe; re = v1.resultats; vi = v1.vitesse; } }
        if (!cl || !Array.isArray(cl.eleves) || !re || !Array.isArray(re.liste)) return false;
        classe = {eleves:cl.eleves, maj:Date.now()}; const suivants = Plateforme.fusionResultats(resultats, re);
        await docs.c.set(classe); if(!await ecritResultats(suivants)){signale("classe");return false;} if (vi) await this.fixeVitesse(vi);
        signale("classe"); signale("resultats"); return true;
      } };
  })();

  /* ---------- liaison avec l'autre appareil ---------- */
  const Lien = (() => {
    let room = null, autres = 0;
    const etats = new Set();
    const signale = () => etats.forEach(f=>{ try { f(autres>0); } catch(e){} });
    async function init(){
      if (ROLE==="parents") return null;
      room = await window.claude.use("room");
      if (!room) return null;
      room.presence({role:ROLE});
      room.onPeers(({peers})=>{ const n = peers.filter(p=>!p.isMe && p.presence && p.presence.role && p.presence.role!==ROLE).length; if (n!==autres){ autres = n; signale(); } });
      return room;
    }
    return { init, room:()=>room, relie:()=>autres>0,
      emit:(t,d)=>room ? room.emit(t,d) : Promise.resolve(), on:(t,f)=>room ? room.on(t,f) : ()=>{},
      surEtat(f){ etats.add(f); return ()=>etats.delete(f); } };
  })();

  /* ---------- résultat d'un défi ---------- */
  function calcule(E, eleve, elapsed, dernier, fautes){
    const toks = motsDefi(E);
    const lus = toks.slice(0, dernier+1).filter(x=>x.w).length;
    const err = [...fautes].filter(i=>i<=dernier && toks[i] && toks[i].w);
    const mclm = Math.round(Math.max(0, lus-err.length)*60/Math.max(elapsed,1));
    return {id:Plateforme.rid(8), eleve, ep:E.id, date:new Date().toISOString(), mclm, lus, erreurs:err.length, secondes:Math.round(elapsed), dernier, fautes:err.sort((a,b)=>a-b)};
  }
  /* ce qu'on affiche avec un résultat : record battu, essai précédent */
  function bilan(r){
    const avant = Donnees.essais().filter(x=>x.eleve===r.eleve && x.id!==r.id && x.date<=r.date);
    const record = avant.length ? Math.max(...avant.map(x=>x.mclm)) : null;
    const memes = avant.filter(x=>x.ep===r.ep);
    return {record, precedent:memes.length ? memes[memes.length-1].mclm : null, essai:memes.length+1, nouveau:record!==null && r.mclm>record, premier:record===null};
  }
  function motsDifficiles(r){
    const E = ep(r.ep); if (!E || !Array.isArray(r.fautes)) return [];
    const toks = motsDefi(E), vus = new Set(), res = [];
    r.fautes.forEach(i=>{ const m = toks[i] && nu(toks[i].t); if (m && !vus.has(m.toLowerCase())){ vus.add(m.toLowerCase()); res.push(m); } });
    return res;
  }
  const libelleLecture = r => r.typeLecture==="defi" ? "Défi du 4ᵉ soir" : r.typeLecture==="entrainement" ? "Entraînement" : "Lecture";
  const badgeLecture = r => `<span class="progression-type-lecture${r.typeLecture==="defi"?" progression-type-defi":""}">${libelleLecture(r)}</span>`;
  function carteResultat(r, b, nomEleve, ok){
    const cible = Donnees.objectifInfo(r.eleve), objectif = cible.valeur;
    const durs = motsDifficiles(r);
    return `<div class="label">${esc(nomEleve)} · essai ${b.essai}</div><div class="big-num">${r.mclm}</div><div class="muted">mots lus correctement par minute</div>
      ${b.nouveau?`<div class="stamp">Nouveau record !</div>`:(b.premier?`<div class="stamp">Premier essai !</div>`:"")}
      <dl class="res"><dt>Mots lus</dt><dd>${r.lus}</dd><dt>Erreurs</dt><dd>${r.erreurs}</dd><dt>Temps</dt><dd>${r.secondes} s</dd>${b.precedent!==null?`<dt>Essai précédent</dt><dd>${b.precedent}</dd>`:""}${b.record!==null?`<dt>Record avant</dt><dd>${b.record}</dd>`:""}${objectif!==null?`<dt>Objectif${cible.mode==="automatique"?" automatique":""}</dt><dd>${esc(objectif)}</dd>`:""}</dl>
      ${durs.length?`<div class="label" style="margin-top:10px">Mots à retravailler</div><div class="hard">${durs.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:""}

  }

  /* ---------- courbe des progrès ---------- */
  function courbe(points, objectif, titre){
    const W=520,H=230,L=40,R=16,T=26,B=34;
    const maxV = Math.max(60, objectif||0, ...points.map(p=>p.v))*1.15;
    const x = i => points.length<2 ? L+(W-L-R)/2 : L+i*(W-L-R)/(points.length-1);
    const y = v => T+(H-T-B)*(1-v/maxV);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titre)}">`;
    [0, Math.round(maxV/2/10)*10, Math.round(maxV*0.9/10)*10].forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; });
    if (Number.isFinite(objectif) && objectif>=0) s += `<line x1="${L}" x2="${W-R}" y1="${y(objectif)}" y2="${y(objectif)}" stroke="var(--wood)" stroke-width="2" stroke-dasharray="6 5"/><text x="${W-R}" y="${y(objectif)-6}" text-anchor="end" style="fill:var(--wood)">objectif ${objectif}</text>`;
    if (points.length){
      s += `<polyline fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round" points="${points.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
      const best = Math.max(...points.map(p=>p.v)), dense = points.length>9;
      points.forEach((p,i)=>{ s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.v===best?7:5}" fill="${p.v===best?"var(--green)":"var(--paper)"}" stroke="var(--green)" stroke-width="2.5"/>`+
        (!dense || p.v===best || i===points.length-1 ? `<text class="val" x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle">${p.v}</text>` : "")+
        (!dense || i%Math.ceil(points.length/8)===0 ? `<text x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(p.l)}</text>` : ""); });
    } else s += `<text x="${W/2}" y="${H/2}" text-anchor="middle">Pas encore de défi</text>`;
    return s+"</svg>";
  }

  /* ---------- vues partagées : progrès, élèves ---------- */
  const etatsProgres = new WeakMap();
  function actualiseReceptionProgres(box,etat){
    const info=box.querySelector("#progression-reception"),bouton=box.querySelector("#progression-actualiser"),connexion=box.querySelector("#acces-parents");
    if(!info||!bouton)return;
    const s=window.MaisonCloud?.statutReception?.()||{connectee:false};
    const enCours=!!s.enCours||!!etat.receptionEnCours;
    if(s.enCours||!s.connectee)etat.erreurReception="";
    if(connexion){connexion.textContent="Se connecter";connexion.hidden=!!s.connectee&&!s.reconnexionNecessaire;}
    bouton.hidden=!s.connectee;
    bouton.setAttribute("aria-disabled",String(enCours));bouton.textContent=enCours?"Actualisation…":"Actualiser";
    info.classList.toggle("progression-reception-erreur",!!(s.erreur||s.reconnexionNecessaire||etat.erreurReception));
    info.textContent=!s.connectee?"Connecte-toi pour recevoir les bilans maison.":enCours?"Réception des bilans maison…":s.reconnexionNecessaire?"Reconnecte-toi pour recevoir les bilans maison.":etat.erreurReception||s.message||(s.erreur?"Réception momentanément indisponible. Vérifie la connexion, puis réessaie.":s.derniereReception?"Les bilans maison ont été vérifiés.":"Les bilans maison n’ont pas encore été vérifiés.");
  }
  const dateProgres = (date, courte=false) => Number.isFinite(Date.parse(date)) ? new Date(date).toLocaleDateString("fr-FR",courte?{day:"numeric",month:"numeric"}:{day:"numeric",month:"long",year:"numeric"}) : "Date non précisée";
  const titreProgres = r => ep(r.ep)?.titre || r.ep;
  function grapheProgres(rs, objectif, petit){
    const W=petit?360:760,H=petit?250:285,L=42,R=24,T=24,B=42;
    const plafond=Math.max(20,Number.isFinite(objectif)?objectif:0,...rs.map(r=>r.mclm));
    const pas=Math.max(5,Math.ceil(plafond/4/5)*5),max=pas*4;
    const x=i=>rs.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(rs.length-1),y=v=>H-B-(H-B-T)*v/max;
    let h=`<svg id="progression-graphe" viewBox="0 0 ${W} ${H}" role="group" aria-label="Progression en mots lus correctement par minute, dans l’ordre des lectures"><defs><linearGradient id="progression-degrade" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--green)" stop-opacity=".015"/></linearGradient></defs>`;
    for(let i=0;i<=4;i++){const v=i*pas;h+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="progression-grille"/><text x="${L-10}" y="${y(v)+5}" text-anchor="end">${v}</text>`;}
    if(Number.isFinite(objectif))h+=`<line x1="${L}" x2="${W-R}" y1="${y(objectif)}" y2="${y(objectif)}" class="progression-ligne-objectif"/>`;
    if(rs.length){
      const points=rs.map((r,i)=>`${x(i)},${y(r.mclm)}`).join(" ");
      if(rs.length>1)h+=`<polygon points="${x(0)},${H-B} ${points} ${x(rs.length-1)},${H-B}" fill="url(#progression-degrade)"/><polyline points="${points}" class="progression-trace"/>`;
      const intervalles=Math.min(rs.length-1,petit?3:5),etiquettes=new Set(Array.from({length:intervalles+1},(_,i)=>intervalles?Math.round(i*(rs.length-1)/intervalles):0));
      rs.forEach((r,i)=>{
        const label=`${dateProgres(r.date)} · ${titreProgres(r)} · ${libelleLecture(r)} · ${r.mclm} MCLM`;
        h+=`<g class="progression-point" role="button" tabindex="0" data-progress-point="${esc(r.id)}" aria-label="${esc(label+". Consulter cette lecture.")}"><title>${esc(label)}</title><circle cx="${x(i)}" cy="${y(r.mclm)}" r="20" fill="transparent"/>${r.typeLecture==="defi"?`<path class="progression-point-visible progression-point-defi" d="M${x(i)},${y(r.mclm)-8}l8,8 -8,8 -8,-8Z"/>`:`<circle class="progression-point-visible" cx="${x(i)}" cy="${y(r.mclm)}" r="${i===rs.length-1?6:4.5}"/>`}</g>`;
        if(etiquettes.has(i))h+=`<text x="${x(i)}" y="${H-14}" text-anchor="${i===0&&rs.length>1?"start":i===rs.length-1&&rs.length>1?"end":"middle"}">${esc(dateProgres(r.date,true))}</text>`;
      });
    }
    return h+"</svg>";
  }

      <div class="progression-graphique"><div class="progression-legende"><span><i></i> Mots corrects par minute</span>${p.objectif.valeur!==null?'<span><i class="progression-tiret"></i> Objectif</span>':""}${p.mesures.some(r=>r.typeLecture==="defi")?'<span><i class="progression-losange"></i> Défi du 4ᵉ soir</span>':""}</div>${p.mesures.length?grapheProgres(p.mesures,p.objectif.valeur,compacte||innerWidth<680):`<div class="progression-vide"><span aria-hidden="true">↗</span><h3>${p.nombre?"Pas encore de mesure à tracer":"Pas encore de lecture"}</h3><p>${etat.texte?"Aucune lecture pour ce texte":"Les lectures "+(foyer?"faites à la maison":"faites en classe")} ${p.nombre?"avec un score et une date valides.":etat.texte?" "+lieu.toLocaleLowerCase("fr")+".":"apparaîtront ici."}</p></div>`}</div><p class="progression-note">${etat.texte?"Lectures de ce texte, dans l’ordre chronologique.":"Plusieurs textes peuvent avoir des difficultés différentes. Choisis un texte pour comparer ses lectures."}${foyer?" Bilans déclarés par la famille.":""}</p>
      </section><details class="progression-carte progression-lectures" id="tous"${etat.tous?" open":""}><summary>Les lectures <span>${p.nombre}</span></summary><div id="progression-lectures">${p.lectures.length?p.lectures.slice().reverse().map(r=>{const durs=motsDifficiles(r);return `<details class="progression-lecture" data-progress-lecture="${esc(r.id)}"${etat.ouverts.has(r.id)?" open":""}><summary><span class="progression-lecture-texte">${esc(titreProgres(r))}<small>${esc(dateProgres(r.date))} · lecture ${r.essai}</small>${badgeLecture(r)}</span><span class="progression-lecture-score">${Number.isSafeInteger(r.mclm)&&r.mclm>=0?r.mclm:"—"}<small>MCLM</small></span></summary><div class="progression-lecture-detail"><dl><div><dt>Mots lus</dt><dd>${esc(r.lus??"—")}</dd></div><div><dt>Erreurs</dt><dd>${esc(r.erreurs??"—")}</dd></div><div><dt>Temps</dt><dd>${esc(r.secondes??"—")} s</dd></div></dl>${durs.length?`<p class="label">Mots à retravailler</p><div class="hard">${durs.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:""}<button type="button" class="btn danger" data-suppr="${esc(r.id)}">Supprimer cette lecture</button><p class="muted progression-suppression-info" role="status"></p></div></details>`;}).join(""):'<p class="muted">Les prochaines lectures seront consultables ici.</p>'}</div></details>`:`<section class="progression-carte progression-bienvenue"><div class="progression-bienvenue-icone" aria-hidden="true"><svg viewBox="0 0 80 80"><path d="M14 60h54M18 54V38m18 16V27m18 27V15"/><path class="progression-fleche" d="m17 28 18-13 15 3 17-12m-10 0h10v10"/></svg></div><h2>Choisis un élève</h2><p>Retrouve ses lectures ${foyer?"à la maison":"en classe"},<br>ses progrès et son objectif.</p></section>`}</div></div>

  function vueEleves(box){
